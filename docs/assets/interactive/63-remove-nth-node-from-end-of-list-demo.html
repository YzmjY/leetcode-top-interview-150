<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>63. 删除链表倒数第N个结点 - 可视化演示</title>
<style>
:root {
  --bg: #f8f9fa; --card-bg: #fff; --text: #212529; --text-secondary: #6c757d;
  --border: #dee2e6; --btn-bg: #e9ecef; --btn-hover: #dee2e6; --btn-active: #0d6efd;
  --btn-active-text: #fff; --node-bg: #e9ecef;
  --blue: #228be6; --green: #40c057; --red: #fa5252; --orange: #fd7e14;
  --step-bg: #e7f5ff;
}
@media (prefers-color-scheme: dark) {
:root {
  --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
  --border: #3a3a5c; --btn-bg: #2a2a4a; --btn-hover: #3a3a5c; --btn-active: #339af0;
  --btn-active-text: #fff; --node-bg: #2a2a4a; --step-bg: #1a2a3a;
}
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center; padding: 20px;
}
.container {
  width: 100%; max-width: 950px; height: 500px;
  background: var(--card-bg); border-radius: 8px;
  border: 1px solid var(--border); padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.step-panel {
  background: var(--step-bg); border-radius: 8px; padding: 8px 16px;
  display: flex; justify-content: space-between; align-items: center; font-size: 14px;
}
.step-num { font-weight: 700; color: var(--btn-active); }
.step-desc { flex: 1; margin-left: 16px; }
.svg-area { flex: 1; display: flex; justify-content: center; align-items: center; }
.controls {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.controls button {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--btn-bg); color: var(--text); cursor: pointer;
  font-size: 13px; font-family: inherit; transition: all 0.15s;
}
.controls button:hover { background: var(--btn-hover); }
.controls button.active { background: var(--btn-active); color: var(--btn-active-text); border-color: var(--btn-active); }
</style>
</head>
<body>
<div class="container">
  <div class="step-panel">
    <span class="step-num" id="stepNum">步骤 0 / 0</span>
    <span class="step-desc" id="stepDesc">初始状态</span>
  </div>
  <div class="svg-area"><svg id="svg" viewBox="0 0 900 240"></svg></div>
  <div class="controls">
    <button onclick="reset()">重置</button>
    <button onclick="prevStep()">上步</button>
    <button onclick="nextStep()">下步</button>
    <button id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button onclick="goEnd()">跳到最后</button>
  </div>
</div>
<script>
// List: 1->2->3->4->5, n=2 (remove 4)
const vals = [1, 2, 3, 4, 5];
const n = 2;
const pos = [{x:50,y:110},{x:200,y:110},{x:350,y:110},{x:500,y:110},{x:650,y:110}];
const R = 22;
const steps = [];
let stepIdx = -1;

function buildSteps() {
  steps.length = 0;
  steps.push({ vals: [...vals], fast: -1, slow: -1, removed: -1, desc: '初始状态: [1,2,3,4,5], n=2 (删除倒数第2个=4)', phase: 0 });

  // Fast pointer advances n steps
  steps.push({ vals: [...vals], fast: 1, slow: -1, removed: -1, desc: '快指针先走1步: fast指向节点2', phase: 1 });
  steps.push({ vals: [...vals], fast: 2, slow: -1, removed: -1, desc: '快指针再走1步: fast指向节点3 (共走n=2步)', phase: 1 });

  // Both move together
  steps.push({ vals: [...vals], fast: 3, slow: 0, removed: -1, desc: '快慢指针同时前进: fast→4, slow→1', phase: 2 });
  steps.push({ vals: [...vals], fast: 4, slow: 1, removed: -1, desc: '继续前进: fast→5, slow→2', phase: 2 });

  // fast reaches end
  steps.push({ vals: [...vals], fast: -1, slow: 2, removed: 3, desc: '快指针到达末尾(null)，慢指针指向待删除节点的前驱(3)，删除节点4', phase: 3 });

  // Result
  const result = [1, 2, 3, 5];
  steps.push({ vals: [...result], fast: -1, slow: -1, removed: -1, desc: '完成！删除倒数第2个节点后: 1->2->3->5', phase: 4 });
}

function renderSVG() {
  const st = steps[Math.min(stepIdx, steps.length - 1)];
  document.getElementById('stepNum').textContent = `步骤 ${stepIdx + 1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent = st.desc;

  const svg = document.getElementById('svg');
  let html = `<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--text-secondary)"/>
    </marker>
  </defs>`;

  // Use original positions but map to current vals
  const displayVals = st.vals;
  // Arrows
  for (let i = 0; i < displayVals.length - 1; i++) {
    html += `<line x1="${pos[i].x + R + 2}" y1="${pos[i].y}" x2="${pos[i+1].x - R - 2}" y2="${pos[i+1].y}" stroke="var(--text-secondary)" stroke-width="2" marker-end="url(#arrow)"/>`;
  }

  // Nodes
  for (let i = 0; i < displayVals.length; i++) {
    const isFast = st.fast === i;
    const isSlow = st.slow === i;
    const isRemoved = st.removed === i;
    let stroke = 'var(--blue)', fill = 'var(--node-bg)';
    if (isFast) { stroke = 'var(--red)'; fill = 'rgba(250,82,82,0.1)'; }
    if (isSlow) { stroke = 'var(--green)'; fill = 'rgba(64,192,87,0.1)'; }
    if (isRemoved) { stroke = 'var(--red)'; fill = 'rgba(250,82,82,0.15)'; }

    html += `<circle cx="${pos[i].x}" cy="${pos[i].y}" r="${R}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
      <text x="${pos[i].x}" y="${pos[i].y + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)" font-family="Consolas,monospace">${displayVals[i]}</text>`;

    if (isFast) html += `<text x="${pos[i].x}" y="${pos[i].y - 36}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--red)">fast</text>`;
    if (isSlow) html += `<text x="${pos[i].x}" y="${pos[i].y - 36}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--green)">slow</text>`;
    if (isRemoved) html += `<line x1="${pos[i].x - R}" y1="${pos[i].y - R}" x2="${pos[i].x + R}" y2="${pos[i].y + R}" stroke="var(--red)" stroke-width="2"/><line x1="${pos[i].x + R}" y1="${pos[i].y - R}" x2="${pos[i].x - R}" y2="${pos[i].y + R}" stroke="var(--red)" stroke-width="2"/>`;
  }

  // Legend
  html += `<rect x="10" y="170" width="260" height="50" rx="8" fill="var(--btn-bg)" stroke="var(--border)"/>
    <text x="30" y="190" font-size="12"><tspan fill="var(--red)" font-weight="700">fast</tspan> 领先 n=2 步 | <tspan fill="var(--green)" font-weight="700">slow</tspan> 落后 n 步</text>
    <text x="30" y="208" font-size="12" fill="var(--text-secondary)">fast到末尾时 slow恰好指向待删节点的前驱</text>`;

  svg.innerHTML = html;
  document.getElementById('autoBtn').classList.toggle('active', autoRunning);
}

function reset() { stopAuto(); stepIdx = 0; renderSVG(); }
function prevStep() { stopAuto(); if (stepIdx > 0) stepIdx--; renderSVG(); }
function nextStep() { stopAuto(); if (stepIdx < steps.length - 1) stepIdx++; renderSVG(); }
function goEnd() { stopAuto(); stepIdx = steps.length - 1; renderSVG(); }

let autoRunning = false, autoTimer = null;
function toggleAuto() { autoRunning ? stopAuto() : startAuto(); }
function startAuto() { autoRunning = true; renderSVG(); autoStep(); }
function stopAuto() { autoRunning = false; if (autoTimer) clearTimeout(autoTimer); renderSVG(); }
function autoStep() {
  if (!autoRunning) return;
  if (stepIdx < steps.length - 1) { stepIdx++; renderSVG(); autoTimer = setTimeout(autoStep, 900); }
  else stopAuto();
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});
buildSteps();
reset();
</script>
</body>
</html>
