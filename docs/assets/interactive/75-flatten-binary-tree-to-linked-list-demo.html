<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉树展开为链表</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:900px;width:100%}
h2{text-align:center;color:var(--header);font-size:17px;margin-bottom:8px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px;font-size:14px}
.step-num{font-weight:bold;font-size:22px;color:#1976D2;min-width:36px;text-align:center}
.step-desc{color:var(--muted);font-size:12px;max-width:600px;text-align:center}
svg{display:block;margin:0 auto;width:100%;height:430px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
button{padding:7px 15px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:12px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
</style>
</head>
<body>
<div class="container">
<h2>二叉树展开为链表 — 右子树接到左子树最右节点</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">树结构：[1,2,5,3,4,null,6] · 展开为右链表</span>
</div>
<svg id="treeSvg" viewBox="0 0 880 400"></svg>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
// Define node positions for each step
const stepTrees=[
[{x:440,y:50,val:1,l:1,r:2},{x:240,y:150,val:2,l:3,r:4},{x:640,y:150,val:5,l:-1,r:5},{x:140,y:260,val:3,l:-1,r:-1},{x:340,y:260,val:4,l:-1,r:-1},{x:740,y:260,val:6,l:-1,r:-1}],
// Step1: process node 2 - its left 3->right 4, then 2.left=null
[{x:440,y:50,val:1,l:1,r:2},{x:240,y:150,val:2,l:-1,r:3},{x:640,y:150,val:5,l:-1,r:5},{x:140,y:260,val:3,l:-1,r:4},{x:240,y:340,val:4,l:-1,r:-1},{x:740,y:260,val:6,l:-1,r:-1}],
// Step2: process node 1 - right subtree 5 connected to rightmost of left (4), then left becomes right
[{x:440,y:50,val:1,l:-1,r:1},{x:500,y:100,val:2,l:-1,r:3},{x:600,y:150,val:3,l:-1,r:4},{x:700,y:200,val:4,l:-1,r:2},{x:800,y:250,val:5,l:-1,r:5},{x:800,y:310,val:6,l:-1,r:-1}]
];

const steps=[
{desc:'初始状态：根1，左2(左3右4) 右5(右6)',ti:0,hl:[]},
{desc:'步骤1：处理节点2，将2的左子树3展开，3.right=4，2.left=null',ti:1,hl:[1,3,4]},
{desc:'步骤2：处理根节点1，将右子树5接到左子树最右节点4，然后将左子树变为右子树',ti:2,hl:[0,2,5]},
{desc:'完成！链表：1->2->3->4->5->6',ti:2,hl:[0,1,2,3,4,5]}
];

let cur=0,autoTimer=null,autoRun=false;
const svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;

const t=stepTrees[s.ti];
let html='<defs><radialGradient id="gBlue"><stop offset="0%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#1976D2"/></radialGradient><radialGradient id="gOr"><stop offset="0%" stop-color="#FFB74D"/><stop offset="100%" stop-color="#FF9800"/></radialGradient></defs><rect width="880" height="400" fill="transparent"/>';
for(let i=0;i<t.length;i++){
if(t[i].l>=0){
const b=t[t[i].l];
html+=`<line x1="${t[i].x}" y1="${t[i].y+24}" x2="${b.x}" y2="${b.y-24}" stroke="#4CAF50" stroke-width="2"/>`;
}
if(t[i].r>=0){
const b=t[t[i].r];
html+=`<line x1="${t[i].x}" y1="${t[i].y+24}" x2="${b.x}" y2="${b.y-24}" stroke="#1976D2" stroke-width="2"/>`;
}
}
for(let i=0;i<t.length;i++){
const n=t[i];const isHL=s.hl.includes(i);
const fill=isHL?(cur===2?'url(#gOr)':'url(#gBlue)'):'var(--sub-bg)';
html+=`<circle cx="${n.x}" cy="${n.y}" r="21" fill="${fill}" stroke="${isHL?'#0D47A1':'var(--cell-border)'}" stroke-width="${isHL?3:2}"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="${isHL?'#fff':'var(--text)'}" font-size="14" font-weight="bold">${n.val}</text>`;
}
// Legend
if(cur>0)html+=`<text x="20" y="390" fill="#4CAF50" font-size="11">绿线=左子</text><text x="100" y="390" fill="#1976D2" font-size="11">蓝线=右子</text>`;
svg.innerHTML=html;
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},1000);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
