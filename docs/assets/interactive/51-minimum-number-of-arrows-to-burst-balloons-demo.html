<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222; --sub-bg: #f5f5f5;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --sort-key: #1976D2; --arrow-color: #E53935;
    --burst-color: #388E3C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd; --btn-bg: #333; --btn-hover: #444;
      --sub-bg: #252540;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 16px 20px;
  }
  .container { max-width: 860px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 4px; }
  .sub-title { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 8px; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px;
    font-size: 14px; flex-wrap: wrap;
  }
  .step-num { font-weight: bold; font-size: 24px; color: #1976D2; min-width: 36px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; max-width: 560px; text-align: center; }

  .balloon-row { display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 6px; }
  .balloon {
    display: flex; align-items: center; justify-content: center;
    padding: 6px 14px; border: 2px solid var(--cell-border); border-radius: 8px;
    font-size: 14px; font-weight: bold; background: var(--cell-bg); color: var(--text);
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
    font-family: monospace; position: relative;
  }
  .balloon.cur { border-color: var(--sort-key); background: rgba(25,118,210,0.12); transform: scale(1.06); z-index: 2; }
  .balloon.burst { border-color: var(--burst-color); background: rgba(56,142,60,0.12); }
  .balloon.new-arrow { border-color: var(--arrow-color); background: rgba(229,57,53,0.12); }
  .balloon.sorted { border-color: var(--sort-key); border-style: dashed; }

  .visual-row { display: flex; align-items: flex-end; gap: 10px; justify-content: center; margin-bottom: 6px; flex-wrap: wrap; }
  .vbar-col { display: flex; flex-direction: column; align-items: center; width: 70px; }
  .vbar {
    width: 60px; border-radius: 4px 4px 0 0;
    transition: height 0.3s, background 0.3s; position: relative;
  }
  .vbar-label { font-size: 10px; margin-top: 2px; font-weight: bold; text-align: center; }

  .state-row {
    display: flex; justify-content: center; gap: 14px;
    background: var(--sub-bg); border-radius: 8px;
    padding: 8px 14px; margin-bottom: 6px; font-size: 13px;
    flex-wrap: wrap;
  }
  .state-item { text-align: center; min-width: 50px; }
  .state-val { font-size: 16px; font-weight: bold; font-family: monospace; }
  .state-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sv-arrow .state-val { color: var(--arrow-color); }
  .sv-count .state-val { color: var(--burst-color); }

  .result-row {
    background: var(--sub-bg); border-radius: 8px; padding: 8px 14px;
    margin-bottom: 6px; font-size: 13px; text-align: center;
  }
  .result-row .highlight { font-weight: bold; font-size: 15px; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }
</style>
</head>
<body>
<div class="container">
  <h2>用最少数量的箭引爆气球 — 排序右边界演示</h2>
  <div class="sub-title">points=[[10,16],[2,8],[1,6],[7,12]] &rarr; 按右边界排序 &rarr; 需要2支箭</div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">初始状态 · 点击「下一步」开始</span>
  </div>

  <div class="balloon-row" id="balloonRow"></div>

  <div class="state-row">
    <div class="state-item sv-arrow"><div class="state-val" id="arrowPos">--</div><div class="state-label">当前箭位置</div></div>
    <div class="state-item sv-count"><div class="state-val" id="arrowCount">0</div><div class="state-label">箭数量</div></div>
    <div class="state-item"><div class="state-val" id="curBalloon">--</div><div class="state-label">当前气球</div></div>
  </div>

  <div class="result-row">
    <span style="color:var(--muted)">结果: </span><span id="resultText" class="highlight" style="color:#1976D2;">进行中...</span>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">&#x23EE; 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">&#x25C0; 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 &#x25B6;</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">&#x25B6; 自动播放</button>
    <button onclick="goStep(steps.length-1)">&#x23ED; 跳到最后</button>
  </div>
</div>

<script>
const points = [[10,16],[2,8],[1,6],[7,12]];
// Sort by right boundary
const sorted = [...points].sort((a, b) => a[1] - b[1]);
// sorted: [[1,6],[2,8],[7,12],[10,16]]

const steps = [];

function clonePoints(arr) { return arr.map(p => [...p]); }

function simulate() {
  steps.push({
    desc: '初始状态 · 原数组: [[10,16],[2,8],[1,6],[7,12]], 按右边界排序后: [[1,6],[2,8],[7,12],[10,16]]',
    phase: 'init', sorted: clonePoints(sorted),
    arrowPos: null, arrowCount: 0, curIdx: -1,
    balloonStates: sorted.map(() => ''),
    result: 'init'
  });

  let arrows = 0;
  let arrowPos = null;
  const balloonStates = sorted.map(() => '');

  for (let i = 0; i < sorted.length; i++) {
    const [start, end] = sorted[i];

    if (arrowPos === null || start > arrowPos) {
      // Need new arrow
      arrowPos = end;
      arrows++;
      steps.push({
        desc: '气球[' + start + ',' + end + ']: start=' + start + ' > 当前箭位置=' + (arrowPos === end ? 'none' : arrowPos) + ', 需要新箭! 新箭位置=' + end,
        phase: 'new-arrow', sorted: clonePoints(sorted),
        arrowPos, arrowCount: arrows, curIdx: i,
        balloonStates: sorted.map((_, j) => j < i ? 'burst' : (j === i ? 'new-arrow' : '')),
        result: 'processing'
      });
    } else {
      steps.push({
        desc: '气球[' + start + ',' + end + ']: start=' + start + ' <= 箭位置=' + arrowPos + ', 被当前箭射破!',
        phase: 'burst', sorted: clonePoints(sorted),
        arrowPos, arrowCount: arrows, curIdx: i,
        balloonStates: sorted.map((_, j) => j < i ? 'burst' : (j === i ? 'burst' : '')),
        result: 'processing'
      });
    }
  }

  steps.push({
    desc: '全部处理完毕! 共需要 ' + arrows + ' 支箭.',
    phase: 'done', sorted: clonePoints(sorted),
    arrowPos, arrowCount: arrows, curIdx: -1,
    balloonStates: sorted.map(() => 'burst'),
    result: 'done'
  });
}

simulate();

let current = 0;
let autoTimer = null;
let autoRunning = false;

const balloonRow = document.getElementById('balloonRow');
sorted.forEach(([a, b], i) => {
  const el = document.createElement('span');
  el.className = 'balloon'; el.id = 'bln' + i;
  el.textContent = '[' + a + ',' + b + ']';
  balloonRow.appendChild(el);
  if (i < sorted.length - 1) {
    const comma = document.createElement('span');
    comma.textContent = ',';
    comma.style.color = 'var(--muted)';
    comma.style.fontSize = '14px';
    balloonRow.appendChild(comma);
  }
});

function render() {
  const s = steps[current];
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = s.desc;
  document.getElementById('arrowPos').textContent = s.arrowPos !== null ? String(s.arrowPos) : '--';
  document.getElementById('arrowCount').textContent = String(s.arrowCount);
  document.getElementById('curBalloon').textContent = s.curIdx >= 0 ? '[' + s.sorted[s.curIdx][0] + ',' + s.sorted[s.curIdx][1] + ']' : '--';

  for (let i = 0; i < sorted.length; i++) {
    document.getElementById('bln' + i).className = 'balloon';
  }
  if (s.balloonStates) {
    s.balloonStates.forEach((st, i) => {
      if (st) document.getElementById('bln' + i).className = 'balloon ' + st;
    });
  }

  const rt = document.getElementById('resultText');
  if (s.result === 'done') {
    rt.textContent = String(s.arrowCount) + ' 支箭';
    rt.style.color = '#388E3C';
  } else if (s.result === 'init') { rt.textContent = '进行中...'; rt.style.color = '#1976D2'; }
  else { rt.textContent = String(s.arrowCount) + ' 支箭 (处理中)'; rt.style.color = '#1976D2'; }

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= steps.length - 1;
}

function goStep(n) {
  current = Math.max(0, Math.min(n, steps.length - 1));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer); autoRunning = false;
    document.getElementById('playBtn').textContent = '\u25B6 自动播放';
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
    document.getElementById('playBtn').classList.remove('play-btn');
  } else {
    autoRunning = true;
    document.getElementById('playBtn').textContent = '\u23F8 暂停';
    document.getElementById('playBtn').style.background = '#1976D2';
    document.getElementById('playBtn').style.color = '#fff';
    document.getElementById('playBtn').classList.add('play-btn');
    if (current >= steps.length - 1) goStep(0);
    autoTimer = setInterval(function() {
      if (current < steps.length - 1) goStep(current + 1);
      else toggleAuto();
    }, 1200);
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
