<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>19. 最后一个单词的长度</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f8f9fa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{width:100%;max-width:680px;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,.08);padding:28px 24px 20px}
h1{font-size:20px;font-weight:600;text-align:center;margin-bottom:6px;color:#1a1a2e}
.subtitle{text-align:center;font-size:13px;color:#888;margin-bottom:16px}
.grid-wrapper{display:flex;justify-content:center;margin-bottom:12px}
.grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.cell{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;border-radius:8px;border:1.5px solid #ddd;background:#fff;color:#333;transition:all .25s;position:relative}
.cell::after{content:attr(data-idx);position:absolute;bottom:2px;right:5px;font-size:9px;color:#aaa;font-weight:400}
.cell.scanning{background:#dbeafe;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.25);z-index:1}
.cell.skip{background:#f1f5f9;border-color:#cbd5e1;color:#94a3b8}
.cell.highlight{background:#bbf7d0;border-color:#22c55e;color:#14532d}
.cell.space{color:#ccc}
.info-panel{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-bottom:14px;text-align:center;font-size:14px;color:#475569;min-height:44px;display:flex;align-items:center;justify-content:center}
.info-panel .step-num{font-weight:600;color:#3b82f6;margin-right:6px}
.btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:8px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;color:#374151;transition:all .2s;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn:active{background:#e5e7eb}
.btn.primary{background:#3b82f6;color:#fff;border-color:#3b82f6}
.btn.primary:hover{background:#2563eb}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result-badge{display:inline-block;padding:4px 14px;border-radius:20px;background:#dcfce7;color:#166534;font-weight:600;font-size:15px;margin-left:8px}
@media(prefers-color-scheme:dark){
body{background:#0f172a}
.container{background:#1e293b;box-shadow:0 2px 16px rgba(0,0,0,.4)}
h1{color:#e2e8f0}
.subtitle{color:#94a3b8}
.cell{background:#1e293b;border-color:#334155;color:#cbd5e1}
.cell::after{color:#64748b}
.cell.scanning{background:rgba(59,130,246,.2);border-color:#3b82f6}
.cell.skip{background:rgba(100,116,139,.15);border-color:#475569;color:#64748b}
.cell.highlight{background:rgba(34,197,94,.2);border-color:#22c55e;color:#86efac}
.cell.space{color:#475569}
.info-panel{background:#0f172a;border-color:#334155;color:#cbd5e1}
.info-panel .step-num{color:#60a5fa}
.btn{background:#1e293b;border-color:#475569;color:#cbd5e1}
.btn:hover{background:#334155}
.btn.primary{background:#3b82f6;color:#fff;border-color:#3b82f6}
.result-badge{background:rgba(34,197,94,.2);color:#86efac}
}
</style>
</head>
<body>
<div class="container">
<h1>19. 最后一个单词的长度</h1>
<div class="subtitle">s = "Hello World" &nbsp; 预期输出: 5</div>
<div class="grid-wrapper"><div class="grid" id="grid"></div></div>
<div class="info-panel" id="info"><span class="step-num">准备</span>点击"下一步"或按 → 开始</div>
<div class="btn-row">
<button class="btn" id="btnReset" title="重置">↺ 重置</button>
<button class="btn" id="btnPrev" title="上一步 (←)">◀ 上一步</button>
<button class="btn primary" id="btnNext" title="下一步 (→)">下一步 ▶</button>
<button class="btn" id="btnAuto" title="自动播放 (空格)">▶ 自动播放</button>
<button class="btn" id="btnLast" title="跳到最后">⏭ 最后</button>
</div>
</div>
<script>
const S = "Hello World";
const chars = [...S];
const totalSteps = chars.length + 6; // scan right to left, skip spaces, count + show result

let step = 0;
let autoTimer = null;

const grid = document.getElementById('grid');
const info = document.getElementById('info');
const btnReset = document.getElementById('btnReset');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnAuto = document.getElementById('btnAuto');
const btnLast = document.getElementById('btnLast');

function buildGrid() {
  grid.innerHTML = '';
  chars.forEach((ch, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.textContent = ch;
    cell.setAttribute('data-idx', i);
    if (ch === ' ') cell.classList.add('space');
    grid.appendChild(cell);
  });
}

function render() {
  const cells = grid.querySelectorAll('.cell');
  cells.forEach(c => { c.className = 'cell'; if (c.textContent === ' ') c.classList.add('space'); });
  if (step === 0) {
    info.innerHTML = '<span class="step-num">准备</span>从右向左扫描，跳过末尾空格后计数最后一个单词的长度';
    updateButtons();
    return;
  }
  // Steps 1..chars.length: scanning from right, showing scan pointer (current idx from right)
  // Actually step 1..chars.length correspond to scanning positions from rightmost index
  const rightIdx = chars.length - step;
  if (step >= 1 && step <= chars.length) {
    if (rightIdx >= 0) {
      cells[rightIdx].classList.add('scanning');
    }
    info.innerHTML = `<span class="step-num">步骤 ${step}</span>扫描位置: 索引 ${rightIdx >= 0 ? rightIdx : 'N/A'}，字符 "${rightIdx >= 0 ? chars[rightIdx] : 'N/A'}"${rightIdx >= 0 && chars[rightIdx] === ' ' ? ' (空格，跳过)' : ''}`;
  }
  // Step chars.length+1: All spaces skipped
  if (step === chars.length + 1) {
    info.innerHTML = '<span class="step-num">步骤 ' + step + '</span>已跳过末尾空格，现在从 "d" 开始计数';
    // Highlight the counting zone: indices 6-10 for "World"
    for (let i = 6; i <= 10; i++) cells[i].classList.add('highlight');
    document.querySelector('.result-badge')?.remove();
  }
  if (step === chars.length + 2) {
    info.innerHTML = '<span class="step-num">步骤 ' + step + '</span>计数 "d" → 1';
    for (let i = 6; i <= 10; i++) cells[i].classList.add('highlight');
  }
  if (step === chars.length + 3) {
    info.innerHTML = '<span class="step-num">步骤 ' + step + '</span>计数 "l" → 2';
    for (let i = 6; i <= 10; i++) cells[i].classList.add('highlight');
  }
  if (step === chars.length + 4) {
    info.innerHTML = '<span class="step-num">步骤 ' + step + '</span>计数 "r" → 3';
    for (let i = 6; i <= 10; i++) cells[i].classList.add('highlight');
  }
  if (step === chars.length + 5) {
    info.innerHTML = '<span class="step-num">步骤 ' + step + '</span>计数 "o" → 4';
    for (let i = 6; i <= 10; i++) cells[i].classList.add('highlight');
  }
  if (step >= chars.length + 6) {
    for (let i = 6; i <= 10; i++) cells[i].classList.add('highlight');
    info.innerHTML = '<span class="step-num">步骤 ' + step + '</span>计数 "W" → 5，遇到空格停止！最后一个单词 "World" 长度 = <span class="result-badge">5</span>';
  }
  updateButtons();
}

function updateButtons() {
  btnPrev.disabled = step <= 0;
  btnNext.disabled = step >= totalSteps;
}

function nextStep() { if (step < totalSteps) { step++; render(); } }
function prevStep() { if (step > 0) { step--; render(); } }
function resetAll() { stopAuto(); step = 0; render(); }
function goLast() { stopAuto(); step = totalSteps; render(); }

function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; btnAuto.textContent = '▶ 自动播放'; } }
function toggleAuto() {
  if (autoTimer) { stopAuto(); return; }
  if (step >= totalSteps) step = 0;
  btnAuto.textContent = '⏸ 暂停';
  autoTimer = setInterval(() => { nextStep(); if (step >= totalSteps) stopAuto(); }, 600);
}

btnReset.onclick = resetAll;
btnPrev.onclick = prevStep;
btnNext.onclick = nextStep;
btnAuto.onclick = toggleAuto;
btnLast.onclick = goLast;

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

buildGrid();
render();
</script>
</body>
</html>
