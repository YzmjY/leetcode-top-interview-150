<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --sub-bg: #f5f5f5;
    --i-red: #E53935; --i-bg: #FFEBEE;
    --l-blue: #1976D2; --l-bg: #E3F2FD;
    --r-orange: #FF9800; --r-bg: #FFF3E0;
    --found-green: #388E3C; --found-bg: #E8F5E9;
    --skip-dash: #bdbdbd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd;
      --btn-bg: #333; --btn-hover: #444;
      --sub-bg: #252540;
      --i-bg: rgba(229,57,53,0.18);
      --l-bg: rgba(25,118,210,0.18);
      --r-bg: rgba(255,152,0,0.18);
      --found-bg: rgba(56,142,60,0.22);
      --skip-dash: #555;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 16px 20px;
  }
  .container { max-width: 880px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 8px; }
  .sub-title { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px;
    font-size: 14px; flex-wrap: wrap;
  }
  .step-num { font-weight: bold; font-size: 24px; color: #1976D2; min-width: 36px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; max-width: 560px; text-align: center; }

  .state-row {
    display: flex; justify-content: center; gap: 14px;
    background: var(--sub-bg); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 8px; font-size: 13px;
    flex-wrap: wrap;
  }
  .state-item { text-align: center; min-width: 60px; }
  .state-val { font-size: 18px; font-weight: bold; font-family: monospace; }
  .state-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sv-i .state-val { color: var(--i-red); }
  .sv-l .state-val { color: var(--l-blue); }
  .sv-r .state-val { color: var(--r-orange); }
  .sv-sum .state-val { color: #7B1FA2; }

  .found-row {
    display: flex; justify-content: center; gap: 12px; margin-bottom: 8px;
    font-size: 13px; color: var(--text); min-height: 24px; align-items: center;
    flex-wrap: wrap;
  }
  .found-row .flabel { color: var(--muted); font-size: 12px; }
  .found-tag {
    background: var(--found-bg); color: var(--found-green); font-weight: bold;
    border: 1px solid var(--found-green); border-radius: 6px;
    padding: 3px 10px; font-family: monospace; font-size: 14px;
  }

  .section-label { font-size: 12px; font-weight: bold; color: var(--muted); text-align: center; margin-bottom: 4px; }

  .cell-grid {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    flex-wrap: wrap; margin-bottom: 2px;
  }
  .cell {
    background: var(--cell-bg);
    border: 2px solid var(--cell-border);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 17px; font-weight: bold; color: var(--text);
    width: 60px; height: 56px;
    position: relative;
    transition: border-color 0.25s, background 0.25s, transform 0.15s, border-style 0.25s;
  }
  .cell .idx { font-size: 9px; color: var(--muted); line-height: 1; margin-top: 2px; }

  .cell.c-i { border-color: var(--i-red); background: var(--i-bg); transform: scale(1.05); z-index: 2; }
  .cell.c-l { border-color: var(--l-blue); background: var(--l-bg); transform: scale(1.05); z-index: 2; }
  .cell.c-r { border-color: var(--r-orange); background: var(--r-bg); transform: scale(1.05); z-index: 2; }
  .cell.c-found { border-color: var(--found-green); background: var(--found-bg); transform: scale(1.05); z-index: 2; }
  .cell.c-skip { border-color: var(--skip-dash); border-style: dashed; background: var(--cell-bg); opacity: 0.6; }
  .cell.c-skip-i { border-color: var(--i-red); border-style: dashed; background: var(--cell-bg); opacity: 0.55; }
  .cell.c-skip-l { border-color: var(--l-blue); border-style: dashed; background: var(--cell-bg); opacity: 0.55; }
  .cell.c-skip-r { border-color: var(--r-orange); border-style: dashed; background: var(--cell-bg); opacity: 0.55; }
  .cell.c-final { border-color: var(--found-green); background: var(--found-bg); }

  .step-tag {
    position: absolute; top: -7px; right: -7px;
    background: #1976D2; color: #fff;
    font-size: 9px; font-weight: bold; width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.5);
    transition: opacity 0.25s, transform 0.25s;
  }
  .step-tag.show { opacity: 1; transform: scale(1); }

  .arrow-row {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin-bottom: 4px; min-height: 22px; flex-wrap: wrap;
  }
  .arrow-slot {
    width: 60px; text-align: center; font-size: 10px; font-weight: bold;
    color: var(--muted);
  }

  .result-row {
    background: var(--sub-bg); border-radius: 8px; padding: 10px 14px;
    margin-bottom: 10px; font-size: 13px; text-align: center; color: var(--text);
  }
  .result-row .highlight { color: #1976D2; font-weight: bold; font-size: 15px; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }

  .legend {
    display: flex; gap: 14px; justify-content: center; margin-top: 10px;
    font-size: 12px; color: var(--muted); flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .legend-dash { width: 12px; height: 0; border-top: 2px dashed var(--skip-dash); }

  @media (max-width: 650px) {
    .cell { width: 46px; height: 46px; font-size: 14px; }
    .cell .idx { font-size: 7px; }
    .arrow-slot { width: 46px; font-size: 8px; }
    .cell-grid, .arrow-row { gap: 2px; }
    .state-row { gap: 6px; }
    .state-val { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <h2>三数之和 — 逐步交互演示</h2>
  <div class="sub-title">nums = [-1, 0, 1, 2, -1, -4] → 排序后 [-4, -1, -1, 0, 1, 2] → [[-1, -1, 2], [-1, 0, 1]]</div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">初始状态 · 点击「下一步」开始</span>
  </div>

  <div class="state-row">
    <div class="state-item sv-i"><div class="state-val" id="iIdx">--</div><div class="state-label">i (固定)</div></div>
    <div class="state-item sv-l"><div class="state-val" id="lIdx">--</div><div class="state-label">left</div></div>
    <div class="state-item sv-r"><div class="state-val" id="rIdx">--</div><div class="state-label">right</div></div>
    <div class="state-item sv-sum"><div class="state-val" id="sumVal">--</div><div class="state-label">三数之和</div></div>
    <div class="state-item"><div class="state-val" id="cmpVal" style="color:var(--muted);">--</div><div class="state-label">判定</div></div>
  </div>

  <div class="found-row">
    <span class="flabel">已找到: </span><span id="foundList"></span>
  </div>

  <div class="section-label">排序后数组</div>
  <div class="cell-grid" id="cellGrid"></div>
  <div class="arrow-row" id="arrowRow"></div>

  <div class="result-row" id="resultBar">
    <span style="color:var(--muted)">结果: </span><span id="resultText" class="highlight">进行中...</span>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">&#x23EE; 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">&#x25C0; 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 &#x25B6;</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">&#x25B6; 自动播放</button>
    <button onclick="goStep(steps.length-1)">&#x23ED; 跳到最后</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#E53935"></div>i (固定)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1976D2"></div>left</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF9800"></div>right</div>
    <div class="legend-item"><div class="legend-dot" style="background:#388E3C"></div>找到三元组</div>
    <div class="legend-item"><div class="legend-dash"></div>重复(跳过)</div>
  </div>
</div>

<script>
const sorted = [-4, -1, -1, 0, 1, 2];

const steps = [];
const foundSoFar = [];

(function simulate() {
  steps.push({
    iIdx: -1, lIdx: -1, rIdx: -1,
    cellStates: sorted.map(() => 'default'),
    desc: '初始状态 · 数组排序: [-4, -1, -1, 0, 1, 2] · 点击「下一步」开始',
    sum: null, cmp: null, found: []
  });

  for (let i = 0; i < sorted.length - 2; i++) {
    if (i > 0 && sorted[i] === sorted[i - 1]) {
      const st = sorted.map(() => 'default');
      st[i] = 'c-skip-i'; st[i - 1] = 'c-skip';
      steps.push({
        iIdx: i, lIdx: -1, rIdx: -1, cellStates: st,
        desc: `跳过重复 i: sorted[${i}]=${sorted[i]} == sorted[${i-1}]=${sorted[i-1]} (去重) → i 继续+1`,
        sum: null, cmp: null, found: [...foundSoFar]
      });
      continue;
    }

    const stI = sorted.map(() => 'default');
    stI[i] = 'c-i';
    steps.push({
      iIdx: i, lIdx: -1, rIdx: -1, cellStates: stI,
      desc: `固定 i=${i}, sorted[${i}]=${sorted[i]}. 准备双指针搜索 left=${i+1}, right=${sorted.length-1}`,
      sum: null, cmp: null, found: [...foundSoFar]
    });

    let left = i + 1, right = sorted.length - 1;
    while (left < right) {
      const sum = sorted[i] + sorted[left] + sorted[right];
      const stAct = sorted.map(() => 'default');
      stAct[i] = 'c-i'; stAct[left] = 'c-l'; stAct[right] = 'c-r';

      steps.push({
        iIdx: i, lIdx: left, rIdx: right, cellStates: stAct,
        desc: `sum = ${sorted[i]}+${sorted[left]}+${sorted[right]} = ${sum}`,
        sum, cmp: sum === 0 ? '==' : (sum < 0 ? '<' : '>'), found: [...foundSoFar]
      });

      if (sum === 0) {
        foundSoFar.push([sorted[i], sorted[left], sorted[right]]);
        const stF = sorted.map(() => 'default');
        stF[i] = 'c-found'; stF[left] = 'c-found'; stF[right] = 'c-found';
        steps.push({
          iIdx: i, lIdx: left, rIdx: right, cellStates: stF,
          desc: `找到三元组! [${sorted[i]}, ${sorted[left]}, ${sorted[right]}], sum=0`,
          sum: 0, cmp: '==', found: [...foundSoFar]
        });

        left++; right--;
        while (left < right && sorted[left] === sorted[left - 1]) {
          const stDup = sorted.map(() => 'default');
          stDup[i] = 'c-i'; stDup[left - 1] = 'c-skip-l'; stDup[left] = 'c-skip-l';
          steps.push({
            iIdx: i, lIdx: left, rIdx: right, cellStates: stDup,
            desc: `跳过重复 left: sorted[${left}]=${sorted[left]}==sorted[${left-1}]=${sorted[left-1]} (去重) → left++`,
            sum: null, cmp: null, found: [...foundSoFar]
          });
          left++;
        }
        while (left < right && sorted[right] === sorted[right + 1]) {
          const stDup = sorted.map(() => 'default');
          stDup[i] = 'c-i'; stDup[right + 1] = 'c-skip-r'; stDup[right] = 'c-skip-r';
          steps.push({
            iIdx: i, lIdx: left, rIdx: right, cellStates: stDup,
            desc: `跳过重复 right: sorted[${right}]=${sorted[right]}==sorted[${right+1}]=${sorted[right+1]} (去重) → right--`,
            sum: null, cmp: null, found: [...foundSoFar]
          });
          right--;
        }
      } else if (sum < 0) {
        steps.push({
          iIdx: i, lIdx: left, rIdx: right, cellStates: stAct,
          desc: `sum=${sum} < 0 → left 右移 (${left}→${left+1})`,
          sum, cmp: '<', found: [...foundSoFar]
        });
        left++;
      } else {
        steps.push({
          iIdx: i, lIdx: left, rIdx: right, cellStates: stAct,
          desc: `sum=${sum} > 0 → right 左移 (${right}→${right-1})`,
          sum, cmp: '>', found: [...foundSoFar]
        });
        right--;
      }
    }
  }

  const finalSt = sorted.map(() => 'c-final');
  steps.push({
    iIdx: -1, lIdx: -1, rIdx: -1, cellStates: finalSt,
    desc: `算法完成! i 遍历完毕 → 共找到 ${foundSoFar.length} 个三元组: [[-1,-1,2], [-1,0,1]]`,
    sum: null, cmp: null, found: [...foundSoFar]
  });
})();

let current = 0;
let autoTimer = null;
let autoRunning = false;

const cellGrid = document.getElementById('cellGrid');
const arrowRow = document.getElementById('arrowRow');
for (let i = 0; i < sorted.length; i++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.id = 'cc' + i;
  cell.innerHTML = `<span>${sorted[i]}</span><span class="idx">[${i}]</span><span class="step-tag"></span>`;
  cellGrid.appendChild(cell);

  const arrow = document.createElement('div');
  arrow.className = 'arrow-slot';
  arrow.id = 'ar' + i;
  arrowRow.appendChild(arrow);
}

function render() {
  const s = steps[current];
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = s.desc;
  document.getElementById('iIdx').textContent = s.iIdx >= 0 ? s.iIdx : '--';
  document.getElementById('lIdx').textContent = s.lIdx >= 0 ? s.lIdx : '--';
  document.getElementById('rIdx').textContent = s.rIdx >= 0 ? s.rIdx : '--';
  document.getElementById('sumVal').textContent = s.sum !== null ? s.sum : '--';

  const cmpEl = document.getElementById('cmpVal');
  if (s.cmp === '<') { cmpEl.textContent = 'sum < 0'; cmpEl.style.color = 'var(--l-blue)'; }
  else if (s.cmp === '>') { cmpEl.textContent = 'sum > 0'; cmpEl.style.color = 'var(--r-orange)'; }
  else if (s.cmp === '==') { cmpEl.textContent = 'sum == 0'; cmpEl.style.color = 'var(--found-green)'; }
  else { cmpEl.textContent = '--'; cmpEl.style.color = 'var(--muted)'; }

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= steps.length - 1;

  const rText = document.getElementById('resultText');
  if (current >= steps.length - 1) {
    rText.textContent = '[[-1, -1, 2], [-1, 0, 1]]';
    rText.style.color = '#388E3C';
  } else {
    rText.textContent = '进行中...';
    rText.style.color = '#1976D2';
  }

  // Update found list
  const fl = document.getElementById('foundList');
  const found = s.found || [];
  fl.innerHTML = '';
  found.forEach((triple, idx) => {
    const tag = document.createElement('span');
    tag.className = 'found-tag';
    tag.textContent = '[' + triple.join(', ') + ']';
    fl.appendChild(tag);
    if (idx < found.length - 1) fl.appendChild(document.createTextNode(' '));
  });
  if (found.length === 0) { fl.innerHTML = '<span style="color:var(--muted);">暂无</span>'; }

  // Reset cells
  for (let i = 0; i < sorted.length; i++) {
    const cell = document.getElementById('cc' + i);
    cell.className = 'cell ' + (s.cellStates[i] === 'default' ? '' : s.cellStates[i]);
    const tag = cell.querySelector('.step-tag');
    tag.classList.remove('show');
    tag.textContent = '';
    document.getElementById('ar' + i).textContent = '';
    document.getElementById('ar' + i).className = 'arrow-slot';
  }

  if (s.iIdx >= 0) {
    document.getElementById('ar' + s.iIdx).textContent = 'i';
    document.getElementById('ar' + s.iIdx).className = 'arrow-slot';
    document.getElementById('ar' + s.iIdx).style.color = '#E53935';
    document.getElementById('ar' + s.iIdx).style.fontWeight = 'bold';
  }
  if (s.lIdx >= 0) {
    document.getElementById('ar' + s.lIdx).textContent = 'left';
    document.getElementById('ar' + s.lIdx).className = 'arrow-slot';
    document.getElementById('ar' + s.lIdx).style.color = '#1976D2';
    document.getElementById('ar' + s.lIdx).style.fontWeight = 'bold';
  }
  if (s.rIdx >= 0) {
    document.getElementById('ar' + s.rIdx).textContent = 'right';
    document.getElementById('ar' + s.rIdx).className = 'arrow-slot';
    document.getElementById('ar' + s.rIdx).style.color = '#FF9800';
    document.getElementById('ar' + s.rIdx).style.fontWeight = 'bold';
  }

  // Step tags
  if (s.iIdx >= 0) {
    const tag = document.getElementById('cc' + s.iIdx).querySelector('.step-tag');
    tag.textContent = '' + current;
    tag.classList.add('show');
  }
  if (s.lIdx >= 0 && s.lIdx !== s.iIdx) {
    const tag = document.getElementById('cc' + s.lIdx).querySelector('.step-tag');
    tag.textContent = '' + current;
    tag.classList.add('show');
  }
  if (s.rIdx >= 0 && s.rIdx !== s.iIdx && s.rIdx !== s.lIdx) {
    const tag = document.getElementById('cc' + s.rIdx).querySelector('.step-tag');
    tag.textContent = '' + current;
    tag.classList.add('show');
  }
}

function goStep(n) {
  current = Math.max(0, Math.min(n, steps.length - 1));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer);
    autoRunning = false;
    document.getElementById('playBtn').textContent = '\u25B6 自动播放';
    document.getElementById('playBtn').classList.remove('play-btn');
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
  } else {
    autoRunning = true;
    document.getElementById('playBtn').textContent = '\u23F8 暂停';
    document.getElementById('playBtn').classList.add('play-btn');
    document.getElementById('playBtn').style.background = '#1976D2';
    document.getElementById('playBtn').style.color = '#fff';
    if (current >= steps.length - 1) goStep(0);
    autoTimer = setInterval(function() {
      if (current < steps.length - 1) goStep(current + 1);
      else toggleAuto();
    }, 1000);
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
