<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>64. 删除排序链表中的重复元素 II - 交互演示</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<script src="demo.js"></script>
<script>
const VALS = [1, 2, 3, 3, 4, 4, 5];
// 节点 id：0 是 dummy 哨兵，1..7 对应 VALS
const NODE_VALS = [null].concat(VALS);

function valText(id) {
  return id === 0 ? 'dummy' : String(NODE_VALS[id]);
}

function buildSteps() {
  // 真实链表：dummy → 1 → 2 → 3 → 3 → 4 → 4 → 5 → nil，next 存节点 id
  const nodes = [{ id: 0, val: null, next: null }];
  VALS.forEach(function (v, i) { nodes.push({ id: i + 1, val: v, next: null }); });
  for (let i = 0; i < nodes.length - 1; i++) nodes[i].next = nodes[i + 1].id;

  const steps = [];
  const removed = [];
  let cur = 0;

  function chain() {
    const out = [];
    let p = 0;
    while (p !== null) { out.push(p); p = nodes[p].next; }
    return out;
  }

  function push(note, extra) {
    const step = { chain: chain(), cur: cur, removed: removed.slice(), pair: null, dupe: null, victim: null, cleared: null, note: note };
    if (extra) Object.keys(extra).forEach(function (k) { step[k] = extra[k]; });
    steps.push(step);
  }

  push('初始化：dummy 哨兵指向 head，cur 从 dummy 出发。与「重复元素保留一个」的第 I 题不同，本题要把重复值全部删光，头节点也可能被删（如 [1,1,1,2,3] 结果是 [2,3]），所以必须有 dummy。');

  while (nodes[cur].next !== null && nodes[nodes[cur].next].next !== null) {
    const a = nodes[cur].next;
    const b = nodes[a].next;

    if (nodes[a].val === nodes[b].val) {
      const val = nodes[a].val;
      push('比较 cur.Next = 节点 ' + a + '（值 ' + nodes[a].val + '）与 cur.Next.Next = 节点 ' + b + '（值 ' + nodes[b].val +
        '）：值相等 → 发现重复值 ' + val + '。因为重复节点一个都不能留，cur 先原地不动，把值为 ' + val + ' 的节点全部跳过。',
        { pair: [a, b], dupe: val });

      while (nodes[cur].next !== null && nodes[nodes[cur].next].val === val) {
        const victim = nodes[cur].next;
        nodes[cur].next = nodes[victim].next;
        removed.push(victim);
        push('跳过值为 ' + val + ' 的节点 ' + victim + '：cur.Next = cur.Next.Next。cur 原地不动，继续检查新的 cur.Next 是否仍等于 ' + val + '。',
          { pair: [a, b], dupe: val, victim: victim });
      }

      push('新的 cur.Next 已经不是 ' + val + ' 了，说明值为 ' + val + ' 的节点被清空。注意 cur 始终没有前进，它现在指向最后一个「已确认不重复」的节点，可以继续检查它的后继。',
        { pair: null, dupe: null, cleared: val });
    } else {
      push('比较 cur.Next = 节点 ' + a + '（值 ' + nodes[a].val + '）与 cur.Next.Next = 节点 ' + b + '（值 ' + nodes[b].val +
        '）：值不相等 → 节点 ' + a + ' 不重复，保留它，cur 前进一步到节点 ' + a + '。',
        { pair: [a, b] });
      cur = a;
    }
  }

  const result = chain().slice(1).map(function (id) { return nodes[id].val; });
  push('cur.Next 或 cur.Next.Next 为 nil，循环结束（后面只剩 0 或 1 个节点，不可能再有重复）。返回 dummy.Next，得到 [' + result.join(', ') +
    ']。链表已经有序，相等的值必然相邻，所以每个节点只需被看一次：时间 O(n)，空间 O(1)。', { done: true });

  return steps;
}

function arrowCol() {
  const col = Demo.el('div', 'col');
  col.appendChild(Demo.el('div', 'arrow', '→'));
  col.appendChild(Demo.el('div', 'ptr ptr--dim', '&nbsp;'));
  return col;
}

function listRow(step) {
  const row = Demo.el('div', 'row');
  step.chain.forEach(function (id) {
    const col = Demo.el('div', 'col');
    const node = Demo.el('div', 'll-node', Demo.esc(valText(id)));
    const labels = [];

    if (id === step.cur) {
      node.classList.add('is-active');
      labels.push('cur');
    } else if (step.pair && step.pair.indexOf(id) >= 0) {
      node.style.borderColor = 'var(--demo-warn)';
      node.style.background = 'var(--demo-warn-soft)';
      node.style.color = 'var(--demo-warn)';
      labels.push(id === step.pair[0] ? 'cur.Next' : 'cur.Next.Next');
    }
    if (id === 0) node.style.borderStyle = 'dashed';

    col.appendChild(node);
    const ptr = Demo.el('div', 'ptr', labels.length ? labels.join(' ') : '&nbsp;');
    if (!labels.length) ptr.classList.add('ptr--dim');
    else if (labels.indexOf('cur') < 0) ptr.classList.add('ptr--warn');
    col.appendChild(ptr);
    row.appendChild(col);
    row.appendChild(arrowCol());
  });

  const nilCol = Demo.el('div', 'col');
  const nilNode = Demo.el('div', 'll-node', 'nil');
  nilNode.style.borderStyle = 'dashed';
  nilNode.style.color = 'var(--demo-muted)';
  nilCol.appendChild(nilNode);
  nilCol.appendChild(Demo.el('div', 'ptr ptr--dim', '&nbsp;'));
  row.appendChild(nilCol);
  return row;
}

function removedRow(ids, title, note) {
  const panel = Demo.el('div', 'panel');
  panel.style.width = '100%';
  panel.appendChild(Demo.el('div', 'panel__title', title));
  const row = Demo.el('div', 'row');
  ids.forEach(function (id) {
    const node = Demo.el('div', 'll-node', Demo.esc(valText(id)));
    node.style.borderColor = 'var(--demo-danger)';
    node.style.background = 'var(--demo-danger-soft)';
    node.style.color = 'var(--demo-danger)';
    node.style.textDecoration = 'line-through';
    row.appendChild(node);
  });
  if (note) row.appendChild(Demo.el('span', 'tag tag--bad', note));
  panel.appendChild(row);
  return panel;
}

Demo.create({
  title: '64. 删除排序链表中的重复元素 II — dummy + 原地跳过所有重复节点',
  info: '输入：head = [1, 2, 3, 3, 4, 4, 5]（已升序）。只要 cur.Next 与 cur.Next.Next 相等，就把值为它的节点全部删掉，一个不留。',
  steps: buildSteps(),
  desc: s => s.note,
  stageHeight: 340,
  legend: [
    { color: 'var(--demo-accent)', label: 'cur 当前节点' },
    { color: 'var(--demo-warn)', label: '正在比较的 cur.Next / cur.Next.Next' },
    { color: 'var(--demo-danger)', label: '被删除的重复节点' }
  ],
  render(step, i, ctx) {
    ctx.stage.innerHTML = '';

    const listPanel = Demo.el('div', 'panel');
    listPanel.style.width = '100%';
    listPanel.appendChild(Demo.el('div', 'panel__title', '当前链表（cur 之前的部分都已处理完毕）'));
    listPanel.appendChild(listRow(step));
    ctx.stage.appendChild(listPanel);

    const status = Demo.el('div', 'row');
    status.appendChild(Demo.el('span', 'tag', 'cur → ' + (step.cur === 0 ? 'dummy' : '节点 ' + step.cur)));
    if (i === 0) {
      status.appendChild(Demo.el('span', 'tag tag--info', '初始状态：准备比较 cur.Next 与 cur.Next.Next'));
    } else if (step.done) {
      status.appendChild(Demo.el('span', 'tag tag--ok', '遍历结束，返回 dummy.Next'));
    } else if (step.dupe !== null) {
      status.appendChild(Demo.el('span', 'tag tag--bad', '发现重复值 ' + step.dupe + '：全部删除'));
    } else if (step.cleared !== null) {
      status.appendChild(Demo.el('span', 'tag tag--ok', '重复值 ' + step.cleared + ' 已清空，cur 原地不动，继续检查新的 cur.Next'));
    } else {
      status.appendChild(Demo.el('span', 'tag tag--ok', 'cur.Next 与 cur.Next.Next 不相等，保留并前进'));
    }
    status.appendChild(Demo.el('span', 'tag tag--info', '已删除 ' + step.removed.length + ' 个节点'));
    ctx.stage.appendChild(status);

    if (step.victim !== null) {
      ctx.stage.appendChild(removedRow([step.victim], '刚刚摘下的节点（cur.Next 已经指向它的后继）', 'cur.Next = cur.Next.Next'));
    }

    if (step.removed.length > 0 && !step.done) {
      ctx.stage.appendChild(removedRow(step.removed, '累计已删除的节点（值为重复，全部丢弃）', null));
    }

    if (step.done) {
      const panel = Demo.el('div', 'panel');
      panel.style.width = '100%';
      panel.appendChild(Demo.el('div', 'panel__title', '结果链表（仍然升序，且不含任何重复值）'));
      panel.appendChild(listRow({ chain: step.chain, cur: -1, pair: null }));
      ctx.stage.appendChild(panel);
    }
  }
});
</script>
</body>
</html>
