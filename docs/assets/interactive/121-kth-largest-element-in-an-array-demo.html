<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>121. 数组中的第K个最大元素</title>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #2d3436; --sub: #636e72;
  --border: #dfe6e9; --blue: #0984e3; --green: #00b894; --red: #e17055; --orange: #e17055;
  --blue-bg: #dff6fd; --heap-bg: #dff9e6; --hl: #ffeaa7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #eee; --sub: #aaa;
    --border: #2d3436; --blue: #74b9ff; --green: #55efc4; --red: #ff7675; --orange: #fab1a0;
    --blue-bg: #1a3a5c; --heap-bg: #1a3a2c; --hl: #5c4a1f;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { width:860px; height:490px; background:var(--card); border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
.header { display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:17px; color:var(--text); }
.step-badge { font-size:13px; color:var(--sub); background:var(--border); padding:4px 12px; border-radius:8px; font-weight:500; }
.info-panel { background:var(--blue-bg); border-left:3px solid var(--blue); padding:10px 14px; border-radius:8px; font-size:13px; color:var(--text); min-height:44px; display:flex; align-items:center; }
.main { display:flex; gap:16px; flex:1; }
.heap-col { flex:1; display:flex; flex-direction:column; gap:6px; }
.col-title { font-size:12px; font-weight:600; color:var(--sub); text-align:center; }
.heap-viz { display:flex; flex-direction:column; gap:4px; flex:1; justify-content:center; }
.heap-row { display:flex; gap:4px; justify-content:center; }
.heap-cell { width:42px; height:40px; border-radius:8px; background:var(--border); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px; color:var(--text); transition:all 0.3s; }
.heap-cell.in-heap { background:var(--heap-bg); border:2px solid var(--green); }
.heap-cell.current { background:var(--hl); box-shadow:0 0 0 2px var(--blue); }
.heap-cell.top { background:var(--red); color:#fff; }
.result { text-align:center; font-weight:700; font-size:18px; color:var(--green); padding:6px; border-radius:8px; background:var(--green-bg); }
.controls { display:flex; gap:8px; justify-content:center; }
.btn { padding:7px 16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; transition:all 0.15s; }
.btn:hover { background:var(--blue-bg); border-color:var(--blue); }
.btn:active { transform:scale(0.96); }
.key-hint { font-size:11px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>121. 数组中的第K个最大元素 (k=2)</h2>
    <span class="step-badge" id="stepBadge">步骤 0/8</span>
  </div>
  <div class="info-panel" id="info"></div>
  <div class="main">
    <div class="heap-col">
      <div class="col-title">原始数组</div>
      <div class="heap-viz" id="arrViz"></div>
    </div>
    <div class="heap-col">
      <div class="col-title">小顶堆 (大小k=2)</div>
      <div class="heap-viz" id="heapViz"></div>
      <div class="result" id="result">第2大 = ?</div>
    </div>
  </div>
  <div class="controls">
    <button class="btn" onclick="reset()">重置</button>
    <button class="btn" onclick="prev()">上步</button>
    <button class="btn" onclick="next()">下步</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button class="btn" onclick="goLast()">跳到最后</button>
  </div>
  <div class="key-hint">键盘: &#8592; &#8593; 上步 | &#8594; &#8595; 下步 | 空格 自动播放 | R 重置 | End 跳到最后</div>
</div>
<script>
const nums = [3,2,1,5,6,4], k = 2;
let steps = [], cur = 0, autoTimer = null, running = false;

function buildSteps() {
  steps = [];
  let heap = [];
  steps.push({i:-1,heap:[...heap],desc:`初始化: nums=[${nums}], k=${k}, 用小顶堆维护K个最大元素`});
  for (let i = 0; i < nums.length; i++) {
    heap.push(nums[i]);
    heap.sort((a,b)=>a-b);
    let desc = `加入 nums[${i}]=${nums[i]}, 堆=[${heap}]`;
    if (heap.length > k) { let removed = heap.shift(); desc += `, 堆大小>2, 弹出堆顶=${removed}, 堆=[${heap}]`; }
    desc += `, 堆顶=` + heap[0];
    steps.push({i,heap:[...heap],desc});
  }
  steps.push({i:nums.length-1,heap:[...heap],desc:`最终堆=[${heap}], 堆顶=${heap[0]} 即第${k}大元素=${heap[0]}`,final:true});
}
buildSteps();

function render() {
  const s = steps[cur];
  document.getElementById('stepBadge').textContent = `步骤 ${cur}/${steps.length-1}`;
  document.getElementById('info').textContent = s.desc;
  document.getElementById('autoBtn').textContent = running ? '停止' : '自动播放';
  document.getElementById('result').textContent = s.final ? `第${k}大 = ${s.heap[0]}` : `堆顶 = ${s.heap.length?s.heap[0]:'?'}`;
  // Array viz
  let arrHtml = '<div class="heap-row">';
  for (let i = 0; i < nums.length; i++) {
    let cls = 'heap-cell';
    if (i === s.i) cls += ' current';
    arrHtml += `<div class="${cls}">${nums[i]}</div>`;
  }
  arrHtml += '</div>';
  document.getElementById('arrViz').innerHTML = arrHtml;
  // Heap viz
  let heapHtml = '<div class="heap-row">';
  for (let i = 0; i < s.heap.length; i++) {
    let cls = 'heap-cell in-heap';
    if (i === 0) cls += ' top';
    heapHtml += `<div class="${cls}">${s.heap[i]}</div>`;
  }
  heapHtml += '</div>';
  document.getElementById('heapViz').innerHTML = heapHtml;
}
function reset() { stopAuto(); cur = 0; render(); }
function prev() { if (cur > 0) { cur--; render(); } }
function next() { if (cur < steps.length - 1) { cur++; render(); } else { stopAuto(); } }
function goLast() { stopAuto(); cur = steps.length - 1; render(); }
function toggleAuto() { running ? stopAuto() : startAuto(); }
function startAuto() { running = true; render(); autoStep(); }
function stopAuto() { running = false; if (autoTimer) clearTimeout(autoTimer); render(); }
function autoStep() { if (!running) return; if (cur < steps.length - 1) { cur++; render(); autoTimer = setTimeout(autoStep, 600); } else { stopAuto(); } }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  else if (e.key === 'End') { e.preventDefault(); goLast(); }
});
render();
</script>
</body>
</html>
