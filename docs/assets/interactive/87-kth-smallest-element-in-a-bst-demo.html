<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉搜索树中第K小的元素</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:780px;width:100%}
h2{text-align:center;color:var(--header);font-size:17px;margin-bottom:4px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px;font-size:14px}
.step-num{font-weight:bold;font-size:22px;color:#1976D2;min-width:36px;text-align:center}
.step-desc{color:var(--muted);font-size:12px;max-width:580px;text-align:center}
svg{display:block;margin:0 auto;width:100%;height:400px}
.k-badge{display:inline-block;background:#FF5722;color:#fff;padding:3px 12px;border-radius:10px;font-size:13px;font-weight:bold}
.result-row{text-align:center;margin-top:4px;font-size:14px}
.result-row .ans{color:#FF5722;font-weight:bold;font-size:20px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
button{padding:7px 15px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:12px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
</style>
</head>
<body>
<div class="container">
<h2>二叉搜索树中第K小的元素 — k=3，中序遍历计数</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">BST：[5,3,6,2,4,null,null,1] · k=3 · 答案=3</span>
</div>
<svg id="treeSvg" viewBox="0 0 720 390"></svg>
<div class="result-row">第 <span class="k-badge">3</span> 小的元素 = <span class="ans" id="answer">?</span></div>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
const nodes=[{x:360,y:30,val:5},{x:210,y:130,val:3},{x:510,y:130,val:6},{x:110,y:250,val:2},{x:310,y:250,val:4},{x:50,y:360,val:1}];
const edges=[[0,1],[0,2],[1,3],[1,4],[3,5]];
// inorder: 1,2,3,4,5,6    k=3 -> answer=3
const inorder=[5,3,1,4,0,2]; // node indices in inorder

const steps=[
{desc:'初始状态：BST [5,3,6,2,4,null,null,1] · k=3',hl:[],cnt:0,found:-1,curNode:-1},
{desc:'中序访问：节点1(值1)，cnt=1，k≠1',hl:[5],cnt:1,found:-1,curNode:5},
{desc:'中序访问：节点2(值2)，cnt=2，k≠2',hl:[5,3],cnt:2,found:-1,curNode:3},
{desc:'中序访问：节点3(值3)，cnt=3，k=3！找到答案=3',hl:[5,3,1],cnt:3,found:1,curNode:1},
{desc:'完成！第3小的元素 = 3',hl:[5,3,1],cnt:3,found:1,curNode:-1}
];

let cur=0,autoTimer=null,autoRun=false,svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;
document.getElementById('answer').textContent=s.found>=0?'3':'?';

let html='<defs><radialGradient id="gBlue"><stop offset="0%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#1976D2"/></radialGradient><radialGradient id="gOr"><stop offset="0%" stop-color="#FFB74D"/><stop offset="100%" stop-color="#FF9800"/></radialGradient><radialGradient id="gR"><stop offset="0%" stop-color="#E57373"/><stop offset="100%" stop-color="#F44336"/></radialGradient></defs><rect width="720" height="390" fill="transparent"/>';
for(const e of edges) {
const a=nodes[e[0]],b=nodes[e[1]];
html+=`<line x1="${a.x}" y1="${a.y+24}" x2="${b.x}" y2="${b.y-24}" stroke="#ccc" stroke-width="2"/>`;
}
for(let i=0;i<nodes.length;i++){
const n=nodes[i];const isHL=s.hl.includes(i);
const isCur=i===s.curNode;
const isFound=s.found>=0&&isHL&&i===nodes.length-1?false:false;
if(isCur){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gOr)" stroke="#E65100" stroke-width="3"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">${n.val}</text>`;
}else if(s.found>=0&&i===inorder[2]){
html+=`<circle cx="${n.x}" cy="${n.y}" r="24" fill="url(#gR)" stroke="#C62828" stroke-width="3"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">${n.val}</text>`;
html+=`<text x="${n.x}" y="${n.y-30}" text-anchor="middle" fill="#F44336" font-size="11" font-weight="bold">第3小!</text>`;
}else if(isHL){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gBlue)" stroke="#0D47A1" stroke-width="2.5"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14">${n.val}</text>`;
}else{
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="2"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="var(--text)" font-size="14">${n.val}</text>`;
}
}
if(cur>0&&cur<steps.length-1)html+=`<text x="360" y="380" text-anchor="middle" fill="var(--muted)" font-size="11">中序计数: ${s.cnt} / 3</text>`;
svg.innerHTML=html;
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},900);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
