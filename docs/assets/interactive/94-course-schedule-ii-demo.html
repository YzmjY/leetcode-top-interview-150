<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>94. 课程表 II - Course Schedule II</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{background:#fff;border-radius:8px;padding:20px;width:780px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{font-size:16px;margin-bottom:12px;color:#333}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-family:inherit;cursor:pointer;transition:all .2s;color:#fff;font-weight:500}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-reset{background:#6c757d}
.btn-prev{background:#0d6efd}
.btn-next{background:#0d6efd}
.btn-auto{background:#198754}
.btn-end{background:#dc3545}
button:hover:not(:disabled){filter:brightness(1.15)}
.info-panel{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:#555;background:#f0f4f8;border-radius:8px;padding:10px 14px}
.step-badge{background:#0d6efd;color:#fff;border-radius:20px;padding:2px 12px;font-weight:600;font-size:12px}
.info-text{flex:1;margin-left:12px}
.vis-area{background:#fafafa;border-radius:8px;position:relative;height:480px;overflow:hidden;border:1px solid #e0e0e0}
svg{width:100%;height:100%}
.hint{font-size:12px;color:#999;text-align:center;margin-top:8px}
@media(prefers-color-scheme:dark){
body{background:#1a1a2e}
.container{background:#16213e;box-shadow:0 2px 12px rgba(0,0,0,.4)}
h2{color:#e0e0e0}
.info-panel{background:#1a1a3e;color:#ccc}
.vis-area{background:#0f0f23;border-color:#2a2a4a}
.hint{color:#777}
}
</style>
</head>
<body>
<div class="container">
<h2>94. 课程表 II (Course Schedule II) — 输出拓扑排序顺序</h2>
<div class="controls">
<button class="btn-reset" onclick="reset()">⟳ 重置</button>
<button class="btn-prev" onclick="prevStep()">◀ 上步</button>
<button class="btn-next" onclick="nextStep()">下步 ▶</button>
<button class="btn-auto" id="btnAuto" onclick="toggleAuto()">▶ 自动播放</button>
<button class="btn-end" onclick="jumpEnd()">▶▶ 跳到最后</button>
</div>
<div class="info-panel">
<span class="step-badge" id="stepBadge">步骤 1/8</span>
<span class="info-text" id="infoText">numCourses=2, prerequisites=[[1,0]] — 需输出合法的上课顺序</span>
</div>
<div class="vis-area"><svg id="svg" viewBox="0 0 780 480"></svg></div>
<div class="hint">键盘: ← → 切换步骤 | 空格 自动播放</div>
</div>
<script>
const N=2;
const prereq=[[1,0]];

let steps=[],currentStep=0,totalSteps=0,autoTimer=null;
function buildSteps(){
  steps=[];
  steps.push({info:'初始: 2门课程, 先修关系 [[1,0]] — 课程1依赖课程0',phase:'init',indegree:{0:0,1:0},adj:{0:[],1:[]},order:[],queue:[],processed:[],highlight:[]});

  let indegree={0:0,1:0},adj={0:[],1:[]};
  for(let [c,p] of prereq){adj[p].push(c);indegree[c]++;}
  steps.push({info:'构建邻接表和入度: 0→[1], 1→[]  indegree[0]=0, indegree[1]=1',phase:'build',indegree:{...indegree},adj:{0:[...adj[0]],1:[...adj[1]]},order:[],queue:[],processed:[],highlight:[]});

  let queue=[],order=[],processed=[];
  for(let i=0;i<N;i++)if(indegree[i]===0)queue.push(i);
  steps.push({info:'入度为0的课程 0 入队 — 它可以最先学习',phase:'enqueue',indegree:{...indegree},adj:{0:[...adj[0]],1:[...adj[1]]},order:[...order],queue:[...queue],processed:[],highlight:[0]});

  while(queue.length>0){
    let cur=queue.shift();
    order.push(cur);processed.push(cur);
    steps.push({info:`出队: 课程 ${cur} → 加入上课顺序 [${order.join(',')}]`,phase:'process',indegree:{...indegree},adj:{0:[...adj[0]],1:[...adj[1]]},order:[...order],queue:[...queue],processed:[...processed],highlight:[cur],curCourse:cur});

    for(let nb of adj[cur]){
      indegree[nb]--;
      let becameZero=indegree[nb]===0;
      if(becameZero)queue.push(nb);
      steps.push({info:`课程${cur}学完 → 课程${nb}入度减1 (${indegree[nb]+1}→${indegree[nb]})${becameZero?', 入度为0, 入队!':''}`,phase:'reduce',indegree:{...indegree},adj:{0:[...adj[0]],1:[...adj[1]]},order:[...order],queue:[...queue],processed:[...processed],highlight:[nb,cur],reduceEdge:[cur,nb]});
    }
  }
  if(order.length===N){
    steps.push({info:`完成! 上课顺序: [${order.join(', ')}]`,phase:'done',indegree:{0:0,1:0},adj:{0:[],1:[]},order:[...order],queue:[],processed:[...processed],highlight:[],done:true});
  }else{
    steps.push({info:`无法完成! 检测到环 — 只有 ${order.length}/${N} 门课可上`,phase:'fail',indegree:{...indegree},adj:{0:[...adj[0]],1:[...adj[1]]},order:[...order],queue:[],processed:[...processed],highlight:[]});
  }
}
buildSteps();totalSteps=steps.length;

const svg=document.getElementById('svg');
const pos={0:{x:280,y:140},1:{x:500,y:140}};

function draw(){
  let s=steps[currentStep];
  svg.innerHTML='';

  // Arrow 0 -> 1
  let p0=pos[0],p1=pos[1];
  let edgeColor=s.reduceEdge?'#28a745':'#0d6efd';

  let g=document.createElementNS('http://www.w3.org/2000/svg','g');
  let l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',p0.x+32);l.setAttribute('y1',p0.y);
  l.setAttribute('x2',p1.x-32);l.setAttribute('y2',p1.y);
  l.setAttribute('stroke',edgeColor);l.setAttribute('stroke-width',3);
  l.setAttribute('marker-end','url(#arr)');
  g.appendChild(l);
  let lt=document.createElementNS('http://www.w3.org/2000/svg','text');
  lt.setAttribute('x',(p0.x+p1.x)/2);lt.setAttribute('y',p0.y-12);
  lt.setAttribute('text-anchor','middle');lt.setAttribute('font-size','13');lt.setAttribute('fill',edgeColor);
  lt.textContent='依赖';
  g.appendChild(lt);
  svg.appendChild(g);

  for(let i=0;i<N;i++){
    let p=pos[i];
    let isHL=s.highlight.includes(i);
    let isCur=s.curCourse===i;
    let isOrdered=s.order.includes(i);

    if(isHL||isCur){
      let hc=document.createElementNS('http://www.w3.org/2000/svg','circle');
      hc.setAttribute('cx',p.x);hc.setAttribute('cy',p.y);hc.setAttribute('r',38);
      hc.setAttribute('fill','none');hc.setAttribute('stroke',isCur?'#ff0':'#ff6b00');hc.setAttribute('stroke-width',3);
      svg.appendChild(hc);
    }

    let c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',32);
    c.setAttribute('fill',isOrdered?'#28a745':'#5b9bd5');c.setAttribute('stroke','#3a7abd');c.setAttribute('stroke-width',2.5);
    svg.appendChild(c);

    let t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',p.x);t.setAttribute('y',p.y-5);
    t.setAttribute('text-anchor','middle');t.setAttribute('font-size','16');t.setAttribute('fill','#fff');t.setAttribute('font-weight','bold');
    t.textContent='课程'+i;
    svg.appendChild(t);

    let sub=document.createElementNS('http://www.w3.org/2000/svg','text');
    sub.setAttribute('x',p.x);sub.setAttribute('y',p.y+14);
    sub.setAttribute('text-anchor','middle');sub.setAttribute('font-size','13');sub.setAttribute('fill','#fff');
    sub.textContent=isOrdered?'✓':'in='+s.indegree[i];
    svg.appendChild(sub);
  }

  // Order timeline below
  let oy=260;
  let ot=document.createElementNS('http://www.w3.org/2000/svg','text');
  ot.setAttribute('x',50);ot.setAttribute('y',oy);
  ot.setAttribute('font-size','15');ot.setAttribute('fill','#333');ot.setAttribute('font-weight','bold');
  ot.textContent='上课顺序:';
  svg.appendChild(ot);
  let orderSt=s.order;
  for(let i=0;i<orderSt.length;i++){
    // Arrow between
    if(i>0){
      let arr=document.createElementNS('http://www.w3.org/2000/svg','text');
      arr.setAttribute('x',178+i*70-20);arr.setAttribute('y',oy+5);
      arr.setAttribute('font-size','16');arr.setAttribute('fill','#28a745');
      arr.textContent='→';
      svg.appendChild(arr);
    }
    let oc=document.createElementNS('http://www.w3.org/2000/svg','rect');
    oc.setAttribute('x',160+i*70);oc.setAttribute('y',oy-20);oc.setAttribute('width',42);oc.setAttribute('height',30);
    oc.setAttribute('rx',8);oc.setAttribute('fill','#28a745');
    svg.appendChild(oc);
    let ot2=document.createElementNS('http://www.w3.org/2000/svg','text');
    ot2.setAttribute('x',160+i*70+21);ot2.setAttribute('y',oy+2);
    ot2.setAttribute('text-anchor','middle');ot2.setAttribute('font-size','15');ot2.setAttribute('fill','#fff');ot2.setAttribute('font-weight','bold');
    ot2.textContent=orderSt[i];
    svg.appendChild(ot2);
  }

  // Queue
  let qy=320;
  if(s.queue.length>0){
    let qtt=document.createElementNS('http://www.w3.org/2000/svg','text');
    qtt.setAttribute('x',50);qtt.setAttribute('y',qy);
    qtt.setAttribute('font-size','14');qtt.setAttribute('fill','#ff6b00');qtt.setAttribute('font-weight','bold');
    qtt.textContent='待处理队列: [';
    svg.appendChild(qtt);
    for(let i=0;i<s.queue.length;i++){
      let off=50+120+i*30;
      if(i>0){
        let comma=document.createElementNS('http://www.w3.org/2000/svg','text');
        comma.setAttribute('x',off-15);comma.setAttribute('y',qy);
        comma.setAttribute('font-size','14');comma.setAttribute('fill','#ff6b00');
        comma.textContent=',';
        svg.appendChild(comma);
      }
      let qn=document.createElementNS('http://www.w3.org/2000/svg','text');
      qn.setAttribute('x',off);qn.setAttribute('y',qy);
      qn.setAttribute('font-size','15');qn.setAttribute('fill','#ff6b00');qn.setAttribute('font-weight','bold');
      qn.textContent=s.queue[i];
      svg.appendChild(qn);
    }
    let close=document.createElementNS('http://www.w3.org/2000/svg','text');
    close.setAttribute('x',50+120+s.queue.length*30);close.setAttribute('y',qy);
    close.setAttribute('font-size','14');close.setAttribute('fill','#ff6b00');
    close.textContent=']';
    svg.appendChild(close);
  }

  // Done
  if(s.done){
    let dm=document.createElementNS('http://www.w3.org/2000/svg','text');
    dm.setAttribute('x',400);dm.setAttribute('y',400);
    dm.setAttribute('text-anchor','middle');dm.setAttribute('font-size','20');dm.setAttribute('fill','#28a745');dm.setAttribute('font-weight','bold');
    dm.textContent='✓ 拓扑排序完成: ['+s.order.join(', ')+']';
    svg.appendChild(dm);
  }

  // Adj info
  let ai=document.createElementNS('http://www.w3.org/2000/svg','text');
  ai.setAttribute('x',50);ai.setAttribute('y',430);
  ai.setAttribute('font-size','13');ai.setAttribute('fill','#666');ai.setAttribute('font-family','monospace');
  ai.textContent='邻接表: 0→[1], 1→[]  |  入度: 0:0, 1:'+s.indegree[1];
  svg.appendChild(ai);

  let defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  let m=document.createElementNS('http://www.w3.org/2000/svg','marker');
  m.setAttribute('id','arr');m.setAttribute('markerWidth','10');m.setAttribute('markerHeight','10');
  m.setAttribute('refX','9');m.setAttribute('refY','3');m.setAttribute('orient','auto');
  let mp=document.createElementNS('http://www.w3.org/2000/svg','path');
  mp.setAttribute('d','M0,0 L0,6 L9,3 z');mp.setAttribute('fill',edgeColor);
  m.appendChild(mp);defs.appendChild(m);
  svg.insertBefore(defs,svg.firstChild);

  document.getElementById('stepBadge').textContent=`步骤 ${currentStep+1}/${totalSteps}`;
  document.getElementById('infoText').textContent=s.info;
  let btns=document.querySelectorAll('button');
  btns.forEach(b=>b.disabled=false);
  if(currentStep===0)document.querySelector('.btn-prev').disabled=true;
  if(currentStep===totalSteps-1){document.querySelector('.btn-next').disabled=true;document.querySelector('.btn-end').disabled=true;document.querySelector('.btn-auto').disabled=true;}
}

function nextStep(){if(currentStep<totalSteps-1){currentStep++;draw();}}
function prevStep(){if(currentStep>0){currentStep--;draw();}}
function reset(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;document.getElementById('btnAuto').textContent='▶ 自动播放';}currentStep=0;draw();}
function jumpEnd(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;document.getElementById('btnAuto').textContent='▶ 自动播放';}currentStep=totalSteps-1;draw();}
function toggleAuto(){
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;document.getElementById('btnAuto').textContent='▶ 自动播放';}
  else{document.getElementById('btnAuto').textContent='⏸ 暂停';autoTimer=setInterval(()=>{if(currentStep<totalSteps-1)nextStep();else{clearInterval(autoTimer);autoTimer=null;document.getElementById('btnAuto').textContent='▶ 自动播放';}},900);}
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();nextStep();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prevStep();}
  else if(e.key===' '){e.preventDefault();toggleAuto();}
});
draw();
</script>
</body>
</html>
