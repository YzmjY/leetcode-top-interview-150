<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --sub-bg: #f5f5f5;
    --zero-color: #E53935; --zero-bg: #FFEBEE;
    --mark-row: #1976D2; --mark-row-bg: rgba(25,118,210,0.12);
    --mark-col: #FF9800; --mark-col-bg: rgba(255,152,0,0.12);
    --set-zero-bg: #e0e0e0;
    --scan-bg: #FFF9C4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd;
      --btn-bg: #333; --btn-hover: #444;
      --sub-bg: #252540;
      --zero-bg: rgba(229,57,53,0.25);
      --mark-row-bg: rgba(25,118,210,0.15);
      --mark-col-bg: rgba(255,152,0,0.15);
      --set-zero-bg: rgba(150,150,150,0.3);
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 16px 20px;
  }
  .container { max-width: 800px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 4px; }
  .sub-title { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 8px; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px;
    font-size: 14px; flex-wrap: wrap;
  }
  .step-num { font-weight: bold; font-size: 24px; color: #1976D2; min-width: 36px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; max-width: 560px; text-align: center; }

  .matrix-wrap { display: flex; justify-content: center; margin-bottom: 6px; }
  .mat-grid { display: grid; grid-template-columns: repeat(4, 64px); gap: 3px; }
  .mcell {
    width: 64px; height: 52px; border: 2px solid var(--cell-border); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; color: var(--text); background: var(--cell-bg);
    position: relative; transition: border-color 0.25s, background 0.25s, transform 0.15s;
  }
  .mcell.is-zero { border-color: var(--zero-color); background: var(--zero-bg); transform: scale(1.08); z-index: 2; }
  .mcell.row-mark { border-color: var(--zero-color); border-style: dashed; background: var(--mark-row-bg); }
  .mcell.col-mark { border-color: var(--zero-color); border-style: dashed; background: var(--mark-col-bg); }
  .mcell.scanning { background: rgba(255,235,59,0.2); border-color: #F9A825; }
  .mcell.will-zero { background: var(--set-zero-bg); opacity: 0.5; }
  .mcell.set-zero { background: rgba(229,57,53,0.18); color: var(--zero-color); }

  .state-row {
    display: flex; justify-content: center; gap: 14px;
    background: var(--sub-bg); border-radius: 8px;
    padding: 8px 14px; margin-bottom: 6px; font-size: 13px;
    flex-wrap: wrap;
  }
  .state-item { text-align: center; min-width: 50px; }
  .state-val { font-size: 16px; font-weight: bold; font-family: monospace; }
  .state-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }

  .legend {
    display: flex; gap: 14px; justify-content: center; margin-top: 8px;
    font-size: 12px; color: var(--muted); flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

  @media (max-width: 600px) {
    .mat-grid { grid-template-columns: repeat(4, 52px); }
    .mcell { width: 52px; height: 44px; font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <h2>矩阵置零 — 逐步扫描演示</h2>
  <div class="sub-title">初始矩阵 3x4: [[0,1,2,0],[3,4,5,2],[1,3,1,5]] &rarr; 扫描标记零位置 &rarr; 置零行和列</div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">初始状态 · 点击「下一步」开始</span>
  </div>

  <div class="matrix-wrap"><div class="mat-grid" id="matGrid"></div></div>

  <div class="state-row">
    <div class="state-item"><div class="state-val" id="scanIdx">--</div><div class="state-label">当前位置</div></div>
    <div class="state-item"><div class="state-val" id="zeroRows">--</div><div class="state-label">零行标记</div></div>
    <div class="state-item"><div class="state-val" id="zeroCols">--</div><div class="state-label">零列标记</div></div>
    <div class="state-item"><div class="state-val" id="phaseVal">--</div><div class="state-label">阶段</div></div>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">&#x23EE; 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">&#x25C0; 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 &#x25B6;</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">&#x25B6; 自动播放</button>
    <button onclick="goStep(steps.length-1)">&#x23ED; 跳到最后</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--zero-color)"></div>发现零值</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--zero-color);border:2px dashed var(--zero-color);background:transparent;"></div>标记行/列</div>
    <div class="legend-item"><div class="legend-dot" style="background:rgba(229,57,53,0.4)"></div>将被置零</div>
  </div>
</div>

<script>
const M = 3, N = 4;
const orig = [
  [0, 1, 2, 0],
  [3, 4, 5, 2],
  [1, 3, 1, 5]
];

const steps = [];

function clone(m) {
  return m.map(r => [...r]);
}

function simulate() {
  const matrix = clone(orig);
  const zeroRows = new Set();
  const zeroCols = new Set();

  steps.push({
    desc: '初始矩阵 [[0,1,2,0],[3,4,5,2],[1,3,1,5]] · 开始扫描零值位置',
    matrix: clone(matrix), phase: 'init',
    scanIdx: '--', zeroRows: [], zeroCols: [],
    zeroCells: [], markRows: [], markCols: [], willZero: [], setZero: []
  });

  // Phase 1: Scan
  for (let i = 0; i < M; i++) {
    for (let j = 0; j < N; j++) {
      const scanCells = [[i, j]];
      if (matrix[i][j] === 0) {
        zeroRows.add(i);
        zeroCols.add(j);
        steps.push({
          desc: '扫描 [' + i + ',' + j + ']: 发现零值! 标记第' + i + '行和第' + j + '列需要置零.',
          matrix: clone(matrix), phase: 'scan',
          scanIdx: '[' + i + ',' + j + ']', zeroRows: [...zeroRows], zeroCols: [...zeroCols],
          zeroCells: [[i, j]], markRows: [[i, j]], markCols: [[i, j]],
          willZero: [], setZero: []
        });
      } else {
        steps.push({
          desc: '扫描 [' + i + ',' + j + ']=' + matrix[i][j] + ': 非零值, 继续扫描.',
          matrix: clone(matrix), phase: 'scan',
          scanIdx: '[' + i + ',' + j + ']', zeroRows: [...zeroRows], zeroCols: [...zeroCols],
          zeroCells: [], markRows: [], markCols: [],
          willZero: [], setZero: []
        });
      }
    }
  }

  steps.push({
    desc: '扫描完成! 发现零行: ' + ([...zeroRows].join(', ') || '无') + ', 零列: ' + ([...zeroCols].join(', ') || '无'),
    matrix: clone(matrix), phase: 'mark',
    scanIdx: '扫描完成', zeroRows: [...zeroRows], zeroCols: [...zeroCols],
    zeroCells: [], markRows: [], markCols: [],
    willZero: [], setZero: []
  });

  // Mark rows that will be zeroed
  const willZeroCells = [];
  for (let r of zeroRows) {
    for (let j = 0; j < N; j++) {
      if (matrix[r][j] !== 0) willZeroCells.push([r, j]);
    }
  }
  for (let c of zeroCols) {
    for (let i = 0; i < M; i++) {
      if (matrix[i][c] !== 0 && !zeroRows.has(i)) willZeroCells.push([i, c]);
    }
  }

  steps.push({
    desc: '准备置零: 将标记的行和列中所有非零元素置为0',
    matrix: clone(matrix), phase: 'will-set',
    scanIdx: '--', zeroRows: [...zeroRows], zeroCols: [...zeroCols],
    zeroCells: [], markRows: [], markCols: [],
    willZero: willZeroCells, setZero: []
  });

  // Phase 2: Set zero
  const setZeroCells = [];
  for (let r of zeroRows) for (let j = 0; j < N; j++) { matrix[r][j] = 0; setZeroCells.push([r, j]); }
  for (let c of zeroCols) for (let i = 0; i < M; i++) { matrix[i][c] = 0; setZeroCells.push([i, c]); }

  steps.push({
    desc: '置零完成! 结果: [[0,0,0,0],[0,4,5,0],[0,3,1,0]]',
    matrix: clone(matrix), phase: 'done',
    scanIdx: '完成', zeroRows: [...zeroRows], zeroCols: [...zeroCols],
    zeroCells: [], markRows: [], markCols: [],
    willZero: [], setZero: setZeroCells
  });
}

simulate();

let current = 0;
let autoTimer = null;
let autoRunning = false;

// Build matrix grid
const grid = document.getElementById('matGrid');
for (let r = 0; r < M; r++) {
  for (let c = 0; c < N; c++) {
    const cell = document.createElement('div');
    cell.className = 'mcell';
    cell.id = 'mc' + r + '_' + c;
    grid.appendChild(cell);
  }
}

function resetCells() {
  for (let r = 0; r < M; r++)
    for (let c = 0; c < N; c++) {
      document.getElementById('mc' + r + '_' + c).className = 'mcell';
    }
}

function render() {
  const s = steps[current];
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = s.desc;
  document.getElementById('scanIdx').textContent = s.scanIdx;
  document.getElementById('zeroRows').textContent = s.zeroRows.length > 0 ? '{' + s.zeroRows.join(', ') + '}' : '--';
  document.getElementById('zeroCols').textContent = s.zeroCols.length > 0 ? '{' + s.zeroCols.join(', ') + '}' : '--';
  document.getElementById('phaseVal').textContent = s.phase === 'init' ? '初始' : (s.phase === 'scan' ? '扫描中' : (s.phase === 'mark' ? '标记完成' : (s.phase === 'will-set' ? '准备置零' : '完成')));

  resetCells();

  // Set values
  for (let r = 0; r < M; r++)
    for (let c = 0; c < N; c++) {
      document.getElementById('mc' + r + '_' + c).textContent = s.matrix[r][c];
    }

  // Highlight classes
  if (s.zeroCells) s.zeroCells.forEach(([r, c]) => document.getElementById('mc' + r + '_' + c).classList.add('is-zero'));
  if (s.markRows) s.markRows.forEach(([r, c]) => document.getElementById('mc' + r + '_' + c).classList.add('row-mark'));
  if (s.markCols) s.markCols.forEach(([r, c]) => document.getElementById('mc' + r + '_' + c).classList.add('col-mark'));
  if (s.willZero) s.willZero.forEach(([r, c]) => { const el = document.getElementById('mc' + r + '_' + c); if (!el.classList.contains('is-zero')) el.classList.add('will-zero'); });
  if (s.setZero) s.setZero.forEach(([r, c]) => document.getElementById('mc' + r + '_' + c).classList.add('set-zero'));

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= steps.length - 1;
}

function goStep(n) {
  current = Math.max(0, Math.min(n, steps.length - 1));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer); autoRunning = false;
    document.getElementById('playBtn').textContent = '\u25B6 自动播放';
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
    document.getElementById('playBtn').classList.remove('play-btn');
  } else {
    autoRunning = true;
    document.getElementById('playBtn').textContent = '\u23F8 暂停';
    document.getElementById('playBtn').style.background = '#1976D2';
    document.getElementById('playBtn').style.color = '#fff';
    document.getElementById('playBtn').classList.add('play-btn');
    if (current >= steps.length - 1) goStep(0);
    autoTimer = setInterval(function() {
      if (current < steps.length - 1) goStep(current + 1);
      else toggleAuto();
    }, 1000);
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
