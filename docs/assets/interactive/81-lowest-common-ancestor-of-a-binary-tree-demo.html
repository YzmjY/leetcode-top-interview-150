<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉树的最近公共祖先</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:880px;width:100%}
h2{text-align:center;color:var(--header);font-size:17px;margin-bottom:6px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px;font-size:14px}
.step-num{font-weight:bold;font-size:22px;color:#1976D2;min-width:36px;text-align:center}
.step-desc{color:var(--muted);font-size:12px;max-width:600px;text-align:center}
svg{display:block;margin:0 auto;width:100%;height:460px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
button{padding:7px 15px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:12px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
</style>
</head>
<body>
<div class="container">
<h2>二叉树的最近公共祖先 — 后序遍历查找</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">p=5, q=1 · LCA=3</span>
</div>
<svg id="treeSvg" viewBox="0 0 860 450"></svg>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
// tree: [3,5,1,6,2,0,8,null,null,7,4], p=5, q=1
const nodes=[{x:430,y:30,val:3},{x:250,y:120,val:5},{x:610,y:120,val:1},{x:140,y:220,val:6},{x:360,y:220,val:2},{x:520,y:220,val:0},{x:700,y:220,val:8},{x:280,y:330,val:7},{x:440,y:330,val:4}];
const edges=[[0,1],[0,2],[1,3],[1,4],[2,5],[2,6],[4,7],[4,8]];
const pIdx=1,qIdx=2,lcaIdx=0;

const steps=[
{desc:'初始状态 · p=5(红), q=1(紫) · 后序遍历查找LCA',hl:[],found:[],lca:-1,info:''},
{desc:'后序访问节点6：左右皆空，不是p/q，返回null',hl:[3],found:[],lca:-1,info:'节点6: null'},
{desc:'后序访问节点7：左右皆空，不是p/q，返回null',hl:[3,7],found:[],lca:-1,info:'节点7: null'},
{desc:'后序访问节点4：左右皆空，不是p/q，返回null',hl:[3,7,8],found:[],lca:-1,info:'节点4: null'},
{desc:'后序访问节点2：左(null)右(null)，都不是p/q，返回null',hl:[3,7,8,4],found:[],lca:-1,info:'节点2: null'},
{desc:'后序访问节点5：左(6=null)右(2=null)都null，但自己是p=5！返回5',hl:[3,7,8,4,1],found:[1],lca:-1,info:'节点5= p → 返回5'},
{desc:'后序访问节点0：左右都null，不是p/q，返回null',hl:[3,7,8,4,1,5],found:[1],lca:-1,info:'节点0: null'},
{desc:'后序访问节点8：左右都null，不是p/q，返回null',hl:[3,7,8,4,1,5,6],found:[1],lca:-1,info:'节点8: null'},
{desc:'后序访问节点1：左(null)右(null)都null，但自己是q=1！返回1',hl:[3,7,8,4,1,5,6,2],found:[1,2],lca:-1,info:'节点1= q → 返回1'},
{desc:'后序访问根节点3：左返回5(p)，右返回1(q)。两边都不null → LCA=3！',hl:[0,1,2,3,4,5,6,7,8],found:[1,2],lca:0,info:'根3: 左有p 右有q → LCA=3'}
];

let cur=0,autoTimer=null,autoRun=false;
const svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;

let html='<defs><radialGradient id="gBlue"><stop offset="0%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#1976D2"/></radialGradient><radialGradient id="gR"><stop offset="0%" stop-color="#E57373"/><stop offset="100%" stop-color="#F44336"/></radialGradient><radialGradient id="gP"><stop offset="0%" stop-color="#CE93D8"/><stop offset="100%" stop-color="#9C27B0"/></radialGradient><radialGradient id="gOr"><stop offset="0%" stop-color="#FFCC80"/><stop offset="100%" stop-color="#FF9800"/></radialGradient></defs><rect width="860" height="450" fill="transparent"/>';
for(const e of edges) {
const a=nodes[e[0]],b=nodes[e[1]];
html+=`<line x1="${a.x}" y1="${a.y+24}" x2="${b.x}" y2="${b.y-24}" stroke="#ccc" stroke-width="2"/>`;
}
if(s.lca>=0){
// highlight LCA special
html+=`<circle cx="${nodes[0].x}" cy="${nodes[0].y}" r="26" fill="none" stroke="#FF5722" stroke-width="3" stroke-dasharray="4,3"/>`;
}
for(let i=0;i<nodes.length;i++){
const n=nodes[i];
let fill='var(--sub-bg)',stroke='var(--cell-border)',sw=2,fc='var(--text)';
if(i===s.lca){fill='url(#gOr)';stroke='#E65100';sw=3;fc='#fff'}
else if(i===pIdx&&!s.hl.includes(i)){fill='#FFCDD2';stroke='#F44336';sw=2.5;fc='#C62828'}
else if(i===qIdx&&!s.hl.includes(i)){fill='#E1BEE7';stroke='#9C27B0';sw=2.5;fc='#6A1B9A'}
else if(s.found.includes(i)){fill='url(#gR)'+(i===qIdx?'':'');stroke='#C62828';sw=2.5;fc='#fff'}
else if(s.hl.includes(i)){fill='var(--sub-bg)';stroke='#999';sw=2;fc='var(--muted)';if(i!==pIdx&&i!==qIdx){}
}
if(i===pIdx&&s.found.includes(i)){fill='url(#gR)';stroke='#C62828';sw=2.5;fc='#fff'}
if(i===qIdx&&s.found.includes(i)){fill='url(#gP)';stroke='#6A1B9A';sw=2.5;fc='#fff'}

html+=`<circle cx="${n.x}" cy="${n.y}" r="21" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="${fc}" font-size="13" font-weight="bold">${n.val}</text>`;
if(i===pIdx&&!s.found.includes(i))html+=`<text x="${n.x+30}" y="${n.y-5}" fill="#F44336" font-size="10" font-weight="bold">p</text>`;
if(i===qIdx&&!s.found.includes(i))html+=`<text x="${n.x+30}" y="${n.y-5}" fill="#9C27B0" font-size="10" font-weight="bold">q</text>`;
if(i===s.lca)html+=`<text x="${n.x}" y="${n.y-30}" text-anchor="middle" fill="#FF5722" font-size="12" font-weight="bold">LCA!</text>`;
}
if(s.info)html+=`<text x="430" y="440" text-anchor="middle" fill="#1976D2" font-size="12" font-weight="bold">${s.info}</text>`;
svg.innerHTML=html;
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},1100);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
