<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>58. 两数相加 - 可视化演示</title>
<style>
:root {
  --bg: #f8f9fa; --card-bg: #fff; --text: #212529; --text-secondary: #6c757d;
  --border: #dee2e6; --btn-bg: #e9ecef; --btn-hover: #dee2e6; --btn-active: #0d6efd;
  --btn-active-text: #fff; --node-bg: #e9ecef;
  --blue: #228be6; --green: #40c057; --red: #fa5252; --orange: #fd7e14;
  --step-bg: #e7f5ff;
}
@media (prefers-color-scheme: dark) {
:root {
  --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
  --border: #3a3a5c; --btn-bg: #2a2a4a; --btn-hover: #3a3a5c; --btn-active: #339af0;
  --btn-active-text: #fff; --node-bg: #2a2a4a; --step-bg: #1a2a3a;
}
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center; padding: 20px;
}
.container {
  width: 100%; max-width: 950px; height: 500px;
  background: var(--card-bg); border-radius: 8px;
  border: 1px solid var(--border); padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.step-panel {
  background: var(--step-bg); border-radius: 8px; padding: 8px 16px;
  display: flex; justify-content: space-between; align-items: center; font-size: 14px;
}
.step-num { font-weight: 700; color: var(--btn-active); }
.step-desc { flex: 1; margin-left: 16px; }
.svg-area { flex: 1; display: flex; justify-content: center; align-items: center; }
.controls {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.controls button {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--btn-bg); color: var(--text); cursor: pointer;
  font-size: 13px; font-family: inherit; transition: all 0.15s;
}
.controls button:hover { background: var(--btn-hover); }
.controls button.active { background: var(--btn-active); color: var(--btn-active-text); border-color: var(--btn-active); }
</style>
</head>
<body>
<div class="container">
  <div class="step-panel">
    <span class="step-num" id="stepNum">步骤 0 / 0</span>
    <span class="step-desc" id="stepDesc">初始状态</span>
  </div>
  <div class="svg-area"><svg id="svg" viewBox="0 0 850 300"></svg></div>
  <div class="controls">
    <button onclick="reset()">重置</button>
    <button onclick="prevStep()">上步</button>
    <button onclick="nextStep()">下步</button>
    <button id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button onclick="goEnd()">跳到最后</button>
  </div>
</div>
<script>
const l1 = [2, 4, 3];  // 342
const l2 = [5, 6, 4];  // 465 = 807
const steps = [];
let stepIdx = -1;

const pos1 = [{ x: 80, y: 70 }, { x: 200, y: 70 }, { x: 320, y: 70 }];
const pos2 = [{ x: 80, y: 150 }, { x: 200, y: 150 }, { x: 320, y: 150 }];
const posR = [{ x: 80, y: 240 }, { x: 200, y: 240 }, { x: 320, y: 240 }, { x: 440, y: 240 }];

function buildSteps() {
  steps.length = 0;
  let carry = 0;
  const result = [];
  const hl = { l1: -1, l2: -1, r: -1 }; // highlight indices
  steps.push({ carry: 0, result: [], hl: { ...hl }, desc: '初始状态：l1=[2,4,3] (342) + l2=[5,6,4] (465)', step: 0 });

  const maxLen = Math.max(l1.length, l2.length);
  for (let i = 0; i < maxLen; i++) {
    const a = i < l1.length ? l1[i] : 0;
    const b = i < l2.length ? l2[i] : 0;
    const sum = a + b + carry;
    const digit = sum % 10;
    carry = Math.floor(sum / 10);
    result.push(digit);
    hl.l1 = i; hl.l2 = i; hl.r = i;
    steps.push({ carry, result: [...result], hl: { ...hl },
      desc: `位 ${i}: ${a} + ${b} + 进位${steps[steps.length-1].carry} = ${sum}, 写${digit} 进位${carry}`, step: i + 1 });
  }
  if (carry > 0) {
    result.push(carry);
    hl.r = result.length - 1; hl.l1 = -1; hl.l2 = -1;
    steps.push({ carry: 0, result: [...result], hl: { ...hl },
      desc: `最终进位: 写${carry}`, step: maxLen + 1 });
  }
  steps.push({ carry: 0, result: [...result], hl: { l1: -1, l2: -1, r: -1 },
    desc: `完成！结果:[${result.join(',')}] 表示 ${result.reverse().join('')}`, step: maxLen + 2 });
}

const R = 22;
function drawNode(cx, cy, val, fill, stroke, hl) {
  return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${hl ? 'var(--orange)' : fill}" stroke="${hl ? 'var(--orange)' : stroke}" stroke-width="${hl ? 3 : 2}"/>
    <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)" font-family="Consolas,monospace">${val}</text>`;
}

function renderSVG() {
  const st = steps[Math.min(stepIdx, steps.length - 1)];
  document.getElementById('stepNum').textContent = `步骤 ${stepIdx + 1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent = st.desc;

  const svg = document.getElementById('svg');
  let html = `<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--text-secondary)"/>
    </marker>
  </defs>`;

  // Label
  html += `<text x="30" y="75" font-size="14" font-weight="700" fill="var(--blue)">l1</text>`;
  html += `<text x="30" y="155" font-size="14" font-weight="700" fill="var(--green)">l2</text>`;
  html += `<text x="30" y="245" font-size="14" font-weight="700" fill="var(--orange)">结果</text>`;

  // l1 nodes
  for (let i = 0; i < l1.length; i++) {
    html += drawNode(pos1[i].x, pos1[i].y, l1[i], 'var(--node-bg)', 'var(--blue)', st.hl.l1 === i);
    if (i < l1.length - 1) html += `<line x1="${pos1[i].x + R}" y1="${pos1[i].y}" x2="${pos1[i+1].x - R}" y2="${pos1[i+1].y}" stroke="var(--blue)" stroke-width="2" marker-end="url(#arrow)"/>`;
  }
  // l2 nodes
  for (let i = 0; i < l2.length; i++) {
    html += drawNode(pos2[i].x, pos2[i].y, l2[i], 'var(--node-bg)', 'var(--green)', st.hl.l2 === i);
    if (i < l2.length - 1) html += `<line x1="${pos2[i].x + R}" y1="${pos2[i].y}" x2="${pos2[i+1].x - R}" y2="${pos2[i+1].y}" stroke="var(--green)" stroke-width="2" marker-end="url(#arrow)"/>`;
  }
  // result nodes
  const rd = st.result;
  for (let i = 0; i < rd.length; i++) {
    html += drawNode(posR[i].x, posR[i].y, rd[i], 'var(--node-bg)', 'var(--orange)', st.hl.r === i);
    if (i < rd.length - 1) html += `<line x1="${posR[i].x + R}" y1="${posR[i].y}" x2="${posR[i+1].x - R}" y2="${posR[i+1].y}" stroke="var(--orange)" stroke-width="2" marker-end="url(#arrow)"/>`;
  }

  // Carry display
  html += `<rect x="430" y="90" width="180" height="60" rx="8" fill="var(--btn-bg)" stroke="var(--border)"/>`;
  html += `<text x="520" y="110" text-anchor="middle" font-size="12" fill="var(--text-secondary)">进位 carry</text>`;
  html += `<text x="520" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="var(--red)" font-family="Consolas,monospace">${st.carry}</text>`;

  svg.innerHTML = html;
  document.getElementById('autoBtn').classList.toggle('active', autoRunning);
}

function reset() { stepIdx = 0; stopAuto(); renderSVG(); }
function prevStep() { stopAuto(); if (stepIdx > 0) stepIdx--; renderSVG(); }
function nextStep() { stopAuto(); if (stepIdx < steps.length - 1) stepIdx++; renderSVG(); }
function goEnd() { stopAuto(); stepIdx = steps.length - 1; renderSVG(); }

let autoRunning = false, autoTimer = null;
function toggleAuto() { autoRunning ? stopAuto() : startAuto(); }
function startAuto() { autoRunning = true; renderSVG(); autoStep(); }
function stopAuto() { autoRunning = false; if (autoTimer) clearTimeout(autoTimer); renderSVG(); }
function autoStep() {
  if (!autoRunning) return;
  if (stepIdx < steps.length - 1) { stepIdx++; renderSVG(); autoTimer = setTimeout(autoStep, 900); }
  else stopAuto();
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});
buildSteps();
reset();
</script>
</body>
</html>
