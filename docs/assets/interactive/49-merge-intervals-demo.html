<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222; --sub-bg: #f5f5f5;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --axis-color: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd; --btn-bg: #333; --btn-hover: #444;
      --sub-bg: #252540; --axis-color: #888;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 14px 20px;
  }
  .container { max-width: 900px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 17px; margin-bottom: 2px; }
  .sub-title { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 6px; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 4px;
    font-size: 14px; flex-wrap: wrap;
  }
  .step-num { font-weight: bold; font-size: 22px; color: #1976D2; min-width: 32px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; max-width: 580px; text-align: center; }

  svg { display: block; margin: 0 auto; width: 100%; }

  .result-row {
    background: var(--sub-bg); border-radius: 8px; padding: 8px 14px;
    margin-bottom: 4px; font-size: 13px; text-align: center;
  }
  .result-row .highlight { font-weight: bold; font-size: 15px; }

  .legend {
    display: flex; gap: 16px; justify-content: center; margin-top: 4px;
    font-size: 11px; color: var(--muted); flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 3px; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px;
  }
  button {
    padding: 7px 15px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }
</style>
</head>
<body>
<div class="container">
  <h2>合并区间 — 直观可视化演示</h2>
  <div class="sub-title">intervals=[[1,3],[2,6],[8,10],[15,18]] &rarr; [[1,6],[8,10],[15,18]]</div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">初始状态 · 点击「下一步」开始</span>
  </div>

  <svg id="svg" viewBox="0 0 880 360"></svg>

  <div class="result-row">
    <span style="color:var(--muted)">结果: </span><span id="resultText" class="highlight" style="color:#1976D2;">进行中...</span>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#42A5F5;"></div>参照区间</div>
    <div class="legend-item"><div class="legend-dot" style="background:#66BB6A;"></div>当前检查</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF7043;"></div>重叠(合并)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#AB47BC;"></div>已合并结果</div>
    <div class="legend-item"><div class="legend-dot" style="background:#BDBDBD;"></div>待处理</div>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">&#x23EE; 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">&#x25C0; 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 &#x25B6;</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">&#x25B6; 自动播放</button>
    <button onclick="goStep(steps.length-1)">&#x23ED; 跳到最后</button>
  </div>
</div>

<script>
const intervals = [[1,3],[2,6],[8,10],[15,18]];
const allVals = intervals.flat();
const xMin = 0, xMax = 19;

// Layout: SVG viewBox 0 0 880 360
const graphH = 180, graphTop = 40;
const axisY = graphTop + graphH;
const barBaseY = axisY - 4;
const xScale = (v) => 60 + (v - xMin) * (760 / (xMax - xMin));
// Each interval gets its own row (staggered vertically)
const rowH = 38;
const barH = 28;

const steps = [];

(function simulate() {
  steps.push({
    desc: '初始状态 · 四个区间等处理 · 点击下一步开始合并',
    phase: 'init', curIdx: -1, mergeIdx: -1,
    barStyles: [{color:'#BDBDBD',y:0},{color:'#BDBDBD',y:0},{color:'#BDBDBD',y:0},{color:'#BDBDBD',y:0}],
    result: null
  });

  const merged = [];
  const mergedLevels = []; // track which row each result is on

  // Step 1: pick first interval
  const first = intervals[0];
  merged.push([first[0], first[1], 0]); // [start, end, originalIdx]
  steps.push({
    desc: '取第1个区间 [1,3] 作为参照基准',
    phase: 'start', curIdx: 0, mergeIdx: 0,
    barStyles: [{color:'#42A5F5',y:0},{color:'#BDBDBD',y:0},{color:'#BDBDBD',y:0},{color:'#BDBDBD',y:0}],
    result: [[1,3]],
    mergedRanges: [[0, 1, 3, 0]] // [mergedIndex, start, end, row]
  });

  for (let i = 1; i < intervals.length; i++) {
    const cur = intervals[i];
    const last = merged[merged.length - 1];

    // Show comparison
    steps.push({
      desc: '检查区间 [' + cur[0] + ',' + cur[1] + ']: ' + cur[0] + ' <= ' + last[1] + ' (前区间end)?',
      phase: 'compare', curIdx: i, mergeIdx: merged.length - 1,
      barStyles: buildBarStyles(i, merged, 'compare'),
      result: merged.map(m => [m[0], m[1]]),
      mergedRanges: buildMergedRanges(merged)
    });

    if (cur[0] <= last[1]) {
      // Overlap → merge
      const oldEnd = last[1];
      last[1] = Math.max(last[1], cur[1]);
      steps.push({
        desc: '重叠! ' + cur[0] + '≤' + oldEnd + ' → 合并: end从' + oldEnd + '扩展到' + last[1],
        phase: 'merge', curIdx: i, mergeIdx: merged.length - 1,
        barStyles: buildBarStyles(i, merged, 'merge'),
        result: merged.map(m => [m[0], m[1]]),
        mergedRanges: buildMergedRanges(merged)
      });
    } else {
      // No overlap → add new
      merged.push([cur[0], cur[1], i]);
      steps.push({
        desc: '不重叠! ' + cur[0] + '>' + last[1] + ' → 新增合并结果区间 [' + cur[0] + ',' + cur[1] + ']',
        phase: 'nomerge', curIdx: i, mergeIdx: merged.length - 1,
        barStyles: buildBarStyles(i, merged, 'nomerge'),
        result: merged.map(m => [m[0], m[1]]),
        mergedRanges: buildMergedRanges(merged)
      });
    }
  }

  steps.push({
    desc: '完成! 合并结果: [[1,6],[8,10],[15,18]]',
    phase: 'done', curIdx: -1, mergeIdx: -1,
    barStyles: [{color:'#AB47BC',y:0},{color:'#AB47BC',y:1},{color:'#AB47BC',y:2},{color:'#AB47BC',y:3}],
    result: [[1,6],[8,10],[15,18]],
    mergedRanges: buildMergedRanges(merged)
  });
})();

function buildBarStyles(curIdx, merged, phase) {
  const styles = [];
  for (let k = 0; k < intervals.length; k++) {
    if (k === curIdx) {
      styles.push({color: phase === 'merge' ? '#FF7043' : '#66BB6A', y: 0});
    } else if (phase === 'merge' && k < curIdx && merged.some(m => m[2] === k || (k >= m[2] && k <= curIdx))) {
      // Part of the merging group
      styles.push({color: '#FF7043', y: 1});
    } else if (k < curIdx) {
      styles.push({color: '#AB47BC', y: 0});
    } else {
      styles.push({color: '#BDBDBD', y: 0});
    }
  }
  return styles;
}

function buildMergedRanges(merged) {
  return merged.map((m, idx) => ({ idx, start: m[0], end: m[1], row: idx }));
}

let current = 0;
let autoTimer = null, autoRunning = false;
const svg = document.getElementById('svg');

function render() {
  const s = steps[current];
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = s.desc;
  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= steps.length - 1;

  // Result text
  const rt = document.getElementById('resultText');
  if (s.result && s.result.length > 0 && s.phase === 'done') {
    rt.textContent = '[' + s.result.map(r => '[' + r[0] + ',' + r[1] + ']').join(', ') + ']';
    rt.style.color = '#388E3C';
  } else if (s.result && s.result.length > 0) {
    rt.textContent = '[' + (s.result || []).map(r => '[' + r[0] + ',' + r[1] + ']').join(', ') + ']';
    rt.style.color = '#1976D2';
  } else {
    rt.textContent = '进行中...';
    rt.style.color = '#1976D2';
  }

  let html = '';

  // --- DRAW AXIS ---
  html += '<line x1="60" y1="' + axisY + '" x2="820" y2="' + axisY + '" stroke="' + (isDark() ? '#888' : '#666') + '" stroke-width="1.5"/>';
  html += '<polygon points="820,' + (axisY-5) + ' 820,' + (axisY+5) + ' 828,' + axisY + '" fill="' + (isDark() ? '#888' : '#666') + '"/>';

  // Tick marks and labels every 1 or 2 units
  for (let v = 0; v <= 19; v++) {
    const x = xScale(v);
    if (v % 1 === 0) {
      html += '<line x1="' + x + '" y1="' + axisY + '" x2="' + x + '" y2="' + (axisY + 6) + '" stroke="' + (isDark() ? '#888' : '#666') + '" stroke-width="1"/>';
      html += '<text x="' + x + '" y="' + (axisY + 20) + '" text-anchor="middle" fill="var(--muted)" font-size="11">' + v + '</text>';
    }
  }

  // --- DRAW STAGGERED INTERVAL BARS ---
  // Each original interval: show as a horizontal bar at a different vertical height
  // The y position varies to show overlap clearly
  const rowOffsets = [0, 1, 0, 0]; // row stagger: intervals 0 and 1 overlap so use different rows

  const s1 = s.barStyles || [];
  for (let i = 0; i < intervals.length; i++) {
    const [start, end] = intervals[i];
    const x1 = xScale(start);
    const x2 = xScale(end);
    const row = rowOffsets[i];
    const y = axisY - 50 - row * 42;
    const style = s1[i] || {color:'#BDBDBD', y:0};
    const color = style.color;

    // Bar
    html += '<rect x="' + x1 + '" y="' + y + '" width="' + Math.max(8, x2 - x1) + '" height="' + barH + '" rx="6" fill="' + color + '" opacity="0.85" stroke="' + color + '" stroke-width="1.5"/>';
    // Label inside bar
    html += '<text x="' + ((x1 + x2) / 2) + '" y="' + (y + barH/2 + 5) + '" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">[' + start + ',' + end + ']</text>';

    // Pin start/end markers
    html += '<circle cx="' + x1 + '" cy="' + axisY + '" r="4" fill="' + color + '"/>';
    html += '<circle cx="' + x2 + '" cy="' + axisY + '" r="4" fill="' + color + '"/>';
  }

  // --- DRAW MERGED RESULT BARS (below axis) ---
  if (s.mergedRanges) {
    s.mergedRanges.forEach((mr, idx) => {
      const x1 = xScale(mr.start);
      const x2 = xScale(mr.end);
      const y = axisY + 34 + idx * 36;
      const w = Math.max(40, x2 - x1);

      let mc = '#AB47BC';
      if (current >= steps.length - 1) mc = '#388E3C';

      html += '<rect x="' + x1 + '" y="' + y + '" width="' + w + '" height="' + barH + '" rx="6" fill="' + mc + '" opacity="0.8" stroke="' + mc + '" stroke-width="1.5"/>';
      html += '<text x="' + ((x1 + x2) / 2) + '" y="' + (y + barH/2 + 5) + '" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">[' + mr.start + ',' + mr.end + ']</text>';

      // Vertical connector line from original intervals to merged result
      html += '<line x1="' + ((x1 + x2) / 2) + '" y1="' + (axisY + 30) + '" x2="' + ((x1 + x2) / 2) + '" y2="' + y + '" stroke="' + mc + '" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>';
    });
  }

  // Label
  html += '<text x="820" y="' + (axisY - 10) + '" text-anchor="end" fill="var(--muted)" font-size="10">值</text>';
  html += '<text x="60" y="' + (axisY + 33) + '" text-anchor="start" fill="var(--muted)" font-size="11">合并结果:</text>';

  // Phase indicator
  if (s.curIdx >= 0) {
    const [cs, ce] = intervals[s.curIdx];
    const cx = xScale(cs);
    // Arrow pointing at current interval
    html += '<text x="' + cx + '" y="' + (axisY - 100) + '" text-anchor="middle" fill="' + (s.phase==='merge'?'#FF7043':'#66BB6A') + '" font-size="14" font-weight="bold">▼ 当前</text>';
  }

  svg.innerHTML = html;
}

function isDark() {
  if (typeof window === 'undefined') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function goStep(n) {
  current = Math.max(0, Math.min(n, steps.length - 1));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer); autoRunning = false;
    document.getElementById('playBtn').textContent = '\u25B6 自动播放';
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
    document.getElementById('playBtn').classList.remove('play-btn');
  } else {
    autoRunning = true;
    document.getElementById('playBtn').textContent = '\u23F8 暂停';
    document.getElementById('playBtn').style.background = '#1976D2';
    document.getElementById('playBtn').style.color = '#fff';
    document.getElementById('playBtn').classList.add('play-btn');
    if (current >= steps.length - 1) goStep(0);
    autoTimer = setInterval(function() {
      if (current < steps.length - 1) goStep(current + 1);
      else toggleAuto();
    }, 1200);
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
