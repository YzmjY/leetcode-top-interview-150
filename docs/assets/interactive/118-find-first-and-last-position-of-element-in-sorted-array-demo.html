<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>118. 查找元素第一个和最后一个位置</title>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #2d3436; --sub: #636e72;
  --border: #dfe6e9; --blue: #0984e3; --green: #00b894; --red: #e17055; --purple: #6c5ce7;
  --blue-bg: #dff6fd; --hl-mid: #ffeaa7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #eee; --sub: #aaa;
    --border: #2d3436; --blue: #74b9ff; --green: #55efc4; --red: #ff7675; --purple: #a29bfe;
    --blue-bg: #1a3a5c; --hl-mid: #5c4a1f;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { width:860px; height:500px; background:var(--card); border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
.header { display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:17px; color:var(--text); }
.step-badge { font-size:13px; color:var(--sub); background:var(--border); padding:4px 12px; border-radius:8px; font-weight:500; }
.info-panel { background:var(--blue-bg); border-left:3px solid var(--blue); padding:10px 14px; border-radius:8px; font-size:13px; color:var(--text); min-height:44px; display:flex; flex-wrap:wrap; align-items:center; }
.array-grid { display:flex; gap:4px; justify-content:center; align-items:flex-end; flex:1; }
.cell { width:64px; height:56px; border-radius:8px; background:var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:600; font-size:20px; color:var(--text); z-index:2; transition:all 0.3s; }
.cell .idx { font-size:10px; color:var(--sub); margin-top:1px; }
.cell.mid { background:var(--hl-mid); box-shadow:0 0 0 3px var(--blue); }
.cell.target { border:2px solid var(--green); }
.cell.range { background:var(--green); color:#fff; }
.phase-badge { font-size:12px; background:var(--purple); color:#fff; padding:2px 10px; border-radius:8px; }
.controls { display:flex; gap:8px; justify-content:center; }
.btn { padding:7px 16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; transition:all 0.15s; }
.btn:hover { background:var(--blue-bg); border-color:var(--blue); }
.btn:active { transform:scale(0.96); }
.key-hint { font-size:11px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>118. 查找元素第一个和最后一个位置</h2>
    <span class="step-badge" id="stepBadge">步骤 0/11</span>
  </div>
  <div class="info-panel" id="info"></div>
  <div class="array-grid" id="grid"></div>
  <div class="controls">
    <button class="btn" onclick="reset()">重置</button>
    <button class="btn" onclick="prev()">上步</button>
    <button class="btn" onclick="next()">下步</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button class="btn" onclick="goLast()">跳到最后</button>
  </div>
  <div class="key-hint">键盘: &#8592; &#8593; 上步 | &#8594; &#8595; 下步 | 空格 自动播放 | R 重置 | End 跳到最后</div>
</div>
<script>
const nums = [5,7,7,8,8,10], target = 8;
const n = nums.length;
let steps = [], cur = 0, autoTimer = null, running = false;

function buildSteps() {
  steps = [];
  // 左边界
  let l = 0, r = n - 1, leftBound = -1;
  steps.push({phase:'left',l,r,mid:-1,desc:'【阶段1: 查找左边界】初始化 left=0, right=5',rangeDone:false});
  while (l <= r) {
    let mid = Math.floor((l + r) / 2);
    let desc = `左边界搜索: mid=(${l}+${r})/2=${mid}, nums[${mid}]=${nums[mid]}`;
    if (nums[mid] >= target) { desc += ` >= target, right=mid-1=${mid-1}`; if (nums[mid]===target) leftBound=mid; r = mid - 1; }
    else { desc += ` < target, left=mid+1=${mid+1}`; l = mid + 1; }
    steps.push({phase:'left',l,r,mid,desc,rangeDone:false});
  }
  steps.push({phase:'left-done',l,r,mid:-1,desc:`左边界=${leftBound}`,rangeDone:false});
  // 右边界
  l = 0; r = n - 1; let rightBound = -1;
  steps.push({phase:'right',l,r,mid:-1,desc:'【阶段2: 查找右边界】初始化 left=0, right=5',rangeDone:false});
  while (l <= r) {
    let mid = Math.floor((l + r) / 2);
    let desc = `右边界搜索: mid=(${l}+${r})/2=${mid}, nums[${mid}]=${nums[mid]}`;
    if (nums[mid] <= target) { desc += ` <= target, left=mid+1=${mid+1}`; if (nums[mid]===target) rightBound=mid; l = mid + 1; }
    else { desc += ` > target, right=mid-1=${mid-1}`; r = mid - 1; }
    steps.push({phase:'right',l,r,mid,desc,rangeDone:false});
  }
  steps.push({phase:'done',l:leftBound,r:rightBound,mid:-1,desc:`右边界=${rightBound}，最终结果: [${leftBound}, ${rightBound}]`,rangeDone:true});
}
buildSteps();

function render() {
  const s = steps[cur];
  document.getElementById('stepBadge').textContent = `步骤 ${cur}/${steps.length-1}`;
  document.getElementById('info').innerHTML = `<span class="phase-badge">${s.phase.startsWith('left')?'左边界':'右边界'}</span>&nbsp;${s.desc}`;
  document.getElementById('autoBtn').textContent = running ? '停止' : '自动播放';
  const grid = document.getElementById('grid');
  let html = '';
  for (let i = 0; i < n; i++) {
    let cls = 'cell';
    if (i === s.mid) cls += ' mid';
    if (nums[i] === target) cls += ' target';
    if (s.rangeDone && s.l <= i && i <= s.r) cls += ' range';
    html += `<div class="${cls}"><span>${nums[i]}</span><span class="idx">${i}</span></div>`;
  }
  grid.innerHTML = html;
}
function reset() { stopAuto(); cur = 0; render(); }
function prev() { if (cur > 0) { cur--; render(); } }
function next() { if (cur < steps.length - 1) { cur++; render(); } else { stopAuto(); } }
function goLast() { stopAuto(); cur = steps.length - 1; render(); }
function toggleAuto() { running ? stopAuto() : startAuto(); }
function startAuto() { running = true; render(); autoStep(); }
function stopAuto() { running = false; if (autoTimer) clearTimeout(autoTimer); render(); }
function autoStep() { if (!running) return; if (cur < steps.length - 1) { cur++; render(); autoTimer = setTimeout(autoStep, 600); } else { stopAuto(); } }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  else if (e.key === 'End') { e.preventDefault(); goLast(); }
});
render();
</script>
</body>
</html>
