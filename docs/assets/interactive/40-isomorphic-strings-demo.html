<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222; --sub-bg: #f5f5f5;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --s-color: #1976D2; --t-color: #E53935;
    --ok-color: #388E3C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd; --btn-bg: #333; --btn-hover: #444;
      --sub-bg: #252540;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 16px 20px;
  }
  .container { max-width: 800px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 4px; }
  .sub-title { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 8px; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px;
    font-size: 14px; flex-wrap: wrap;
  }
  .step-num { font-weight: bold; font-size: 24px; color: #1976D2; min-width: 36px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; max-width: 560px; text-align: center; }

  .str-row { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 6px; }
  .str-label { font-size: 12px; font-weight: bold; width: 40px; text-align: right; }
  .str-cells { display: flex; gap: 4px; }
  .scell {
    width: 48px; height: 48px; border: 2px solid var(--cell-border); border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; background: var(--cell-bg); color: var(--text);
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
  }
  .scell .sidx { font-size: 9px; color: var(--muted); }
  .scell.hls { border-color: var(--s-color); background: rgba(25,118,210,0.12); transform: scale(1.06); z-index: 2; }
  .scell.hlt { border-color: var(--t-color); background: rgba(229,57,53,0.12); transform: scale(1.06); z-index: 2; }
  .scell.matched { border-color: var(--ok-color); background: rgba(56,142,60,0.12); }

  .mapping-panel {
    background: var(--sub-bg); border-radius: 8px; padding: 8px 14px;
    margin-bottom: 6px; text-align: center; font-size: 13px;
  }
  .map-table { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .map-cell {
    min-width: 60px; padding: 4px 8px; border: 2px solid var(--cell-border); border-radius: 8px;
    text-align: center; font-size: 14px; font-weight: bold; background: var(--cell-bg);
  }
  .map-cell .map-dir { font-size: 10px; color: var(--muted); }
  .map-cell.hl { border-color: var(--s-color); background: rgba(25,118,210,0.12); }

  .result-row {
    background: var(--sub-bg); border-radius: 8px; padding: 8px 14px;
    margin-bottom: 6px; font-size: 13px; text-align: center;
  }
  .result-row .highlight { font-weight: bold; font-size: 15px; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }
</style>
</head>
<body>
<div class="container">
  <h2>同构字符串 — 双向映射演示</h2>
  <div class="sub-title">s="egg", t="add" &rarr; s→t 和 t→s 均一一对应, 是同构字符串</div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">初始状态 · 点击「下一步」开始</span>
  </div>

  <div class="str-row">
    <span class="str-label" style="color:var(--s-color)">s:</span>
    <div class="str-cells" id="sCells"></div>
  </div>
  <div class="str-row">
    <span class="str-label" style="color:var(--t-color)">t:</span>
    <div class="str-cells" id="tCells"></div>
  </div>

  <div class="mapping-panel">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">映射表</div>
    <div class="map-table">
      <span class="map-cell" id="mapSt"><span class="map-dir">s→t</span><br><span style="font-size:16px;font-family:monospace;" id="mapStVal">{}</span></span>
      <span class="map-cell" id="mapTs"><span class="map-dir">t→s</span><br><span style="font-size:16px;font-family:monospace;" id="mapTsVal">{}</span></span>
    </div>
  </div>

  <div class="result-row">
    <span style="color:var(--muted)">判定: </span><span id="resultText" class="highlight" style="color:#1976D2;">进行中...</span>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">&#x23EE; 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">&#x25C0; 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 &#x25B6;</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">&#x25B6; 自动播放</button>
    <button onclick="goStep(steps.length-1)">&#x23ED; 跳到最后</button>
  </div>
</div>

<script>
const s = 'egg', t = 'add';
const n = s.length;

const steps = [];

function simulate() {
  const mapSt = {}, mapTs = {};

  steps.push({
    desc: '初始状态 · s="egg", t="add"',
    phase: 'init', idx: -1,
    mapSt: {}, mapTs: {}, sHL: [], tHL: [],
    result: 'init'
  });

  for (let i = 0; i < n; i++) {
    const sc = s[i], tc = t[i];
    steps.push({
      desc: '第' + i + '步: s[' + i + ']=' + sc + ', t[' + i + ']=' + tc,
      phase: 'check', idx: i,
      mapSt: {...mapSt}, mapTs: {...mapTs},
      sHL: [[i, 's']], tHL: [[i, 't']],
      result: 'checking'
    });

    if (mapSt[sc] !== undefined && mapSt[sc] !== tc) {
      steps.push({
        desc: '冲突! s→t: ' + sc + '→' + mapSt[sc] + ' 已有映射, 现在要映射到 ' + tc + ' &rarr; false',
        phase: 'fail', idx: i,
        mapSt: {...mapSt}, mapTs: {...mapTs},
        sHL: [[i, 's']], tHL: [[i, 't']],
        result: 'fail'
      });
      return;
    }
    if (mapTs[tc] !== undefined && mapTs[tc] !== sc) {
      steps.push({
        desc: '冲突! t→s: ' + tc + '→' + mapTs[tc] + ' 已有映射, 现在要映射到 ' + sc + ' &rarr; false',
        phase: 'fail', idx: i,
        mapSt: {...mapSt}, mapTs: {...mapTs},
        sHL: [[i, 's']], tHL: [[i, 't']],
        result: 'fail'
      });
      return;
    }

    mapSt[sc] = tc;
    mapTs[tc] = sc;
    steps.push({
      desc: '添加映射: s→t: ' + sc + '→' + tc + ', t→s: ' + tc + '→' + sc,
      phase: 'mapped', idx: i,
      mapSt: {...mapSt}, mapTs: {...mapTs},
      sHL: [[i, 'matched']], tHL: [[i, 'matched']],
      result: 'checking'
    });
  }

  steps.push({
    desc: '所有字符检查完毕! 双向映射一一对应 &rarr; 是同构字符串.',
    phase: 'done', idx: -1,
    mapSt: {...mapSt}, mapTs: {...mapTs},
    sHL: [[0,'matched'],[1,'matched'],[2,'matched']],
    tHL: [[0,'matched'],[1,'matched'],[2,'matched']],
    result: 'success'
  });
}

simulate();

let current = 0;
let autoTimer = null;
let autoRunning = false;

// Build cells
const sEl = document.getElementById('sCells');
s.split('').forEach((ch, i) => {
  const cell = document.createElement('div');
  cell.className = 'scell';
  cell.id = 'sc' + i;
  cell.innerHTML = ch + '<span class="sidx">[' + i + ']</span>';
  sEl.appendChild(cell);
});
const tEl = document.getElementById('tCells');
t.split('').forEach((ch, i) => {
  const cell = document.createElement('div');
  cell.className = 'scell';
  cell.id = 'tc' + i;
  cell.innerHTML = ch + '<span class="sidx">[' + i + ']</span>';
  tEl.appendChild(cell);
});

function render() {
  const s = steps[current];
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = s.desc;

  document.getElementById('mapStVal').textContent = '{' + Object.entries(s.mapSt).map(([k,v]) => k+'→'+v).join(', ') + '}';
  document.getElementById('mapTsVal').textContent = '{' + Object.entries(s.mapTs).map(([k,v]) => k+'→'+v).join(', ') + '}';

  // Reset
  for (let i = 0; i < n; i++) {
    document.getElementById('sc' + i).className = 'scell';
    document.getElementById('tc' + i).className = 'scell';
  }

  if (s.sHL) s.sHL.forEach(([i, type]) => {
    document.getElementById('sc' + i).className = 'scell ' + (type === 's' ? 'hls' : 'matched');
  });
  if (s.tHL) s.tHL.forEach(([i, type]) => {
    document.getElementById('tc' + i).className = 'scell ' + (type === 't' ? 'hlt' : 'matched');
  });

  const rt = document.getElementById('resultText');
  if (s.result === 'success') { rt.textContent = 'true - 同构!'; rt.style.color = '#388E3C'; }
  else if (s.result === 'fail') { rt.textContent = 'false - 不同构!'; rt.style.color = '#E53935'; }
  else if (s.result === 'init') { rt.textContent = '进行中...'; rt.style.color = '#1976D2'; }
  else { rt.textContent = '检查中...'; rt.style.color = '#1976D2'; }

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= steps.length - 1;
}

function goStep(n) {
  current = Math.max(0, Math.min(n, steps.length - 1));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer); autoRunning = false;
    document.getElementById('playBtn').textContent = '\u25B6 自动播放';
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
    document.getElementById('playBtn').classList.remove('play-btn');
  } else {
    autoRunning = true;
    document.getElementById('playBtn').textContent = '\u23F8 暂停';
    document.getElementById('playBtn').style.background = '#1976D2';
    document.getElementById('playBtn').style.color = '#fff';
    document.getElementById('playBtn').classList.add('play-btn');
    if (current >= steps.length - 1) goStep(0);
    autoTimer = setInterval(function() {
      if (current < steps.length - 1) goStep(current + 1);
      else toggleAuto();
    }, 1000);
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
