<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>130. 数字范围按位与</title>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #2d3436; --sub: #636e72;
  --border: #dfe6e9; --blue: #0984e3; --green: #00b894; --red: #e17055;
  --blue-bg: #dff6fd; --hl: #ffeaa7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #eee; --sub: #aaa;
    --border: #2d3436; --blue: #74b9ff; --green: #55efc4; --red: #ff7675;
    --blue-bg: #1a3a5c; --hl: #5c4a1f;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { width:860px; height:500px; background:var(--card); border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
.header { display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:17px; color:var(--text); }
.step-badge { font-size:13px; color:var(--sub); background:var(--border); padding:4px 12px; border-radius:8px; font-weight:500; }
.info-panel { background:var(--blue-bg); border-left:3px solid var(--blue); padding:10px 14px; border-radius:8px; font-size:13px; color:var(--text); min-height:44px; display:flex; align-items:center; }
.binary-compare { display:flex; flex-direction:column; gap:8px; flex:1; align-items:center; justify-content:center; }
.bin-row { display:flex; gap:2px; align-items:center; }
.bin-label { font-size:12px; font-weight:600; color:var(--sub); width:60px; text-align:right; margin-right:8px; }
.bin-cell { width:32px; height:36px; border-radius:6px; background:var(--border); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; color:var(--text); transition:all 0.3s; }
.bin-cell.match { background:var(--green); color:#fff; }
.bin-cell.diff { background:var(--red); color:#fff; }
.bin-cell.prefix { background:var(--green-bg); box-shadow:0 0 0 2px var(--green); }
.bin-cell.hl { background:var(--hl); box-shadow:0 0 0 2px var(--blue); }
.arrow-row { display:flex; gap:2px; align-items:center; }
.arrow-cell { width:32px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--sub); }
.result-box { text-align:center; font-weight:700; font-size:18px; color:var(--green); padding:6px; border-radius:8px; border:2px solid var(--green); background:var(--green-bg); }
.controls { display:flex; gap:8px; justify-content:center; }
.btn { padding:7px 16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; transition:all 0.15s; }
.btn:hover { background:var(--blue-bg); border-color:var(--blue); }
.btn:active { transform:scale(0.96); }
.key-hint { font-size:11px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>130. 数字范围按位与: left=5, right=7</h2>
    <span class="step-badge" id="stepBadge">步骤 0/5</span>
  </div>
  <div class="info-panel" id="info"></div>
  <div class="binary-compare">
    <div class="bin-row"><span class="bin-label">left=5</span><span id="leftBits"></span></div>
    <div class="bin-row"><span class="bin-label">right=7</span><span id="rightBits"></span></div>
    <div class="bin-row"><span class="bin-label">公共前缀</span><span id="prefixBits"></span></div>
  </div>
  <div class="result-box" id="result">结果: ?</div>
  <div class="controls">
    <button class="btn" onclick="reset()">重置</button>
    <button class="btn" onclick="prev()">上步</button>
    <button class="btn" onclick="next()">下步</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button class="btn" onclick="goLast()">跳到最后</button>
  </div>
  <div class="key-hint">键盘: &#8592; &#8593; 上步 | &#8594; &#8595; 下步 | 空格 自动播放</div>
</div>
<script>
const left = 5, right = 7; // 101, 111 → 100 = 4
const BIT_W = 4;
let steps = [], cur = 0, autoTimer = null, running = false;

function toBin(v) { return v.toString(2).padStart(BIT_W,'0'); }

function buildSteps() {
  steps = [];
  let l = left, r = right, shift = 0;
  steps.push({l,r,shift,prefix:'',desc:`left=5(${toBin(5)}), right=7(${toBin(7)}), 找公共前缀`});
  while (l < r) {
    l >>= 1; r >>= 1; shift++;
    steps.push({l,r,shift,prefix:toBin(left>>shift).slice(0,BIT_W-shift),desc:`右移${shift}位: left=${l}(${toBin(l).slice(BIT_W-shift)}), right=${r}(${toBin(r).slice(BIT_W-shift)})`});
  }
  let ans = l << shift;
  let prefix = toBin(left).slice(0, BIT_W - shift);
  steps.push({l,r,shift,prefix,ans,desc:`left==right=${l}, 左移${shift}位 → ${ans}(${toBin(ans)}) = 公共前缀${prefix.padEnd(BIT_W,'0')}`,final:true});
}
buildSteps();

function render() {
  const s = steps[cur];
  document.getElementById('stepBadge').textContent = `步骤 ${cur}/${steps.length-1}`;
  document.getElementById('info').textContent = s.desc;
  document.getElementById('autoBtn').textContent = running ? '停止' : '自动播放';
  document.getElementById('result').textContent = s.final ? `答案: ${s.ans} (${toBin(s.ans)})` : '寻找公共前缀中...';
  const lbin = toBin(left);
  const rbin = toBin(right);
  let lhtml = '', rhtml = '', phtml = '';
  let prefixLen = BIT_W - s.shift;
  for (let i = 0; i < BIT_W; i++) {
    let lcls = 'bin-cell', rcls = 'bin-cell', pcls = 'bin-cell';
    if (i < prefixLen) {
      lcls += ' prefix'; rcls += ' prefix'; pcls += ' prefix';
    } else if (s.final) {
      lcls += ' diff'; rcls += ' diff';
    }
    lhtml += `<div class="${lcls}">${lbin[i]}</div>`;
    rhtml += `<div class="${rcls}">${rbin[i]}</div>`;
    if (i < prefixLen) phtml += `<div class="${pcls}">${lbin[i]}</div>`;
    else phtml += `<div class="${pcls}">0</div>`;
  }
  document.getElementById('leftBits').innerHTML = lhtml;
  document.getElementById('rightBits').innerHTML = rhtml;
  document.getElementById('prefixBits').innerHTML = phtml;
}
function reset() { cur = 0; stopAuto(); render(); }
function prev() { if (cur > 0) { cur--; render(); } }
function next() { if (cur < steps.length - 1) { cur++; render(); } else { stopAuto(); } }
function goLast() { stopAuto(); cur = steps.length - 1; render(); }
function toggleAuto() { running ? stopAuto() : startAuto(); }
function startAuto() { running = true; render(); autoStep(); }
function stopAuto() { running = false; if (autoTimer) clearTimeout(autoTimer); render(); }
function autoStep() { if (!running) return; if (cur < steps.length - 1) { cur++; render(); autoTimer = setTimeout(autoStep, 600); } else { stopAuto(); } }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  else if (e.key === 'End') { e.preventDefault(); goLast(); }
});
render();
</script>
</body>
</html>
