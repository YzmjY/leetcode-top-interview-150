<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉树的层序遍历</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:820px;width:100%}
h2{text-align:center;color:var(--header);font-size:17px;margin-bottom:4px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px;font-size:14px}
.step-num{font-weight:bold;font-size:22px;color:#1976D2;min-width:36px;text-align:center}
.step-desc{color:var(--muted);font-size:12px;max-width:550px;text-align:center}
.main-row{display:flex;gap:10px}
.col-svg{flex:1.5}
.col-info{flex:1}
svg{display:block;margin:0 auto;width:100%;height:400px}
.queue-box{background:var(--sub-bg);border-radius:8px;padding:10px;min-height:150px}
.queue-box h4{text-align:center;margin-bottom:6px;font-size:12px;color:var(--header)}
.queue-item{display:inline-block;background:var(--bg);border:1px solid var(--cell-border);border-radius:6px;padding:5px 12px;margin:2px;font-size:13px;font-weight:bold;color:var(--text)}
.queue-item.blue{border-color:#1976D2;background:#E3F2FD}
.output-box{background:var(--sub-bg);border-radius:8px;padding:8px;margin-top:6px;text-align:center;font-size:13px}
.output-box .val{color:#1976D2;font-weight:bold}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
button{padding:7px 15px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:12px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
</style>
</head>
<body>
<div class="container">
<h2>二叉树的层序遍历 — BFS队列演示</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">树：[3,9,20,null,null,15,7] · 输出[[3],[9,20],[15,7]]</span>
</div>
<div class="main-row">
<div class="col-svg"><svg id="treeSvg" viewBox="0 0 400 380"></svg></div>
<div class="col-info">
<div class="queue-box"><h4>BFS 队列</h4><div id="queueBox"></div></div>
<div class="output-box">当前层 <span class="val" id="curLevel">-</span></div>
<div class="output-box">输出 <span class="val" id="allOutput">[]</span></div>
</div>
</div>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
const nodes=[{x:200,y:40,val:3},{x:100,y:140,val:9},{x:300,y:140,val:20},{x:180,y:260,val:15},{x:340,y:260,val:7}];
const edges=[[0,1],[0,2],[2,3],[2,4]];

const steps=[
{desc:'初始：队列=[3]，准备处理第1层',hl:[],queue:[3],curLvl:[],output:[]},
{desc:'第1层：出队3，入队[9,20]。当前层=[3]',hl:[0],queue:[9,20],curLvl:[3],output:[[3]]},
{desc:'第2层：出队9,20，入队[15,7]。当前层=[9,20]',hl:[1,2],queue:[15,7],curLvl:[9,20],output:[[3],[9,20]]},
{desc:'第3层：出队15,7，无子节点。当前层=[15,7]',hl:[3,4],queue:[],curLvl:[15,7],output:[[3],[9,20],[15,7]]},
{desc:'完成！层序遍历 = [[3],[9,20],[15,7]]',hl:[0,1,2,3,4],queue:[],curLvl:[],output:[[3],[9,20],[15,7]]}
];

let cur=0,autoTimer=null,autoRun=false;
const svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;

// SVG
let html='<defs><radialGradient id="gBlue"><stop offset="0%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#1976D2"/></radialGradient></defs><rect width="400" height="380" fill="transparent"/>';
for(const e of edges) {
const a=nodes[e[0]],b=nodes[e[1]];
const visited=s.hl.includes(e[0])&&s.hl.includes(e[1]);
html+=`<line x1="${a.x}" y1="${a.y+24}" x2="${b.x}" y2="${b.y-24}" stroke="${visited?'#1976D2':'#ccc'}" stroke-width="${visited?2.5:2}"/>`;
}
for(let i=0;i<nodes.length;i++){
const n=nodes[i];const isHL=s.hl.includes(i);
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="${isHL?'url(#gBlue)':'var(--sub-bg)'}" stroke="${isHL?'#0D47A1':'var(--cell-border)'}" stroke-width="${isHL?3:2}"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="${isHL?'#fff':'var(--text)'}" font-size="14" font-weight="bold">${n.val}</text>`;
}
svg.innerHTML=html;

// Queue
let qHtml='';
for(const v of s.queue){
qHtml+=`<span class="queue-item blue">${v}</span>`;
}
if(s.queue.length===0)qHtml='<span style="color:var(--muted)">队列为空</span>';
document.getElementById('queueBox').innerHTML=qHtml;

// Current level
document.getElementById('curLevel').textContent=s.curLvl.length?'['+s.curLvl.join(', ')+']':'-';

// Output
document.getElementById('allOutput').textContent='['+s.output.map(a=>'['+a.join(',')+']').join(', ')+']';
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},900);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
