<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222; --sub-bg: #f5f5f5;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --s-color: #1976D2; --t-color: #E53935;
    --ok-color: #388E3C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd; --btn-bg: #333; --btn-hover: #444;
      --sub-bg: #252540;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 16px 20px;
  }
  .container { max-width: 820px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 4px; }
  .sub-title { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 8px; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px;
    font-size: 14px; flex-wrap: wrap;
  }
  .step-num { font-weight: bold; font-size: 24px; color: #1976D2; min-width: 36px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; max-width: 560px; text-align: center; }

  .str-row { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 6px; }
  .str-label { font-size: 12px; font-weight: bold; width: 30px; text-align: right; }
  .str-cells { display: flex; gap: 3px; }
  .scell {
    width: 44px; height: 44px; border: 2px solid var(--cell-border); border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; background: var(--cell-bg); color: var(--text);
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
  }
  .scell .sidx { font-size: 8px; color: var(--muted); }
  .scell.hls { border-color: var(--s-color); background: rgba(25,118,210,0.12); transform: scale(1.06); z-index: 2; }
  .scell.hlt { border-color: var(--t-color); background: rgba(229,57,53,0.12); transform: scale(1.06); z-index: 2; }
  .scell.matched { border-color: var(--ok-color); background: rgba(56,142,60,0.12); }

  .hist-panel {
    background: var(--sub-bg); border-radius: 8px; padding: 8px 14px;
    margin-bottom: 6px; text-align: center;
  }
  .hist-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .hist-bar {
    width: 32px; display: flex; flex-direction: column; align-items: center;
    transition: height 0.3s;
  }
  .hist-bar-fill {
    width: 28px; border-radius: 4px 4px 0 0;
    transition: height 0.3s, background 0.3s;
  }
  .hist-bar-s { background: var(--s-color); }
  .hist-bar-t { background: var(--t-color); }
  .hist-label { font-size: 11px; font-weight: bold; margin-top: 2px; }
  .hist-char { font-size: 13px; font-weight: bold; }

  .result-row {
    background: var(--sub-bg); border-radius: 8px; padding: 8px 14px;
    margin-bottom: 6px; font-size: 13px; text-align: center;
  }
  .result-row .highlight { font-weight: bold; font-size: 15px; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }
</style>
</head>
<body>
<div class="container">
  <h2>有效的字母异位词 — 频率柱状图对比</h2>
  <div class="sub-title">s="anagram", t="nagaram" &rarr; 两个字符串字母频率是否完全一致?</div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">初始状态 · 点击「下一步」开始统计</span>
  </div>

  <div class="str-row">
    <span class="str-label" style="color:var(--s-color)">s:</span>
    <div class="str-cells" id="sCells"></div>
  </div>
  <div class="str-row">
    <span class="str-label" style="color:var(--t-color)">t:</span>
    <div class="str-cells" id="tCells"></div>
  </div>

  <div class="hist-panel">
    <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">频率对比</div>
    <div class="hist-row" id="histRow"></div>
  </div>

  <div class="result-row">
    <span style="color:var(--muted)">判定: </span><span id="resultText" class="highlight" style="color:#1976D2;">进行中...</span>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">&#x23EE; 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">&#x25C0; 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 &#x25B6;</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">&#x25B6; 自动播放</button>
    <button onclick="goStep(steps.length-1)">&#x23ED; 跳到最后</button>
  </div>
</div>

<script>
const s = 'anagram', t = 'nagaram';
const n = s.length;
const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('');

const steps = [];
const freqS = {}, freqT = {};
alphabet.forEach(ch => { freqS[ch] = 0; freqT[ch] = 0; });

function cloneFreq(f) { return {...f}; }

function simulate() {
  steps.push({
    desc: '初始状态 · s="anagram", t="nagaram"',
    phase: 'init',
    freqS: cloneFreq(freqS), freqT: cloneFreq(freqT),
    sHL: [], tHL: [],
    result: 'init'
  });

  // Count s
  for (let i = 0; i < n; i++) {
    freqS[s[i]]++;
    const si = i + 1;
    steps.push({
      desc: '统计 s[' + i + ']=' + s[i] + ' &rarr; 频率表 [' + s[i] + ']=' + freqS[s[i]],
      phase: 'count-s',
      freqS: cloneFreq(freqS), freqT: cloneFreq(freqT),
      sHL: [[i, 's']], tHL: [],
      result: 'counting'
    });
  }

  // Count t
  for (let i = 0; i < n; i++) {
    freqT[t[i]]++;
    steps.push({
      desc: '统计 t[' + i + ']=' + t[i] + ' &rarr; 频率表 [' + t[i] + ']=' + freqT[t[i]],
      phase: 'count-t',
      freqS: cloneFreq(freqS), freqT: cloneFreq(freqT),
      sHL: [], tHL: [[i, 't']],
      result: 'counting'
    });
  }

  // Compare
  const eq = alphabet.every(ch => freqS[ch] === freqT[ch]);
  if (eq) {
    steps.push({
      desc: '对比完成! 所有字母频率一致 &rarr; 是字母异位词.',
      phase: 'done',
      freqS: cloneFreq(freqS), freqT: cloneFreq(freqT),
      sHL: n > 0 ? [...Array(n)].map((_,i) => [i, 'matched']) : [],
      tHL: n > 0 ? [...Array(n)].map((_,i) => [i, 'matched']) : [],
      result: 'success'
    });
  } else {
    steps.push({
      desc: '对比发现不一致! 不是字母异位词.',
      phase: 'done',
      freqS: cloneFreq(freqS), freqT: cloneFreq(freqT),
      sHL: [], tHL: [],
      result: 'fail'
    });
  }
}

simulate();

let current = 0;
let autoTimer = null;
let autoRunning = false;

// Build cells
const sEl = document.getElementById('sCells');
s.split('').forEach((ch, i) => {
  const cell = document.createElement('div');
  cell.className = 'scell'; cell.id = 'sc' + i;
  cell.innerHTML = ch + '<span class="sidx">' + i + '</span>';
  sEl.appendChild(cell);
});
const tEl = document.getElementById('tCells');
t.split('').forEach((ch, i) => {
  const cell = document.createElement('div');
  cell.className = 'scell'; cell.id = 'tc' + i;
  cell.innerHTML = ch + '<span class="sidx">' + i + '</span>';
  tEl.appendChild(cell);
});

// Build histogram
const histRow = document.getElementById('histRow');
alphabet.forEach(ch => {
  const bar = document.createElement('div');
  bar.className = 'hist-bar';
  bar.innerHTML = '<div class="hist-bar-fill" id="histS_' + ch + '" style="height:0;background:var(--s-color);"></div>' +
    '<span class="hist-char" style="color:var(--s-color);font-size:10px;">s</span>' +
    '<div class="hist-bar-fill" id="histT_' + ch + '" style="height:0;background:var(--t-color);"></div>' +
    '<span class="hist-char" style="color:var(--t-color);font-size:10px;">t</span>' +
    '<span class="hist-label" id="histLbl_' + ch + '">' + ch + '</span>';
  histRow.appendChild(bar);
});

function render() {
  const step = steps[current];
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = step.desc;

  for (let i = 0; i < n; i++) {
    document.getElementById('sc' + i).className = 'scell';
    document.getElementById('tc' + i).className = 'scell';
  }
  if (step.sHL) step.sHL.forEach(([i, type]) => {
    document.getElementById('sc' + i).className = 'scell ' + (type === 's' ? 'hls' : 'matched');
  });
  if (step.tHL) step.tHL.forEach(([i, type]) => {
    document.getElementById('tc' + i).className = 'scell ' + (type === 't' ? 'hlt' : 'matched');
  });

  const maxH = Math.max(...Object.values(step.freqS), ...Object.values(step.freqT), 1);
  alphabet.forEach(ch => {
    document.getElementById('histS_' + ch).style.height = (step.freqS[ch] / maxH * 40) + 'px';
    document.getElementById('histT_' + ch).style.height = (step.freqT[ch] / maxH * 40) + 'px';
    const eq = step.freqS[ch] === step.freqT[ch];
    document.getElementById('histLbl_' + ch).style.color = eq ? 'var(--ok-color)' : '#E53935';
  });

  const rt = document.getElementById('resultText');
  if (step.result === 'success') { rt.textContent = 'true - 是异位词!'; rt.style.color = '#388E3C'; }
  else if (step.result === 'fail') { rt.textContent = 'false - 不是!'; rt.style.color = '#E53935'; }
  else if (step.result === 'init') { rt.textContent = '进行中...'; rt.style.color = '#1976D2'; }
  else { rt.textContent = '统计中...'; rt.style.color = '#1976D2'; }

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= steps.length - 1;
}

function goStep(n) {
  current = Math.max(0, Math.min(n, steps.length - 1));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer); autoRunning = false;
    document.getElementById('playBtn').textContent = '\u25B6 自动播放';
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
    document.getElementById('playBtn').classList.remove('play-btn');
  } else {
    autoRunning = true;
    document.getElementById('playBtn').textContent = '\u23F8 暂停';
    document.getElementById('playBtn').style.background = '#1976D2';
    document.getElementById('playBtn').style.color = '#fff';
    document.getElementById('playBtn').classList.add('play-btn');
    if (current >= steps.length - 1) goStep(0);
    autoTimer = setInterval(function() {
      if (current < steps.length - 1) goStep(current + 1);
      else toggleAuto();
    }, 1000);
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
