<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉树中的最大路径和</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:780px;width:100%}
h2{text-align:center;color:var(--header);font-size:17px;margin-bottom:6px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px;font-size:14px}
.step-num{font-weight:bold;font-size:22px;color:#1976D2;min-width:36px;text-align:center}
.step-desc{color:var(--muted);font-size:12px;max-width:550px;text-align:center}
svg{display:block;margin:0 auto;width:100%;height:430px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
button{padding:7px 15px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:12px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
</style>
</head>
<body>
<div class="container">
<h2>二叉树中的最大路径和 — 后序遍历计算</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">树：[-10,9,20,null,null,15,7] · 最大路径和=42</span>
</div>
<svg id="treeSvg" viewBox="0 0 720 420"></svg>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
const nodes=[{x:360,y:40,val:-10},{x:210,y:140,val:9},{x:510,y:140,val:20},{x:410,y:260,val:15},{x:610,y:260,val:7}];
const edges=[[0,1],[0,2],[2,3],[2,4]];
const pathOrder=[1,3,4,2,0]; // postorder

const steps=[
{desc:'初始状态：树 [-10,9,20,null,null,15,7] · 后序遍历计算',hl:[],sel:[],maxSum:0,info:''},
{desc:'后序访问9：单侧贡献=max(0,9)=9，当前maxSum=9',hl:[1],sel:[1],maxSum:9,info:'节点9: 贡献=9'},
{desc:'后序访问15：单侧贡献=max(0,15)=15，当前maxSum=15',hl:[1,3],sel:[3],maxSum:15,info:'节点15: 贡献=15'},
{desc:'后序访问7：单侧贡献=max(0,7)=7，当前maxSum=15',hl:[1,3,4],sel:[4],maxSum:15,info:'节点7: 贡献=7'},
{desc:'后序访问20：路径15+20+7=42，单侧贡献=20+max(15,7)=35，更新maxSum=42',hl:[1,3,4,2],sel:[2],maxSum:42,info:'节点20: 路径15+20+7=42'},
{desc:'后序访问-10：路径9+(-10)+35=34 < 42，最终maxSum=42',hl:[0,1,2,3,4],sel:[0],maxSum:42,info:'节点-10: 最终maxSum=42'}
];

let cur=0,autoTimer=null,autoRun=false;
const svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;

let html='<defs><radialGradient id="gBlue"><stop offset="0%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#1976D2"/></radialGradient><radialGradient id="gOr"><stop offset="0%" stop-color="#FFB74D"/><stop offset="100%" stop-color="#FF9800"/></radialGradient><radialGradient id="gGr"><stop offset="0%" stop-color="#81C784"/><stop offset="100%" stop-color="#4CAF50"/></radialGradient></defs><rect width="720" height="420" fill="transparent"/>';
for(const e of edges) {
const a=nodes[e[0]],b=nodes[e[1]];
html+=`<line x1="${a.x}" y1="${a.y+24}" x2="${b.x}" y2="${b.y-24}" stroke="#ccc" stroke-width="2"/>`;
}
// Highlight best path edges
if(cur===4||cur===5){
html+=`<line x1="${nodes[2].x}" y1="${nodes[2].y+24}" x2="${nodes[3].x}" y2="${nodes[3].y-24}" stroke="#FF5722" stroke-width="3"/>`;
html+=`<line x1="${nodes[2].x}" y1="${nodes[2].y+24}" x2="${nodes[4].x}" y2="${nodes[4].y-24}" stroke="#FF5722" stroke-width="3"/>`;
html+=`<line x1="${nodes[0].x}" y1="${nodes[0].y+24}" x2="${nodes[2].x}" y2="${nodes[2].y-24}" stroke="#FF5722" stroke-width="3"/>`;
}
for(let i=0;i<nodes.length;i++){
const n=nodes[i];const isSel=s.sel.includes(i);
const visited=s.hl.includes(i)&&!isSel;
if(s.sel[0]===i&&s.sel.length===1){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gOr)" stroke="#E65100" stroke-width="3"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">${n.val}</text>`;
}else if(visited){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="var(--sub-bg)" stroke="#999" stroke-width="2" opacity="0.5"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="var(--muted)" font-size="14">${n.val}</text>`;
}else{
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="2"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="var(--text)" font-size="14">${n.val}</text>`;
}
}
if(s.maxSum>0){
html+=`<text x="360" y="395" text-anchor="middle" fill="#FF5722" font-size="15" font-weight="bold">maxSum = ${s.maxSum}</text>`;
if(s.info)html+=`<text x="360" y="410" text-anchor="middle" fill="var(--muted)" font-size="11">${s.info}</text>`;
}
svg.innerHTML=html;
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},1000);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
