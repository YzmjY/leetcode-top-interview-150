<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>125. 二进制求和</title>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #2d3436; --sub: #636e72;
  --border: #dfe6e9; --blue: #0984e3; --green: #00b894; --red: #e17055; --orange: #e17055;
  --blue-bg: #dff6fd; --hl: #ffeaa7; --carry-bg: #ffe0dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #eee; --sub: #aaa;
    --border: #2d3436; --blue: #74b9ff; --green: #55efc4; --red: #ff7675; --orange: #fab1a0;
    --blue-bg: #1a3a5c; --hl: #5c4a1f; --carry-bg: #4a2025;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { width:860px; height:500px; background:var(--card); border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
.header { display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:17px; color:var(--text); }
.step-badge { font-size:13px; color:var(--sub); background:var(--border); padding:4px 12px; border-radius:8px; font-weight:500; }
.info-panel { background:var(--blue-bg); border-left:3px solid var(--blue); padding:10px 14px; border-radius:8px; font-size:13px; color:var(--text); min-height:44px; display:flex; align-items:center; }
.bits { display:flex; flex-direction:column; gap:8px; flex:1; align-items:center; justify-content:center; }
.bit-row { display:flex; gap:4px; align-items:center; }
.bit-row-label { font-size:12px; font-weight:600; color:var(--sub); width:70px; text-align:right; margin-right:8px; }
.bit-cell { width:48px; height:48px; border-radius:8px; background:var(--border); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; color:var(--text); transition:all 0.3s; }
.bit-cell.hl { background:var(--hl); box-shadow:0 0 0 2px var(--blue); }
.bit-cell.result { background:var(--green); color:#fff; }
.bit-cell.carry { background:var(--carry-bg); box-shadow:0 0 0 2px var(--red); }
.carry-indicator { font-size:14px; font-weight:700; color:var(--red); }
.controls { display:flex; gap:8px; justify-content:center; }
.btn { padding:7px 16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; transition:all 0.15s; }
.btn:hover { background:var(--blue-bg); border-color:var(--blue); }
.btn:active { transform:scale(0.96); }
.key-hint { font-size:11px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>125. 二进制求和: 1010 + 1011 = 10101</h2>
    <span class="step-badge" id="stepBadge">步骤 0/7</span>
  </div>
  <div class="info-panel" id="info"></div>
  <div class="carry-indicator" id="carryInfo" style="text-align:center;"></div>
  <div class="bits" id="bitsViz"></div>
  <div class="controls">
    <button class="btn" onclick="reset()">重置</button>
    <button class="btn" onclick="prev()">上步</button>
    <button class="btn" onclick="next()">下步</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button class="btn" onclick="goLast()">跳到最后</button>
  </div>
  <div class="key-hint">键盘: &#8592; &#8593; 上步 | &#8594; &#8595; 下步 | 空格 自动播放</div>
</div>
<script>
const a = '1010', b = '1011';
const maxLen = Math.max(a.length, b.length);
const aPadded = a.padStart(maxLen+1, '0');
const bPadded = b.padStart(maxLen+1, '0');
let steps = [], cur = 0, autoTimer = null, running = false;

function buildSteps() {
  steps = [];
  let carry = 0;
  let result = [];
  let carryArr = [0];
  // align to maxLen
  let ia = a.length-1, ib = b.length-1;
  steps.push({pos:-1,carry:0,result:[],desc:`a="${a}", b="${b}", 从右向左逐位相加`,highlight:-1});
  while (ia >= 0 || ib >= 0 || carry) {
    let da = ia >= 0 ? parseInt(a[ia]) : 0;
    let db = ib >= 0 ? parseInt(b[ib]) : 0;
    let sum = da + db + carry;
    let bit = sum % 2;
    carry = Math.floor(sum / 2);
    result.unshift(bit);
    let pos = Math.max(ia, ib);
    let desc = `位${pos}: ${da} + ${db} + 进位${carryArr[carryArr.length-1]||0} = ${sum} → 结果${bit}, 进位${carry}`;
    steps.push({pos,carry,result:[...result],desc,highlight:pos,da,db});
    ia--; ib--;
    carryArr.push(carry);
  }
  steps.push({pos:-1,carry:0,result:[...result],desc:`最终结果: ${result.join('')}`,highlight:-1,final:true});
}
buildSteps();

function render() {
  const s = steps[cur];
  document.getElementById('stepBadge').textContent = `步骤 ${cur}/${steps.length-1}`;
  document.getElementById('info').textContent = s.desc;
  document.getElementById('autoBtn').textContent = running ? '停止' : '自动播放';
  document.getElementById('carryInfo').textContent = s.carry > 0 ? `进位: ${s.carry}` : '';
  // Build padded arrays for display
  let aArr = a.padStart(s.result.length, '0').split('');
  let bArr = b.padStart(s.result.length, '0').split('');
  let rArr = s.result.length ? s.result.join('').padStart(s.result.length, '0').split('').map(Number) : [];
  // pad all to same length
  let totalLen = Math.max(aArr.length, bArr.length, rArr.length);
  if (totalLen === 0) totalLen = 1;
  aArr = Array(totalLen - aArr.length).fill('0').concat(aArr);
  bArr = Array(totalLen - bArr.length).fill('0').concat(bArr);
  if (rArr.length) rArr = Array(totalLen - rArr.length).fill(0).concat(rArr);
  let html = '';
  // A row
  html += '<div class="bit-row"><span class="bit-row-label">a =</span>';
  for (let i = 0; i < totalLen; i++) {
    let cls = 'bit-cell';
    if (i === totalLen - 1 - s.pos && s.pos >= 0) cls += ' hl';
    html += `<div class="${cls}">${aArr[i]}</div>`;
  }
  html += '</div>';
  // B row
  html += '<div class="bit-row"><span class="bit-row-label">b =</span>';
  for (let i = 0; i < totalLen; i++) {
    let cls = 'bit-cell';
    if (i === totalLen - 1 - s.pos && s.pos >= 0) cls += ' hl';
    html += `<div class="${cls}">${bArr[i]}</div>`;
  }
  html += '</div>';
  // Result row
  html += '<div class="bit-row"><span class="bit-row-label">结果 =</span>';
  for (let i = 0; i < totalLen; i++) {
    let cls = 'bit-cell result';
    html += `<div class="${cls}">${rArr[i] !== undefined ? rArr[i] : ''}</div>`;
  }
  html += '</div>';
  document.getElementById('bitsViz').innerHTML = html;
}
function reset() { cur = 0; stopAuto(); render(); }
function prev() { if (cur > 0) { cur--; render(); } }
function next() { if (cur < steps.length - 1) { cur++; render(); } else { stopAuto(); } }
function goLast() { stopAuto(); cur = steps.length - 1; render(); }
function toggleAuto() { running ? stopAuto() : startAuto(); }
function startAuto() { running = true; render(); autoStep(); }
function stopAuto() { running = false; if (autoTimer) clearTimeout(autoTimer); render(); }
function autoStep() { if (!running) return; if (cur < steps.length - 1) { cur++; render(); autoTimer = setTimeout(autoStep, 600); } else { stopAuto(); } }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  else if (e.key === 'End') { e.preventDefault(); goLast(); }
});
render();
</script>
</body>
</html>
