<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>70. 翻转二叉树 - 交互演示</title>
<link rel="stylesheet" href="demo.css">
</head>
<body>
<script src="demo.js"></script>
<script>
const LEVELS = [4, 2, 7, 1, 3, 6, 9];
const NODE_COUNT = LEVELS.filter(function (v) { return v !== null; }).length;

function buildTree(levels) {
  function rec(i) {
    if (i >= levels.length || levels[i] === null) return null;
    return { val: levels[i], left: rec(2 * i + 1), right: rec(2 * i + 2) };
  }
  return rec(0);
}

function cloneTree(node) {
  if (!node) return null;
  return { val: node.val, left: cloneTree(node.left), right: cloneTree(node.right) };
}

function levelOrder(root) {
  const out = [];
  const queue = [root];
  while (queue.length) {
    const node = queue.shift();
    out.push(node ? node.val : null);
    if (node) { queue.push(node.left); queue.push(node.right); }
  }
  while (out.length && out[out.length - 1] === null) out.pop();
  return out;
}

function buildSteps() {
  const steps = [];
  const root = buildTree(LEVELS);
  const swaps = [];
  const done = [];

  function snap(extra) {
    const step = {
      tree: cloneTree(root), phase: extra.phase, note: extra.note,
      swaps: swaps.slice(), done: done.slice()
    };
    Object.keys(extra).forEach(function (k) { step[k] = extra[k]; });
    steps.push(step);
  }

  snap({
    phase: 'init',
    note: '初始状态：root = [4,2,7,1,3,6,9]，每层节点完整。翻转 = 对每个节点交换它的左右孩子；交换完自己再递归去翻转两棵子树，前序、后序都可以。'
  });

  function invert(node) {
    if (!node) return null;

    const leftVal = node.left ? node.left.val : null;
    const rightVal = node.right ? node.right.val : null;

    if (leftVal === null && rightVal === null) {
      done.push(node.val);
      snap({
        phase: 'leaf', cur: node.val,
        note: '节点 ' + node.val + ' 是叶子，左右孩子都是空，交换前后没有区别；对空节点调用 invert(null) 会立刻在递归出口返回，这条分支结束。'
      });
      return node;
    }

    const tmp = node.left;
    node.left = node.right;
    node.right = tmp;
    swaps.push({ val: node.val, left: leftVal, right: rightVal });

    snap({
      phase: 'swap', cur: node.val,
      from: leftVal, to: rightVal,
      note: '处理节点 ' + node.val + '：把它的左右孩子交换，原来的左孩子 ' + leftVal + ' 换到右边，原来的右孩子 ' + rightVal + ' 换到左边。先把当前层的顺序调好，再递归下去翻转两棵子树。'
    });

    invert(node.left);
    invert(node.right);

    done.push(node.val);
    snap({
      phase: 'return', cur: node.val,
      note: '节点 ' + node.val + ' 的左右子树都已翻转完成，以 ' + node.val + ' 为根的子树翻转结束，向上返回。'
    });
    return node;
  }

  invert(root);

  snap({
    phase: 'done',
    note: '所有节点处理完毕。翻转后的层序遍历是 [' + levelOrder(root).join(', ') +
      ']，正好是原序列每一层的节点左右互换。每个节点只被访问一次：时间 O(n)，递归栈空间 O(h)。'
  });

  return steps;
}

function treeSvg(step) {
  const W = 680;
  const root = step.tree;
  const positions = {};
  let idx = 0;
  (function walk(node, depth) {
    if (!node) return;
    walk(node.left, depth + 1);
    const span = NODE_COUNT + 1;
    positions[node.val] = { x: 50 + (W - 100) * (idx + 1) / span, y: 55 + depth * 92 };
    idx += 1;
    walk(node.right, depth + 1);
  })(root, 0);

  let out = '';
  out += '<defs>';
  out += '<marker id="swpEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L10,5 L0,9 z" style="fill:var(--demo-warn)"/></marker>';
  out += '<marker id="swpStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,1 L0,5 L10,9 z" style="fill:var(--demo-warn)"/></marker>';
  out += '</defs>';

  (function edges(node) {
    if (!node) return;
    if (node.left) {
      const a = positions[node.val], b = positions[node.left.val];
      const active = step.cur === node.val || step.cur === node.left.val;
      out += '<line x1="' + a.x + '" y1="' + (a.y + 26) + '" x2="' + b.x + '" y2="' + (b.y - 26) +
        '" style="stroke:var(--demo-accent);stroke-width:' + (active ? 3.5 : 2.5) + '"/>';
      out += '<text x="' + ((a.x + b.x) / 2 - 10) + '" y="' + ((a.y + b.y) / 2) + '" text-anchor="middle" style="fill:var(--demo-accent);font:700 12px sans-serif">L</text>';
    }
    if (node.right) {
      const a = positions[node.val], b = positions[node.right.val];
      const active = step.cur === node.val || step.cur === node.right.val;
      out += '<line x1="' + a.x + '" y1="' + (a.y + 26) + '" x2="' + b.x + '" y2="' + (b.y - 26) +
        '" style="stroke:var(--demo-pink);stroke-width:' + (active ? 3.5 : 2.5) + '"/>';
      out += '<text x="' + ((a.x + b.x) / 2 + 10) + '" y="' + ((a.y + b.y) / 2) + '" text-anchor="middle" style="fill:var(--demo-pink);font:700 12px sans-serif">R</text>';
    }
    edges(node.left);
    edges(node.right);
  })(root);

  if (step.phase === 'swap' && step.tree) {
    const findNode = function (node, val) {
      if (!node) return null;
      if (node.val === val) return node;
      return findNode(node.left, val) || findNode(node.right, val);
    };
    const cur = findNode(step.tree, step.cur);
    if (cur && cur.left && cur.right) {
      const a = positions[cur.left.val], b = positions[cur.right.val];
      out += '<path d="M' + (a.x + 24) + ' ' + (a.y - 8) + ' Q' + ((a.x + b.x) / 2) + ' ' + (a.y - 56) + ' ' + (b.x - 24) + ' ' + (b.y - 8) +
        '" style="fill:none;stroke:var(--demo-warn);stroke-width:2.5;stroke-dasharray:6 4" marker-end="url(#swpEnd)" marker-start="url(#swpStart)"/>';
      out += '<text x="' + ((a.x + b.x) / 2) + '" y="' + (a.y - 22) + '" text-anchor="middle" style="fill:var(--demo-warn);font:700 12px sans-serif">交换</text>';
    }
  }

  (function nodes(node) {
    if (!node) return;
    const p = positions[node.val];
    const isCur = step.cur === node.val;
    const isDone = step.done.indexOf(node.val) >= 0;
    const fill = isCur ? 'var(--demo-accent)' : isDone ? 'var(--demo-ok)' : 'var(--demo-subtle)';
    const stroke = isCur ? 'var(--demo-accent)' : isDone ? 'var(--demo-ok)' : 'var(--demo-border)';
    const text = (isCur || isDone) ? 'var(--demo-card)' : 'var(--demo-text)';
    out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="24" style="fill:' + fill + ';stroke:' + stroke + ';stroke-width:2.5"/>';
    out += '<text x="' + p.x + '" y="' + (p.y + 7) + '" text-anchor="middle" style="fill:' + text + ';font:700 18px sans-serif">' + node.val + '</text>';
    if (isCur && step.phase === 'swap') {
      out += '<text x="' + p.x + '" y="' + (p.y - 33) + '" text-anchor="middle" style="fill:var(--demo-warn);font:700 12px sans-serif">正在交换</text>';
    }
    nodes(node.left);
    nodes(node.right);
  })(root);

  return '<div style="width:100%"><svg viewBox="0 0 ' + W + ' 320" style="width:100%;height:auto;display:block">' + out + '</svg></div>';
}

Demo.create({
  title: '70. 翻转二叉树 — 每个节点交换左右孩子',
  info: '示例 1：root = [4,2,7,1,3,6,9]，输出 [4,7,2,9,6,3,1]。递归翻转：先交换当前节点的左右孩子，再递归翻转两棵子树。',
  steps: buildSteps(),
  desc: s => s.note,
  stageHeight: 520,
  legend: [
    { color: 'var(--demo-accent)', label: '当前节点 / 左孩子边 L' },
    { color: 'var(--demo-pink)', label: '右孩子边 R' },
    { color: 'var(--demo-ok)', label: '子树已翻转完成' },
    { color: 'var(--demo-warn)', label: '本次交换' }
  ],
  render(step, i, ctx) {
    ctx.stage.innerHTML = '';

    const treePanel = Demo.el('div', 'panel');
    treePanel.style.width = '100%';
    treePanel.appendChild(Demo.el('div', 'panel__title', '当前二叉树（边上的 L / R 表示它是父节点的左孩子还是右孩子）'));
    const wrap = Demo.el('div');
    wrap.style.width = '100%';
    wrap.innerHTML = treeSvg(step);
    treePanel.appendChild(wrap);
    ctx.stage.appendChild(treePanel);

    const orderPanel = Demo.el('div', 'panel');
    orderPanel.style.width = '100%';
    orderPanel.appendChild(Demo.el('div', 'panel__title', '当前层序遍历（输出）'));
    const orderRow = Demo.el('div', 'row');
    levelOrder(step.tree).forEach(function (v) {
      const cell = Demo.el('div', 'cell', Demo.esc(v));
      if (step.phase === 'done') cell.classList.add('is-ok');
      orderRow.appendChild(cell);
    });
    orderPanel.appendChild(orderRow);
    ctx.stage.appendChild(orderPanel);

    const row = Demo.el('div', 'row');
    row.style.width = '100%';
    row.style.alignItems = 'flex-start';

    const swapPanel = Demo.el('div', 'panel');
    swapPanel.appendChild(Demo.el('div', 'panel__title', '已完成的交换（节点：原左 ↔ 原右）'));
    if (!step.swaps.length) {
      swapPanel.appendChild(Demo.el('div', null, '（还没有交换）'));
    } else {
      step.swaps.forEach(function (s, k) {
        const line = Demo.el('div', null, '节点 ' + s.val + '：' + s.left + ' ↔ ' + s.right +
          (k === step.swaps.length - 1 && step.phase === 'swap' ? ' <span class="tag tag--warn">本次</span>' : ''));
        swapPanel.appendChild(line);
      });
    }

    const statePanel = Demo.el('div', 'panel');
    statePanel.appendChild(Demo.el('div', 'panel__title', '状态'));
    statePanel.appendChild(Demo.el('div', null,
      '当前节点：<strong>' + (step.cur != null ? step.cur : '—') + '</strong><br>' +
      '已翻转完成的子树根：' + (step.done.length ? step.done.join(', ') : '（无）')));
    statePanel.appendChild(Demo.el('div', 'row',
      '<span class="tag ' + (step.phase === 'done' ? 'tag--ok' : 'tag') + '">' +
      (step.phase === 'done' ? '翻转完成' : step.phase === 'leaf' ? '叶子，递归出口' : step.phase === 'swap' ? '交换左右孩子' : '子树处理完毕返回') +
      '</span>'));

    row.appendChild(swapPanel);
    row.appendChild(statePanel);
    ctx.stage.appendChild(row);
  }
});
</script>
</body>
</html>
