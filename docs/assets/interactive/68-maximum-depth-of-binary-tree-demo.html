<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉树的最大深度</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:780px;width:100%}
h2{text-align:center;color:var(--header);font-size:18px;margin-bottom:8px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px;font-size:14px}
.step-num{font-weight:bold;font-size:24px;color:#1976D2;min-width:40px;text-align:center}
.step-desc{color:var(--muted);font-size:13px;max-width:500px;text-align:center}
svg{display:block;margin:0 auto;width:100%;height:420px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
button{padding:8px 18px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:13px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
.depth-label{font-size:11px;fill:var(--muted);text-anchor:end}
</style>
</head>
<body>
<div class="container">
<h2>二叉树的最大深度 — 逐层高亮演示</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">树结构：[3,9,20,null,null,15,7] · 最大深度=3</span>
</div>
<svg id="treeSvg" viewBox="0 0 750 400"></svg>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
const nodes = [
{x:375,y:50,val:3},{x:220,y:140,val:9},{x:530,y:140,val:20},
{x:375,y:240,val:15},{x:685,y:240,val:7}
];
const edges = [[0,1],[0,2],[2,3],[2,4]];
const depths = [[0],[1,2],[3,4]];

const steps = [
{desc:'初始状态：树 [3,9,20,null,null,15,7]',hl:[],depth:0},
{desc:'第1层：访问根节点 3，深度=1',hl:[0],depth:1},
{desc:'第2层：访问节点 9 和 20，深度=2',hl:[1,2],depth:2},
{desc:'第3层：访问节点 15 和 7，深度=3（最大）',hl:[3,4],depth:3},
{desc:'完成！二叉树最大深度 = 3',hl:[0,1,2,3,4],depth:3}
];

let cur=0,autoTimer=null,autoRun=false;
const svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;

let html='<defs><radialGradient id="gBlue"><stop offset="0%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#1976D2"/></radialGradient><radialGradient id="gGray"><stop offset="0%" stop-color="#ccc"/><stop offset="100%" stop-color="#999"/></radialGradient></defs>';
html+='<rect width="750" height="400" fill="transparent"/>';
for(const e of edges) {
const a=nodes[e[0]],b=nodes[e[1]];
const visited=s.hl.includes(e[0])&&s.hl.includes(e[1]);
html+=`<line x1="${a.x}" y1="${a.y+24}" x2="${b.x}" y2="${b.y-24}" stroke="${visited?'#1976D2':'#ccc'}" stroke-width="2"/>`;
}
for(let i=0;i<nodes.length;i++){
const n=nodes[i];
const isHL=s.hl.includes(i);
const dpt=Math.max(...depths.map((d,k)=>d.includes(i)?k+1:0));
if(isHL){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gBlue)" stroke="#0D47A1" stroke-width="3"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">${n.val}</text>`;
if(dpt>0)html+=`<text x="${n.x-28}" y="${n.y-16}" text-anchor="end" fill="#1976D2" font-size="11" font-weight="bold">深${dpt}</text>`;
}else{
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="2"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="var(--text)" font-size="14">${n.val}</text>`;
}
}
svg.innerHTML=html;
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},900);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);
if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
