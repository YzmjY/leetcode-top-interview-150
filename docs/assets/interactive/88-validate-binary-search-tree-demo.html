<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>验证二叉搜索树</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:780px;width:100%}
h2{text-align:center;color:var(--header);font-size:17px;margin-bottom:4px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:4px;font-size:14px}
.step-num{font-weight:bold;font-size:22px;color:#1976D2;min-width:36px;text-align:center}
.step-desc{color:var(--muted);font-size:12px;max-width:580px;text-align:center}
svg{display:block;margin:0 auto;width:100%;height:410px}
.verdict{text-align:center;font-size:18px;font-weight:bold;margin-top:4px}
.verdict.invalid{color:#F44336}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
button{padding:7px 15px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:12px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
</style>
</head>
<body>
<div class="container">
<h2>验证二叉搜索树 — 边界检查 [-inf, +inf]</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">无效BST：[5,1,4,null,null,3,6] · 节点3不在(5,inf)范围</span>
</div>
<svg id="treeSvg" viewBox="0 0 720 400"></svg>
<div class="verdict" id="verdict"></div>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
const nodes=[{x:360,y:35,val:5},{x:200,y:140,val:1},{x:520,y:140,val:4},{x:420,y:260,val:3},{x:620,y:260,val:6}];
const edges=[[0,1],[0,2],[2,3],[2,4]];

const steps=[
{desc:'初始状态：无效BST [5,1,4,null,null,3,6] · 节点3不在合法范围',hl:[],range:[],cur:-1,ok:true},
{desc:'检查根5：范围(-inf,+inf)，5在其中，OK',hl:[0],range:[-999,999],cur:0,ok:true},
{desc:'检查节点1(5的左子)：范围(-inf,5)，1在其中，OK',hl:[0,1],range:[-999,5],cur:1,ok:true},
{desc:'检查节点4(5的右子)：范围(5,+inf)，4不在其中！违规！',hl:[0,1,2],range:[5,999],cur:2,ok:false},
{desc:'继续检查节点3(4的左子)：范围(5,4)，空区间！违规层叠',hl:[0,1,2,3],range:[5,4],cur:3,ok:false},
{desc:'结果：无效BST！节点4违反BST定义（4 < 5，但在右子树中）',hl:[0,1,2,3],range:[5,4],cur:-1,ok:false}
];

let cur=0,autoTimer=null,autoRun=false,svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;
document.getElementById('verdict').innerHTML=s.ok&&cur===1?'':'<span class="verdict invalid">'+ (!s.ok&&cur>=3?'无效BST!':(cur===2?'检测到违规！节点4值4不在范围(5, +inf)内！':''))+'</span>';
if(cur===steps.length-1)document.getElementById('verdict').innerHTML='<span class="verdict invalid">结果：无效BST！节点4破坏了BST性质</span>';

let html='<defs><radialGradient id="gBlue"><stop offset="0%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#1976D2"/></radialGradient><radialGradient id="gGr"><stop offset="0%" stop-color="#81C784"/><stop offset="100%" stop-color="#4CAF50"/></radialGradient><radialGradient id="gR"><stop offset="0%" stop-color="#E57373"/><stop offset="100%" stop-color="#F44336"/></radialGradient></defs><rect width="720" height="400" fill="transparent"/>';
for(const[e of edges]){
const a=nodes[e[0]],b=nodes[e[1]];
html+=`<line x1="${a.x}" y1="${a.y+24}" x2="${b.x}" y2="${b.y-24}" stroke="#ccc" stroke-width="2"/>`;
}
// Highlight invalid edge
if(cur>=3){
html+=`<line x1="${nodes[2].x}" y1="${nodes[2].y+24}" x2="${nodes[3].x}" y2="${nodes[3].y-24}" stroke="#F44336" stroke-width="3"/>`;
html+=`<line x1="${nodes[0].x}" y1="${nodes[0].y+24}" x2="${nodes[2].x}" y2="${nodes[2].y-24}" stroke="#F44336" stroke-width="3"/>`;
}
for(let i=0;i<nodes.length;i++){
const n=nodes[i];const isHL=s.hl.includes(i);
const isCur=i===s.cur;
const isBad=(cur>=3&&(i===2||i===3))||(cur===2&&i===2);
if(isBad){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gR)" stroke="#C62828" stroke-width="3"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">${n.val}</text>`;
if(i===2)html+=`<text x="${n.x}" y="${n.y-30}" text-anchor="middle" fill="#F44336" font-size="10" font-weight="bold">违规!</text>`;
}else if(isCur){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gBlue)" stroke="#0D47A1" stroke-width="3"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">${n.val}</text>`;
}else if(isHL&&!isBad){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gGr)" stroke="#2E7D32" stroke-width="2"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14">${n.val}</text>`;
}else{
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="2"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="var(--text)" font-size="14">${n.val}</text>`;
}
}
if(cur>0&&cur<steps.length-1){
const r=s.range;
html+=`<text x="360" y="390" text-anchor="middle" fill="${s.ok?'#4CAF50':'#F44336'}" font-size="11" font-weight="bold">当前范围: [${r[0]===-999?'-inf':r[0]}, ${r[1]===999?'+inf':r[1]}]${!s.ok?' ← 违规!':''}</text>`;
}
svg.innerHTML=html;
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},1000);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
