<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉搜索树迭代器</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:820px;width:100%}
h2{text-align:center;color:var(--header);font-size:17px;margin-bottom:6px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px;font-size:14px}
.step-num{font-weight:bold;font-size:22px;color:#1976D2;min-width:36px;text-align:center}
.step-desc{color:var(--muted);font-size:12px;max-width:550px;text-align:center}
.two-col{display:flex;gap:12px}
.col-left{flex:1}
.stack-box{background:var(--sub-bg);border-radius:8px;padding:10px;min-height:200px}
.stack-box h4{text-align:center;margin-bottom:6px;font-size:13px;color:var(--header)}
.stack-item{background:var(--bg);border:1px solid var(--cell-border);border-radius:6px;padding:6px 12px;margin:3px 0;font-size:13px;font-weight:bold;text-align:center;transition:0.3s}
.stack-item.top{border-color:#FF9800;background:#FFF3E0;color:#E65100}
.stack-item.popped{border-color:#E91E63;background:#FCE4EC;animation:pop 0.3s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:0.5}}
.output-box{background:var(--sub-bg);border-radius:8px;padding:8px 14px;margin-top:6px;font-size:13px;text-align:center}
.output-val{color:#1976D2;font-weight:bold;font-size:18px}
svg{display:block;margin:0 auto;width:100%;height:320px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
button{padding:7px 15px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:12px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
</style>
</head>
<body>
<div class="container">
<h2>二叉搜索树迭代器 — 栈模拟中序遍历</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">BST：[7,3,15,null,null,9,20] · next()和hasNext()</span>
</div>
<svg id="treeSvg" viewBox="0 0 800 280"></svg>
<div class="two-col">
<div class="col-left">
<h4 style="text-align:center;font-size:13px;color:var(--header);margin-bottom:4px">中序遍历栈</h4>
<div class="stack-box" id="stackBox"></div>
</div>
<div class="col-left">
<h4 style="text-align:center;font-size:13px;color:var(--header);margin-bottom:4px">输出序列</h4>
<div class="output-box" id="outputBox"><span style="color:var(--muted)">[]</span></div>
<h4 style="text-align:center;font-size:13px;color:var(--header);margin-top:10px;margin-bottom:4px">操作</h4>
<div class="output-box" id="opBox"><span style="color:var(--muted)">等待开始...</span></div>
</div>
</div>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
const nodes=[{x:400,y:40,val:7},{x:240,y:140,val:3},{x:560,y:140,val:15},{x:460,y:240,val:9},{x:660,y:240,val:20}];
const edges=[[0,1],[0,2],[2,3],[2,4]];

// Simulate: init push all left => [7,3], then pop 3, push 3.right(null) => [7], pop 7 push 15 push 9 => [15,9], pop 9, pop 15 push 20 => [20], pop 20
const steps=[
{desc:'初始化：从根7开始，将所有左子节点入栈',stack:[3,7],output:[],hlIdx:0,op:'init'},
{desc:'hasNext()=true，next()=3，弹出3',stack:[7],output:[3],hlIdx:1,op:'next()->3'},
{desc:'hasNext()=true，next()=7，弹出7后将7.right=15的左链入栈',stack:[9,15],output:[3,7],hlIdx:0,op:'next()->7'},
{desc:'hasNext()=true，next()=9，弹出9',stack:[15],output:[3,7,9],hlIdx:3,op:'next()->9'},
{desc:'hasNext()=true，next()=15，弹出15后将15.right=20入栈',stack:[20],output:[3,7,9,15],hlIdx:2,op:'next()->15'},
{desc:'hasNext()=true，next()=20，弹出20',stack:[],output:[3,7,9,15,20],hlIdx:4,op:'next()->20'},
{desc:'hasNext()=false，迭代完成！中序序列：[3,7,9,15,20]',stack:[],output:[3,7,9,15,20],hlIdx:-1,op:'hasNext()=false'}
];

let cur=0,autoTimer=null,autoRun=false;
const svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;

// SVG
let html='<defs><radialGradient id="gBlue"><stop offset="0%" stop-color="#42A5F5"/><stop offset="100%" stop-color="#1976D2"/></radialGradient><radialGradient id="gGr"><stop offset="0%" stop-color="#81C784"/><stop offset="100%" stop-color="#4CAF50"/></radialGradient><radialGradient id="gOr"><stop offset="0%" stop-color="#FFB74D"/><stop offset="100%" stop-color="#FF9800"/></radialGradient></defs><rect width="800" height="280" fill="transparent"/>';
for(const e of edges) {
const a=nodes[e[0]],b=nodes[e[1]];
html+=`<line x1="${a.x}" y1="${a.y+24}" x2="${b.x}" y2="${b.y-24}" stroke="#ccc" stroke-width="2"/>`;
}
for(let i=0;i<nodes.length;i++){
const n=nodes[i];const isCur=s.hlIdx===i;
const isOut=s.output.includes(n.val);
if(isCur){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gOr)" stroke="#E65100" stroke-width="3"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">${n.val}</text>`;
}else if(isOut){
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="url(#gGr)" stroke="#2E7D32" stroke-width="2"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="#fff" font-size="14">${n.val}</text>`;
}else{
html+=`<circle cx="${n.x}" cy="${n.y}" r="22" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="2"/>`;
html+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" fill="var(--text)" font-size="14">${n.val}</text>`;
}
}
svg.innerHTML=html;

// Stack
let stackHtml='';
for(let i=s.stack.length-1;i>=0;i--){
stackHtml+=`<div class="stack-item${i===s.stack.length-1?' top':''}">${s.stack[i]}</div>`;
}
if(s.stack.length===0)stackHtml='<div style="color:var(--muted);text-align:center;padding:20px">栈为空</div>';
document.getElementById('stackBox').innerHTML=stackHtml;

// Output
document.getElementById('outputBox').innerHTML=s.output.length?'<span class="output-val">['+s.output.join(', ')+']</span>':'<span style="color:var(--muted)">[]</span>';

// Operation
document.getElementById('opBox').innerHTML='<span style="color:#FF5722;font-weight:bold">'+s.op+'</span>';
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},1000);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
