<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --sub-bg: #f5f5f5;
    --window-bg: rgba(25,118,210,0.18);
    --window-border: rgba(25,118,210,0.45);
    --flash-green-bg: rgba(76,175,80,0.35);
    --flash-green-border: rgba(76,175,80,0.7);
    --step-circle-bg: #1976D2;
    --step-circle-color: #fff;
    --highlight-blue: #1976D2;
    --highlight-green: #388E3C;
    --target-color: #E65100;
    --cell-hover: #e8e8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd;
      --btn-bg: #333; --btn-hover: #444;
      --sub-bg: #252540;
      --window-bg: rgba(66,165,245,0.22);
      --window-border: rgba(66,165,245,0.50);
      --flash-green-bg: rgba(76,175,80,0.35);
      --flash-green-border: rgba(76,175,80,0.7);
      --step-circle-bg: #42A5F5;
      --step-circle-color: #1a1a2e;
      --highlight-blue: #42A5F5;
      --highlight-green: #66BB6A;
      --target-color: #FF9800;
      --cell-hover: #333;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 16px 20px;
  }
  .container { max-width: 900px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 4px; }
  .sub-title { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 10px; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px;
    font-size: 14px; flex-wrap: wrap;
  }
  .step-num { font-weight: bold; font-size: 24px; color: var(--highlight-blue); min-width: 36px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; max-width: 600px; text-align: center; }

  .state-row {
    display: flex; justify-content: center; gap: 16px;
    background: var(--sub-bg); border-radius: 8px;
    padding: 10px 16px; margin-bottom: 8px; font-size: 13px;
    flex-wrap: wrap;
  }
  .state-item { text-align: center; min-width: 64px; }
  .state-val { font-size: 20px; font-weight: bold; font-family: monospace; }
  .state-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .sv-l .state-val { color: var(--highlight-blue); }
  .sv-r .state-val { color: #FF9800; }
  .sv-min .state-val { color: var(--highlight-green); }

  /* Grid area */
  .grid-area {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 4px;
    position: relative; padding: 0 10px; flex-wrap: wrap;
  }
  .cell-wrap {
    position: relative; display: flex; flex-direction: column; align-items: center;
  }
  .cell {
    width: 52px; height: 48px; border-radius: 8px;
    background: var(--cell-bg); border: 2px solid var(--cell-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: bold; color: var(--text);
    transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
    position: relative; z-index: 1;
  }
  .cell.in-window {
    background: var(--window-bg); border-color: var(--window-border);
  }
  .cell.flash {
    background: var(--flash-green-bg); border-color: var(--flash-green-border);
    box-shadow: 0 0 14px rgba(76,175,80,0.5);
  }
  .cell.step-highlight {
    border-color: var(--highlight-blue); box-shadow: 0 0 8px rgba(25,118,210,0.35);
  }
  .step-circle {
    position: absolute; top: -10px; right: -10px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--step-circle-bg); color: var(--step-circle-color);
    font-size: 11px; font-weight: bold; display: flex;
    align-items: center; justify-content: center;
    z-index: 5; transition: opacity 0.2s;
    opacity: 0; pointer-events: none;
  }
  .step-circle.visible { opacity: 1; }
  .cell-idx { font-size: 11px; color: var(--muted); margin-top: 3px; text-align: center; }

  /* Pointer row */
  .pointer-row {
    display: flex; justify-content: center; gap: 6px;
    margin-bottom: 4px; min-height: 22px; flex-wrap: wrap;
  }
  .pointer-slot {
    width: 52px; text-align: center; font-size: 10px; font-weight: bold;
    color: var(--muted);
  }

  .result-row {
    background: var(--sub-bg); border-radius: 8px; padding: 10px 14px;
    margin-bottom: 10px; font-size: 13px; text-align: center; color: var(--text);
  }
  .result-row .highlight { color: var(--highlight-green); font-weight: bold; font-size: 15px; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: var(--highlight-blue); color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }

  .legend {
    display: flex; gap: 18px; justify-content: center; margin-top: 10px;
    font-size: 12px; color: var(--muted); flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }

  @media (max-width: 650px) {
    .cell { width: 40px; height: 38px; font-size: 16px; }
    .cell-idx { font-size: 9px; }
    .pointer-slot { width: 40px; font-size: 8px; }
    .grid-area { gap: 3px; }
    .pointer-row { gap: 3px; }
  }
</style>
</head>
<body>
<div class="container">
  <h2>长度最小的子数组 — 滑动窗口交互演示</h2>
  <div class="sub-title">target = 7, nums = [2, 3, 1, 2, 4, 3] → 最小子数组长度 = 2 ([4, 3])</div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">初始状态 · 点击「下一步」开始</span>
  </div>

  <div class="state-row">
    <div class="state-item sv-l">
      <div class="state-val" id="leftVal">0</div>
      <div class="state-label">left 索引</div>
    </div>
    <div class="state-item sv-r">
      <div class="state-val" id="rightVal">0</div>
      <div class="state-label">right 索引</div>
    </div>
    <div class="state-item">
      <div class="state-val" id="sumVal">0</div>
      <div class="state-label">窗口和 sum</div>
    </div>
    <div class="state-item">
      <div class="state-val" id="curLenVal">0</div>
      <div class="state-label">当前窗口长度</div>
    </div>
    <div class="state-item sv-min">
      <div class="state-val" id="minLenVal">∞</div>
      <div class="state-label">最小长度</div>
    </div>
  </div>

  <div class="grid-area" id="gridArea"></div>
  <div class="pointer-row" id="pointerRow"></div>

  <div class="result-row" id="resultBar">
    <span style="color:var(--muted)">结果: </span><span id="resultText" class="highlight">进行中...</span>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">&#x23EE; 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">&#x25C0; 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 &#x25B6;</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">&#x25B6; 自动播放</button>
    <button onclick="goStep(steps.length-1)">&#x23ED; 跳到最后</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:rgba(25,118,210,0.3)"></div>滑动窗口范围</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--highlight-blue)"></div>当前操作元素</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--highlight-green)"></div>找到更小答案</div>
  </div>
</div>

<script>
const nums = [2, 3, 1, 2, 4, 3];
const target = 7;

const steps = [];
(function simulate() {
  steps.push({
    left: 0, right: -1, sum: 0, minLen: Infinity, curLen: 0,
    desc: '初始状态 · left=0, right=0 · 点击「下一步」开始',
    action: 'init', flashMin: false
  });

  let left = 0, sum = 0, minLen = Infinity;

  for (let right = 0; right < nums.length; right++) {
    sum += nums[right];
    steps.push({
      left, right, sum, minLen, curLen: right - left + 1,
      desc: `right 右移到 ${right}: 加入 nums[${right}]=${nums[right]}, sum=${sum} < target=${target} → 继续扩大窗口`,
      action: 'expand', flashMin: false
    });

    while (sum >= target) {
      const curLen = right - left + 1;
      const isNewMin = curLen < minLen;
      if (isNewMin) minLen = curLen;
      steps.push({
        left, right, sum, minLen, curLen,
        desc: `sum=${sum} >= target=${target}, 窗口长度=${curLen}` + (isNewMin ? ` ← 找到更小答案! minLen=${minLen}` : ` (非最优, minLen=${minLen})`),
        action: 'found', flashMin: isNewMin
      });

      if (left < right) {
        sum -= nums[left];
        left++;
        steps.push({
          left, right, sum, minLen, curLen: right - left + 1,
          desc: `left 右移到 ${left}: 移除 nums[${left-1}]=${nums[left-1]}, sum=${sum}`,
          action: 'shrink', flashMin: false
        });
      } else {
        break;
      }
    }
  }

  steps.push({
    left: -1, right: -1, sum: 0, minLen, curLen: 0,
    desc: `算法完成! right 到达数组末尾 → 最小子数组长度 = ${minLen === Infinity ? 0 : minLen}`,
    action: 'done', flashMin: false
  });
})();

let current = 0;
let autoTimer = null;
let autoRunning = false;

const gridArea = document.getElementById('gridArea');
const pointerRow = document.getElementById('pointerRow');
const cells = [];
const pointers = [];

nums.forEach((v, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'cell-wrap';
  wrap.innerHTML = `
    <div class="step-circle" id="sc${i}"></div>
    <div class="cell" id="cell${i}">${v}</div>
    <div class="cell-idx">[${i}]</div>
  `;
  gridArea.appendChild(wrap);
  cells.push({ el: wrap.querySelector('.cell'), circle: wrap.querySelector('.step-circle') });

  const ptr = document.createElement('div');
  ptr.className = 'pointer-slot';
  ptr.id = 'ptr' + i;
  pointerRow.appendChild(ptr);
  pointers.push(ptr);
});

function render() {
  const s = steps[current];
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = s.desc;
  document.getElementById('leftVal').textContent = s.left >= 0 ? s.left : '--';
  document.getElementById('rightVal').textContent = s.right >= 0 ? s.right : '--';
  document.getElementById('sumVal').textContent = s.sum;
  document.getElementById('curLenVal').textContent = s.curLen;
  document.getElementById('minLenVal').textContent = s.minLen === Infinity ? '∞' : s.minLen;

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= steps.length - 1;

  const rText = document.getElementById('resultText');
  if (current >= steps.length - 1) {
    const ans = s.minLen === Infinity ? 0 : s.minLen;
    rText.textContent = '最小子数组长度 = ' + ans + (ans === 2 ? ' (子数组 [4, 3])' : '');
    rText.style.color = 'var(--highlight-green)';
  } else {
    rText.textContent = '进行中...';
    rText.style.color = 'var(--highlight-blue)';
  }

  // Reset all cells
  cells.forEach(c => {
    c.el.classList.remove('in-window', 'flash', 'step-highlight');
    c.circle.classList.remove('visible');
    c.circle.textContent = '';
  });

  // Reset pointers
  pointers.forEach(p => { p.textContent = ''; p.style.color = ''; p.style.fontWeight = ''; });

  // Highlight window range
  if (s.action === 'init') {
    // nothing highlighted yet
  } else if (s.action === 'done') {
    // done
  } else if (s.left >= 0 && s.right >= 0) {
    for (let i = s.left; i <= s.right && i < nums.length; i++) {
      cells[i].el.classList.add('in-window');
    }
  }

  // Flash on finding smaller answer
  if (s.flashMin && s.left >= 0 && s.right >= 0) {
    for (let i = s.left; i <= s.right && i < nums.length; i++) {
      cells[i].el.classList.add('flash');
    }
  }

  // Step highlight on the most recently added/removed element
  if (s.action === 'expand' && s.right >= 0 && s.right < nums.length) {
    cells[s.right].el.classList.add('step-highlight');
    cells[s.right].circle.textContent = current;
    cells[s.right].circle.classList.add('visible');
  } else if (s.action === 'shrink' && s.left > 0 && s.left - 1 < nums.length) {
    const removedIdx = s.left - 1;
    cells[removedIdx].el.classList.add('step-highlight');
    if (cells[removedIdx].circle) {
      cells[removedIdx].circle.textContent = current;
      cells[removedIdx].circle.classList.add('visible');
    }
  } else if (s.action === 'found' && s.left >= 0 && s.right >= 0) {
    cells[s.left].el.classList.add('step-highlight');
    cells[s.left].circle.textContent = current;
    cells[s.left].circle.classList.add('visible');
  }

  // Pointers
  if (s.left >= 0 && s.left < nums.length) {
    pointers[s.left].textContent = 'left';
    pointers[s.left].style.color = 'var(--highlight-blue)';
    pointers[s.left].style.fontWeight = 'bold';
  }
  if (s.right >= 0 && s.right < nums.length && s.right !== s.left) {
    pointers[s.right].textContent = 'right';
    pointers[s.right].style.color = '#FF9800';
    pointers[s.right].style.fontWeight = 'bold';
  }
}

function goStep(n) {
  current = Math.max(0, Math.min(n, steps.length - 1));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer);
    autoRunning = false;
    document.getElementById('playBtn').innerHTML = '&#x25B6; 自动播放';
    document.getElementById('playBtn').classList.remove('play-btn');
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
  } else {
    autoRunning = true;
    document.getElementById('playBtn').innerHTML = '&#x23F8; 暂停';
    document.getElementById('playBtn').classList.add('play-btn');
    document.getElementById('playBtn').style.background = 'var(--highlight-blue)';
    document.getElementById('playBtn').style.color = '#fff';
    if (current >= steps.length - 1) goStep(0);
    autoTimer = setInterval(() => {
      if (current < steps.length - 1) goStep(current + 1);
      else toggleAuto();
    }, 1100);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
