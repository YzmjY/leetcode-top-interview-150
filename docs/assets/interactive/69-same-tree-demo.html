<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相同的树</title>
<style>
:root{--bg:#fff;--text:#333;--muted:#888;--btn-bg:#f0f0f0;--btn-hover:#e0e0e0;--sub-bg:#f5f5f5;--cell-border:#d0d0d0;--header:#222}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--text:#ddd;--muted:#aaa;--btn-bg:#333;--btn-hover:#444;--sub-bg:#252540;--cell-border:#444;--header:#ddd}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{max-width:900px;width:100%}
h2{text-align:center;color:var(--header);font-size:18px;margin-bottom:8px}
.info-bar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px;font-size:14px}
.step-num{font-weight:bold;font-size:24px;color:#1976D2;min-width:40px;text-align:center}
.step-desc{color:var(--muted);font-size:13px;max-width:600px;text-align:center}
svg{display:block;margin:0 auto;width:100%;height:400px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
button{padding:8px 18px;border:1px solid var(--cell-border);border-radius:6px;background:var(--btn-bg);color:var(--text);font-size:13px;cursor:pointer;transition:0.15s}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(0.96)}
button:disabled{opacity:0.35;cursor:default}
button.play-btn{background:#1976D2;color:#fff;border-color:#1565C0}
</style>
</head>
<body>
<div class="container">
<h2>相同的树 — 逐节点对比演示</h2>
<div class="info-bar">
<span class="step-num" id="stepNum">0</span>
<span class="step-desc" id="stepDesc">两棵树 p=[1,2,3] q=[1,2,3] · 值相等标绿，不等标红</span>
</div>
<svg id="treeSvg" viewBox="0 0 880 380"></svg>
<div class="controls">
<button onclick="goStep(0)">重置</button>
<button onclick="goStep(cur-1)" id="prevBtn">上步</button>
<button onclick="goStep(cur+1)" id="nextBtn">下步</button>
<button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
<button onclick="goStep(steps.length-1)">跳到最后</button>
</div>
</div>
<script>
const pnodes=[{x:185,y:50,val:1},{x:105,y:160,val:2},{x:265,y:160,val:3}];
const qnodes=[{x:540,y:50,val:1},{x:460,y:160,val:2},{x:620,y:160,val:3}];
const edges=[[0,1],[0,2]];

const steps=[
{desc:'初始状态：树 p=[1,2,3] 和 树 q=[1,2,3]',check:[],match:null},
{desc:'步骤1：比较根节点 p(1) vs q(1) — 值相等',check:[0],match:true},
{desc:'步骤2：比较左子节点 p(2) vs q(2) — 值相等',check:[1],match:true},
{desc:'步骤3：比较右子节点 p(3) vs q(3) — 值相等',check:[2],match:true},
{desc:'完成！两棵树完全相等',check:[0,1,2],match:true}
];

let cur=0,autoTimer=null,autoRun=false;
const svg=document.getElementById('treeSvg');

function render(){
const s=steps[cur];
document.getElementById('stepNum').textContent=cur;
document.getElementById('stepDesc').textContent=(cur===0?'初始状态 · ':'第'+cur+'步 · ')+s.desc;
document.getElementById('prevBtn').disabled=cur<=0;
document.getElementById('nextBtn').disabled=cur>=steps.length-1;

let html='<defs><radialGradient id="gG"><stop offset="0%" stop-color="#81C784"/><stop offset="100%" stop-color="#4CAF50"/></radialGradient><radialGradient id="gR"><stop offset="0%" stop-color="#E57373"/><stop offset="100%" stop-color="#F44336"/></radialGradient></defs>';
html+='<rect width="880" height="380" fill="transparent"/>';
html+='<text x="220" y="25" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="bold">树 p</text>';
html+='<text x="570" y="25" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="bold">树 q</text>';

const trees=[{nodes:pnodes,ox:0},{nodes:qnodes,ox:355}];
for(const t of trees){
for(const e of edges) {
const a=t.nodes[e[0]],b=t.nodes[e[1]];
html+=`<line x1="${a.x}" y1="${a.y+24}" x2="${b.x}" y2="${b.y-24}" stroke="#ccc" stroke-width="2"/>`;
}
}
for(let i=0;i<pnodes.length;i++){
const p=pnodes[i],q=qnodes[i];
const checked=s.check.includes(i);
const color=s.match?'url(#gG)':'url(#gR)';
const stroke=s.match?'#2E7D32':'#C62828';
for(const n of[{n:p,ox:0},{n:q,ox:355}]){
const xx=n.n.x;
if(checked){
html+=`<circle cx="${xx}" cy="${n.n.y}" r="22" fill="${color}" stroke="${stroke}" stroke-width="3"/>`;
html+=`<text x="${xx}" y="${n.n.y+5}" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">${n.n.val}</text>`;
}else{
html+=`<circle cx="${xx}" cy="${n.n.y}" r="22" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="2"/>`;
html+=`<text x="${xx}" y="${n.n.y+5}" text-anchor="middle" fill="var(--text)" font-size="14">${n.n.val}</text>`;
}
}
}
svg.innerHTML=html;
}

function goStep(n){cur=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='自动播放';}
else{document.getElementById('playBtn').textContent='暂停';autoRun=true;if(cur>=steps.length-1)goStep(0);
autoTimer=setInterval(()=>{if(cur<steps.length-1)goStep(cur+1);else toggleAuto()},900);}
}
document.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')goStep(cur+1);if(e.key==='ArrowLeft')goStep(cur-1);
if(e.key===' '){e.preventDefault();toggleAuto();}
});
render();
</script>
</body>
</html>
