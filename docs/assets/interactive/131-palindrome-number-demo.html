<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>131. 回文数 - 可视化演示</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#1a1a1a;--sub:#666;--border:#e0e0e0;--accent:#2563eb;--accent2:#7c3aed;--danger:#dc2626;--step-bg:#f0f4ff;--hl:#dbeafe;--grid-bg:#fafafa;--radius:8px;--font:system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--card:#16213e;--text:#e0e0e0;--sub:#a0a0b0;--border:#334;--accent:#60a5fa;--accent2:#a78bfa;--danger:#f87171;--step-bg:#1e293b;--hl:#1e3a5f;--grid-bg:#0f172a}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh}
.demo-container{width:100%;max-width:960px;height:480px;background:var(--card);border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--step-bg)}
.header .title{font-size:15px;font-weight:600;color:var(--text)}
.header .step-info{font-size:13px;color:var(--accent);font-weight:500}
.controls{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.controls button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s}
.controls button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls button:disabled{opacity:.4;cursor:not-allowed}
.controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.main-area{flex:1;display:flex;flex-direction:column;padding:12px 16px;gap:10px;overflow-y:auto}
.info-panel{padding:10px 14px;background:var(--step-bg);border-radius:var(--radius);border:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.6}
.info-panel strong{color:var(--accent)}
.vis-area{flex:1;display:flex;flex-direction:column;gap:10px}
.num-row{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 0}
.num-box{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-size:18px;border:2px solid var(--border);background:var(--grid-bg);color:var(--text);transition:all .3s}
.num-box.hl-l{background:#bbf7d0;border-color:#22c55e;color:#166534}
.num-box.hl-r{background:#ddd6fe;border-color:#8b5cf6;color:#5b21b6}
.num-box.match{background:#fef08a;border-color:#eab308;color:#854d0e}
.step-detail{font-size:13px;color:var(--sub);text-align:center;padding:4px 0}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
@media(prefers-color-scheme:dark){.num-box.hl-l{background:#14532d;border-color:#22c55e;color:#86efac}.num-box.hl-r{background:#3b0764;border-color:#8b5cf6;color:#c4b5fd}.num-box.match{background:#713f12;border-color:#eab308;color:#fde047}}
</style>
</head>
<body>
<div class="demo-container">
<div class="header">
<span class="title">131. 回文数 (Palindrome Number)</span>
<span class="step-info" id="stepLabel">步骤 0 / 0</span>
</div>
<div class="controls">
<button onclick="reset()">重置</button>
<button onclick="prevStep()">上步</button>
<button onclick="nextStep()">下步</button>
<button onclick="toggleAuto()" id="autoBtn">自动播放</button>
<button onclick="jumpEnd()">跳到最后</button>
</div>
<div class="main-area">
<div class="info-panel" id="info"><strong>输入:</strong> x = 121 &nbsp;|&nbsp; <strong>思路:</strong> 反转数字的一半，与另一半比较。避免溢出。</div>
<div class="vis-area">
<div class="num-row" id="numRow"></div>
<div class="step-detail" id="stepDetail"></div>
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
</div>
</div>
</div>
<script>
const X=121;
let steps=[],stepIdx=0,autoTimer=null,playing=false;

function buildSteps(){
  steps=[];
  let x=X,reverted=0;
  if(x<0){steps.push({type:'negative',x,reverted:0,note:'负数不是回文数',done:true});}
  else if(x!==0&&x%10===0){steps.push({type:'zero_end',x,reverted:0,note:'末尾为0的非0数不是回文数',done:true});}
  else{
    steps.push({type:'start',x:X,reverted:0,note:'开始反转一半数字',done:false});
    while(x>reverted){
      reverted=reverted*10+x%10;
      x=Math.floor(x/10);
      steps.push({type:'revert',x,reverted,note:`取出个位${(steps.length===1?X:x*10+reverted%10)}... x=${x}, reverted=${reverted}`,done:false});
    }
    let last=steps[steps.length-1];
    let isPal=(last.x===last.reverted)||(last.x===Math.floor(last.reverted/10));
    steps[steps.length-1]={...last,note:last.note+' | '+(isPal?'x==reverted 或 x==reverted/10, 是回文数!':'不匹配, 不是回文数'),done:true,isPal};
  }
}
function render(){
  let s=steps[stepIdx]||steps[steps.length-1]||{};
  let total=steps.length;
  document.getElementById('stepLabel').textContent=`步骤 ${stepIdx+1} / ${total}`;
  document.getElementById('progress').style.width=((stepIdx+1)/total*100)+'%';
  document.getElementById('info').innerHTML=`<strong>x = ${X}</strong> &nbsp;|&nbsp; <strong>操作:</strong> ${s.note||''}`;

  let html='';
  let xStr=String(s.x||X);
  let revStr=String(s.reverted||0);
  let maxLen=Math.max(xStr.length,revStr.length);
  let xPadded=xStr.padStart(maxLen,' ');
  let revPadded=revStr.padStart(maxLen,' ');
  if(s.done){
    for(let i=0;i<maxLen;i++){
      let ch1=xPadded[i],ch2=revPadded[maxLen-1-i]||' ';
      let cls=(ch1===ch2&&ch1!==' ')?'match':'';
      html+=`<div class="num-box ${cls}">${ch1}</div>`;
    }
    html+=`<span style="margin:0 8px;font-weight:700;color:var(--accent)">=</span>`;
    for(let i=0;i<maxLen;i++){
      let idx=maxLen-1-i;
      let ch1=xPadded[idx],ch2=revPadded[i]||' ';
      let cls=(ch1===ch2&&ch1!==' ')?'match':'';
      html+=`<div class="num-box ${cls}">${ch2}</div>`;
    }
  } else {
    for(let i=0;i<maxLen;i++){
      html+=`<div class="num-box hl-l">${xPadded[i]===' '?'':xPadded[i]}</div>`;
    }
    html+=`<span style="margin:0 8px;color:var(--accent);font-size:13px">|</span>`;
    for(let i=0;i<maxLen;i++){
      html+=`<div class="num-box hl-r">${revPadded[i]||''}</div>`;
    }
  }
  document.getElementById('numRow').innerHTML=html;
  document.getElementById('stepDetail').textContent=`x = ${s.x}, reverted = ${s.reverted}`;
}

function reset(){stepIdx=0; stopAuto();buildSteps();render();}
function nextStep(){stopAuto();if(stepIdx<steps.length-1){stepIdx++;}render();}
function prevStep(){stopAuto();if(stepIdx>0){stepIdx--;}render();}
function jumpEnd(){stopAuto();stepIdx=steps.length-1;render();}
function toggleAuto(){
  if(playing){stopAuto();}else{playing=true;document.getElementById('autoBtn').classList.add('active');document.getElementById('autoBtn').textContent='停止';
    autoTimer=setInterval(()=>{if(stepIdx<steps.length-1){stepIdx++;render();}else{stopAuto();}},800);}
}
function stopAuto(){playing=false;clearInterval(autoTimer);document.getElementById('autoBtn').classList.remove('active');document.getElementById('autoBtn').textContent='自动播放';}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')nextStep();
  else if(e.key==='ArrowLeft')prevStep();
  else if(e.key===' '){e.preventDefault();toggleAuto();}
});
buildSteps();render();
</script>
</body>
</html>
