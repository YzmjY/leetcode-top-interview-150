<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>124. 数据流的中位数</title>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #2d3436; --sub: #636e72;
  --border: #dfe6e9; --blue: #0984e3; --green: #00b894; --red: #e17055;
  --blue-bg: #dff6fd; --green-bg: #dff9e6; --hl: #ffeaa7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #eee; --sub: #aaa;
    --border: #2d3436; --blue: #74b9ff; --green: #55efc4; --red: #ff7675;
    --blue-bg: #1a3a5c; --green-bg: #1a3a2c; --hl: #5c4a1f;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { width:860px; height:500px; background:var(--card); border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
.header { display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:17px; color:var(--text); }
.step-badge { font-size:13px; color:var(--sub); background:var(--border); padding:4px 12px; border-radius:8px; font-weight:500; }
.info-panel { background:var(--blue-bg); border-left:3px solid var(--blue); padding:10px 14px; border-radius:8px; font-size:13px; color:var(--text); min-height:44px; display:flex; align-items:center; }
.heaps { display:flex; gap:24px; flex:1; justify-content:center; align-items:flex-start; padding-top:16px; }
.heap-box { display:flex; flex-direction:column; gap:6px; align-items:center; min-width:180px; }
.heap-box .h-title { font-size:13px; font-weight:600; color:var(--sub); }
.heap-items { display:flex; flex-direction:column; gap:4px; align-items:center; }
.h-cell { width:64px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; color:var(--text); transition:all 0.3s; }
.h-cell.maxh { background:var(--blue-bg); border:2px solid var(--blue); }
.h-cell.minh { background:var(--green-bg); border:2px solid var(--green); }
.h-cell.top { box-shadow:0 0 0 2px var(--red); }
.median-result { text-align:center; font-weight:700; font-size:22px; color:var(--green); padding:4px; border-radius:8px; border:2px solid var(--green); background:var(--green-bg); }
.ops-bar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.controls { display:flex; gap:8px; justify-content:center; }
.btn { padding:7px 16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; transition:all 0.15s; }
.btn:hover { background:var(--blue-bg); border-color:var(--blue); }
.btn:active { transform:scale(0.96); }
.key-hint { font-size:11px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>124. 数据流的中位数 (大顶堆 + 小顶堆)</h2>
    <span class="step-badge" id="stepBadge">步骤 0/5</span>
  </div>
  <div class="info-panel" id="info"></div>
  <div class="heaps">
    <div class="heap-box">
      <div class="h-title">大顶堆 (左半, 较小值)</div>
      <div class="heap-items" id="maxHeapViz"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div class="median-result" id="medianResult">中位数 = ?</div>
    </div>
    <div class="heap-box">
      <div class="h-title">小顶堆 (右半, 较大值)</div>
      <div class="heap-items" id="minHeapViz"></div>
    </div>
  </div>
  <div class="controls">
    <button class="btn" onclick="reset()">重置</button>
    <button class="btn" onclick="prev()">上步</button>
    <button class="btn" onclick="next()">下步</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button class="btn" onclick="goLast()">跳到最后</button>
  </div>
  <div class="key-hint">键盘: &#8592; &#8593; 上步 | &#8594; &#8595; 下步 | 空格 自动播放 | R 重置 | End 跳到最后</div>
</div>
<script>
const operations = [
  {type:'add', val:1},
  {type:'add', val:2},
  {type:'median'},
  {type:'add', val:3},
  {type:'median'},
];
let maxHeap = [], minHeap = [];
let steps = [], cur = 0, autoTimer = null, running = false;

function buildSteps() {
  steps = [];
  maxHeap = []; minHeap = [];
  steps.push({maxH:[],minH:[],median:null,desc:'初始化: 左大顶堆=[], 右小顶堆=[]'});
  for (let op of operations) {
    if (op.type === 'add') {
      // add to maxHeap first
      maxHeap.push(op.val); maxHeap.sort((a,b)=>b-a);
      // move maxHeap top to minHeap
      let moved = maxHeap.shift();
      minHeap.push(moved); minHeap.sort((a,b)=>a-b);
      // balance: minHeap >= maxHeap
      if (minHeap.length > maxHeap.length + 1) {
        let back = minHeap.shift();
        maxHeap.push(back); maxHeap.sort((a,b)=>b-a);
      }
      let median;
      if (maxHeap.length === minHeap.length) median = (maxHeap[0]+minHeap[0])/2;
      else median = minHeap[0];
      steps.push({maxH:[...maxHeap],minH:[...minHeap],median,desc:`addNum(${op.val}): 大顶堆=[${[...maxHeap]}], 小顶堆=[${[...minHeap]}], 中位数=${median}`});
    } else {
      let median = maxHeap.length===minHeap.length ? (maxHeap[0]+minHeap[0])/2 : minHeap[0];
      steps.push({maxH:[...maxHeap],minH:[...minHeap],median,desc:`findMedian() = ${median}`});
    }
  }
}
buildSteps();

function render() {
  const s = steps[cur];
  document.getElementById('stepBadge').textContent = `步骤 ${cur}/${steps.length-1}`;
  document.getElementById('info').textContent = s.desc;
  document.getElementById('autoBtn').textContent = running ? '停止' : '自动播放';
  document.getElementById('medianResult').textContent = s.median !== null ? `中位数 = ${s.median}` : '中位数 = ?';
  // Max heap
  let mh = '';
  for (let v of s.maxH) mh += `<div class="h-cell maxh${v===s.maxH[0]?' top':''}">${v}</div>`;
  if (!s.maxH.length) mh = '<div style="color:var(--sub);font-size:12px;">(空)</div>';
  document.getElementById('maxHeapViz').innerHTML = mh;
  // Min heap
  let mh2 = '';
  for (let v of s.minH) mh2 += `<div class="h-cell minh${v===s.minH[0]?' top':''}">${v}</div>`;
  if (!s.minH.length) mh2 = '<div style="color:var(--sub);font-size:12px;">(空)</div>';
  document.getElementById('minHeapViz').innerHTML = mh2;
}
function reset() { cur = 0; stopAuto(); render(); }
function prev() { if (cur > 0) { cur--; render(); } }
function next() { if (cur < steps.length - 1) { cur++; render(); } else { stopAuto(); } }
function goLast() { stopAuto(); cur = steps.length - 1; render(); }
function toggleAuto() { running ? stopAuto() : startAuto(); }
function startAuto() { running = true; render(); autoStep(); }
function stopAuto() { running = false; if (autoTimer) clearTimeout(autoTimer); render(); }
function autoStep() { if (!running) return; if (cur < steps.length - 1) { cur++; render(); autoTimer = setTimeout(autoStep, 700); } else { stopAuto(); } }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  else if (e.key === 'End') { e.preventDefault(); goLast(); }
});
render();
</script>
</body>
</html>
