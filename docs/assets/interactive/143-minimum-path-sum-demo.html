<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>143. 最小路径和 - 可视化演示</title>
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#1a1a1a;--sub:#666;--border:#e0e0e0;--accent:#2563eb;--step-bg:#f0f4ff;--grid-bg:#fafafa;--radius:8px;--font:system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--card:#16213e;--text:#e0e0e0;--sub:#a0a0b0;--border:#334;--accent:#60a5fa;--step-bg:#1e293b;--grid-bg:#0f172a}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh}
.demo-container{width:100%;max-width:960px;height:500px;background:var(--card);border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--step-bg)}
.header .title{font-size:15px;font-weight:600;color:var(--text)}
.header .step-info{font-size:13px;color:var(--accent);font-weight:500}
.controls{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.controls button{padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s}
.controls button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls button:disabled{opacity:.4;cursor:not-allowed}
.controls button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.main-area{flex:1;display:flex;flex-direction:column;padding:12px 16px;gap:10px;overflow-y:auto}
.info-panel{padding:10px 14px;background:var(--step-bg);border-radius:var(--radius);border:1px solid var(--border);font-size:13px;color:var(--text);line-height:1.6}
.info-panel strong{color:var(--accent)}
.vis-area{flex:1;display:flex;flex-direction:column;gap:8px;align-items:center}
.grid{display:inline-grid;gap:4px;padding:6px 0}
.grid-cell{width:56px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);border:2px solid var(--border);background:var(--grid-bg);transition:all .3s}
.grid-cell .orig{font-size:14px;color:var(--text)}
.grid-cell .dp{font-size:11px;font-weight:600;color:var(--accent)}
.grid-cell.hl{background:#bbf7d0;border-color:#22c55e;color:#166534}
.grid-cell.cur{border-color:var(--accent);background:var(--step-bg)}
.grid-cell.path{background:#ddd6fe;border-color:#8b5cf6}
.step-detail{font-size:13px;color:var(--sub);text-align:center}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
@media(prefers-color-scheme:dark){.grid-cell.hl{background:#14532d;border-color:#22c55e;color:#86efac}.grid-cell.path{background:#3b0764;border-color:#8b5cf6}}
</style>
</head>
<body>
<div class="demo-container">
<div class="header">
<span class="title">143. 最小路径和 (Minimum Path Sum)</span>
<span class="step-info" id="stepLabel">步骤 0 / 0</span>
</div>
<div class="controls">
<button onclick="reset()">重置</button>
<button onclick="prevStep()">上步</button>
<button onclick="nextStep()">下步</button>
<button onclick="toggleAuto()" id="autoBtn">自动播放</button>
<button onclick="jumpEnd()">跳到最后</button>
</div>
<div class="main-area">
<div class="info-panel" id="info"><strong>输入:</strong> grid = [[1,3,1],[1,5,1],[4,2,1]] &nbsp;|&nbsp; <strong>思路:</strong> dp[i][j]=grid[i][j]+min(dp[i-1][j],dp[i][j-1])</div>
<div class="vis-area">
<div class="grid" id="grid" style="grid-template-columns:repeat(3,1fr)"></div>
<div class="step-detail" id="stepDetail"></div>
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
</div>
</div>
</div>
<script>
const G=[[1,3,1],[1,5,1],[4,2,1]];
const R=3,C=3;
let steps=[],stepIdx=0,autoTimer=null,playing=false;

function buildSteps(){
  steps=[];
  let dp=Array.from({length:R},()=>Array(C).fill(0));
  dp[0][0]=G[0][0];
  steps.push({dp:dp.map(r=>[...r]),pos:null,note:'dp[0][0] = grid[0][0] = '+G[0][0],done:false});
  for(let j=1;j<C;j++){dp[0][j]=dp[0][j-1]+G[0][j];steps.push({dp:dp.map(r=>[...r]),pos:[0,j],note:`dp[0][${j}] = dp[0][${j-1}] + ${G[0][j]} = ${dp[0][j]}`,done:false});}
  for(let i=1;i<R;i++){dp[i][0]=dp[i-1][0]+G[i][0];steps.push({dp:dp.map(r=>[...r]),pos:[i,0],note:`dp[${i}][0] = dp[${i-1}][0] + ${G[i][0]} = ${dp[i][0]}`,done:false});}
  for(let i=1;i<R;i++){
    for(let j=1;j<C;j++){
      dp[i][j]=Math.min(dp[i-1][j],dp[i][j-1])+G[i][j];
      steps.push({dp:dp.map(r=>[...r]),pos:[i,j],note:`dp[${i}][${j}] = min(${dp[i-1][j]}, ${dp[i][j-1]}) + ${G[i][j]} = ${dp[i][j]}`,done:i===R-1&&j===C-1});
    }
  }
  let last=steps[steps.length-1];
  steps[steps.length-1]={...last,note:last.note+` | 最小路径和 = ${dp[R-1][C-1]}`,done:true};
}
function render(){
  let s=steps[stepIdx]||steps[steps.length-1]||{};
  let total=steps.length;
  document.getElementById('stepLabel').textContent=`步骤 ${stepIdx+1} / ${total}`;
  document.getElementById('progress').style.width=((stepIdx+1)/total*100)+'%';
  document.getElementById('info').innerHTML=`<strong>grid 3x3</strong> &nbsp;|&nbsp; ${s.note||''}`;

  let dp=s.dp||[];
  let gh='';
  for(let i=0;i<R;i++){
    for(let j=0;j<C;j++){
      let cls='';
      if(s.pos&&s.pos[0]===i&&s.pos[1]===j)cls='cur';
      if(s.done)cls='hl';
      gh+=`<div class="grid-cell ${cls}"><span class="orig">${G[i][j]}</span><span class="dp">dp=${dp[i]?.[j]??'?'}</span></div>`;
    }
  }
  document.getElementById('grid').innerHTML=gh;
  document.getElementById('stepDetail').textContent=s.pos?`计算位置 [${s.pos[0]},${s.pos[1]}]`:'';
}
function reset(){stopAuto();stepIdx=0;buildSteps();render();}
function nextStep(){stopAuto();if(stepIdx<steps.length-1){stepIdx++;}render();}
function prevStep(){stopAuto();if(stepIdx>0){stepIdx--;}render();}
function jumpEnd(){stopAuto();stepIdx=steps.length-1;render();}
function toggleAuto(){
  if(playing){stopAuto();}else{playing=true;document.getElementById('autoBtn').classList.add('active');document.getElementById('autoBtn').textContent='停止';
    autoTimer=setInterval(()=>{if(stepIdx<steps.length-1){stepIdx++;render();}else{stopAuto();}},800);}
}
function stopAuto(){playing=false;clearInterval(autoTimer);document.getElementById('autoBtn').classList.remove('active');document.getElementById('autoBtn').textContent='自动播放';}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')nextStep();
  else if(e.key==='ArrowLeft')prevStep();
  else if(e.key===' '){e.preventDefault();toggleAuto();}
});
buildSteps();render();
</script>
</body>
</html>
