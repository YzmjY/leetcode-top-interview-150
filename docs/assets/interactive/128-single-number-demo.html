<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>128. 只出现一次的数字 - XOR</title>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #2d3436; --sub: #636e72;
  --border: #dfe6e9; --blue: #0984e3; --green: #00b894; --red: #e17055; --purple: #6c5ce7;
  --blue-bg: #dff6fd; --hl: #ffeaa7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #eee; --sub: #aaa;
    --border: #2d3436; --blue: #74b9ff; --green: #55efc4; --red: #ff7675; --purple: #a29bfe;
    --blue-bg: #1a3a5c; --hl: #5c4a1f;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { width:860px; height:480px; background:var(--card); border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
.header { display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:17px; color:var(--text); }
.step-badge { font-size:13px; color:var(--sub); background:var(--border); padding:4px 12px; border-radius:8px; font-weight:500; }
.info-panel { background:var(--blue-bg); border-left:3px solid var(--blue); padding:10px 14px; border-radius:8px; font-size:13px; color:var(--text); min-height:44px; display:flex; align-items:center; }
.eq-row { display:flex; gap:6px; justify-content:center; align-items:center; flex-wrap:wrap; flex:1; align-content:center; }
.eq-cell { width:52px; height:52px; border-radius:8px; background:var(--border); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; color:var(--text); transition:all 0.3s; }
.eq-cell.hl { background:var(--hl); box-shadow:0 0 0 2px var(--blue); }
.eq-cell.xor-op { color:var(--purple); font-weight:700; font-size:22px; background:transparent; width:28px; }
.eq-cell.result { background:var(--green); color:#fff; }
.xor-result { text-align:center; font-weight:700; font-size:20px; color:var(--purple); padding:4px; }
.controls { display:flex; gap:8px; justify-content:center; }
.btn { padding:7px 16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; transition:all 0.15s; }
.btn:hover { background:var(--blue-bg); border-color:var(--blue); }
.btn:active { transform:scale(0.96); }
.key-hint { font-size:11px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>128. 只出现一次的数字 (XOR)</h2>
    <span class="step-badge" id="stepBadge">步骤 0/6</span>
  </div>
  <div class="info-panel" id="info"></div>
  <div class="eq-row" id="eqRow"></div>
  <div class="xor-result" id="xorRes">结果: ?</div>
  <div class="controls">
    <button class="btn" onclick="reset()">重置</button>
    <button class="btn" onclick="prev()">上步</button>
    <button class="btn" onclick="next()">下步</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button class="btn" onclick="goLast()">跳到最后</button>
  </div>
  <div class="key-hint">键盘: &#8592; &#8593; 上步 | &#8594; &#8595; 下步 | 空格 自动播放</div>
</div>
<script>
const nums = [4,1,2,1,2];
let steps = [], cur = 0, autoTimer = null, running = false;

function buildSteps() {
  steps = [];
  let xor = 0;
  steps.push({i:-1,xor,partial:[],desc:'初始化: result = 0 (XOR恒等元)'});
  for (let i = 0; i < nums.length; i++) {
    let old = xor;
    xor ^= nums[i];
    steps.push({i,xor,partial:[...nums.slice(0,i+1)],desc:`${old} XOR ${nums[i]} = ${old.toString(2)} ^ ${nums[i].toString(2)} = ${xor}`,old});
  }
  steps.push({i:nums.length-1,xor,partial:[...nums],desc:`最终结果: ${xor} (只出现一次的数字)`,final:true});
}
buildSteps();

function render() {
  const s = steps[cur];
  document.getElementById('stepBadge').textContent = `步骤 ${cur}/${steps.length-1}`;
  document.getElementById('info').textContent = s.desc;
  document.getElementById('autoBtn').textContent = running ? '停止' : '自动播放';
  document.getElementById('xorRes').textContent = `XOR 累积结果: ${s.xor}`;
  const row = document.getElementById('eqRow');
  let html = '';
  for (let i = 0; i < nums.length; i++) {
    if (i > 0) html += `<div class="eq-cell xor-op">^</div>`;
    let cls = 'eq-cell';
    if (i <= s.i && s.i >= 0) cls += ' hl';
    html += `<div class="${cls}">${nums[i]}</div>`;
  }
  html += `<div class="eq-cell xor-op">=</div>`;
  html += `<div class="eq-cell result">${s.xor}</div>`;
  row.innerHTML = html;
}
function reset() { stopAuto(); cur = 0; render(); }
function prev() { if (cur > 0) { cur--; render(); } }
function next() { if (cur < steps.length - 1) { cur++; render(); } else { stopAuto(); } }
function goLast() { stopAuto(); cur = steps.length - 1; render(); }
function toggleAuto() { running ? stopAuto() : startAuto(); }
function startAuto() { running = true; render(); autoStep(); }
function stopAuto() { running = false; if (autoTimer) clearTimeout(autoTimer); render(); }
function autoStep() { if (!running) return; if (cur < steps.length - 1) { cur++; render(); autoTimer = setTimeout(autoStep, 600); } else { stopAuto(); } }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  else if (e.key === 'End') { e.preventDefault(); goLast(); }
});
render();
</script>
</body>
</html>
