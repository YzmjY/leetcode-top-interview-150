<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>括号生成 - 回溯可视化</title>
<style>
:root{--bg:#f8f9fa;--card:#fff;--text:#1a1a2e;--text2:#555;--border:#dee2e6;--accent:#7c3aed;--accent2:#a78bfa;--hover:#ede9fe;--green:#22c55e;--orange:#f59e0b;--blue:#3b82f6;--red:#ef4444;--btn-bg:#e5e7eb;--btn-txt:#374151;--node-bg:#f3e8ff;--node-border:#c4b5fd;--edge:#c4b5fd;--res-bg:#f0fdf4;--res-border:#86efac;--paren-open:#3b82f6;--paren-close:#ef4444}
.dark{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--border:#334155;--accent:#a78bfa;--accent2:#7c3aed;--hover:#1e1b4b;--green:#4ade80;--orange:#fbbf24;--blue:#60a5fa;--red:#f87171;--btn-bg:#334155;--btn-txt:#e2e8f0;--node-bg:#1e1b4b;--node-border:#5b21b6;--edge:#5b21b6;--res-bg:#052e16;--res-border:#166534;--paren-open:#60a5fa;--paren-close:#f87171}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--border:#334155;--accent:#a78bfa;--accent2:#7c3aed;--hover:#1e1b4b;--green:#4ade80;--orange:#fbbf24;--blue:#60a5fa;--red:#f87171;--btn-bg:#334155;--btn-txt:#e2e8f0;--node-bg:#1e1b4b;--node-border:#5b21b6;--edge:#5b21b6;--res-bg:#052e16;--res-border:#166534;--paren-open:#60a5fa;--paren-close:#f87171}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:20px}
.container{width:100%;max-width:780px;background:var(--card);border-radius:8px;border:1px solid var(--border);padding:20px 24px}
h2{font-size:1.1rem;font-weight:600;margin-bottom:6px;color:var(--accent)}
.info-panel{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:.85rem;color:var(--text2);flex-wrap:wrap}
.info-panel .step{background:var(--accent);color:#fff;padding:3px 10px;border-radius:8px;font-weight:600;font-size:.8rem}
.info-panel .desc{flex:1;min-width:200px}
.counters{display:flex;gap:20px;margin-bottom:8px;font-size:.8rem;color:var(--text2);align-items:center;flex-wrap:wrap}
.counters span{font-weight:700}
.counters .open-count{color:var(--paren-open)}
.counters .close-count{color:var(--paren-close)}
.counters .cur-str{color:var(--accent);font-family:monospace;font-size:.95rem}
.vis-area{height:440px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg)}
.vis-area canvas{display:block;width:100%;height:100%}
.results-bar{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;min-height:28px}
.results-bar .tag{background:var(--res-bg);border:1px solid var(--res-border);color:var(--green);padding:2px 8px;border-radius:6px;font-size:.75rem;font-family:monospace}
.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.controls button{background:var(--btn-bg);color:var(--btn-txt);border:1px solid var(--border);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;font-family:inherit;transition:all .15s}
.controls button:hover{background:var(--hover);border-color:var(--accent)}
.controls button:active{transform:scale(.96)}
.controls button.playing{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:.72rem;color:var(--text2);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:10px;height:10px;border-radius:50%}
</style>
</head>
<body>
<div class="container">
<h2>106. 括号生成 (Generate Parentheses)</h2>
<div class="info-panel">
  <span class="step" id="stepLabel">步骤 1/18</span>
  <span class="desc" id="stepDesc">开始回溯: n=3</span>
</div>
<div class="counters">
  <span>open: <span class="open-count" id="openC">0</span></span>
  <span>close: <span class="close-count" id="closeC">0</span></span>
  <span>当前字符串: <span class="cur-str" id="curStr">""</span></span>
</div>
<div class="vis-area"><canvas id="canvas"></canvas></div>
<div class="results-bar" id="resultsBar"></div>
<div class="controls">
  <button onclick="reset()">重置</button>
  <button onclick="prevStep()">上步</button>
  <button onclick="nextStep()">下步</button>
  <button id="playBtn" onclick="togglePlay()">自动播放</button>
  <button onclick="jumpEnd()">最后</button>
</div>
<div class="legend">
  <span><span class="dot" style="background:var(--accent)"></span>当前节点</span>
  <span><span class="dot" style="background:var(--paren-open)"></span>添加 '('</span>
  <span><span class="dot" style="background:var(--paren-close)"></span>添加 ')'</span>
  <span><span class="dot" style="background:var(--green)"></span>完整括号串</span>
</div>
</div>
<script>
const N=3;
const steps=[];
const results=[];
function genSteps(s,open,close){
  steps.push({type:'enter',s,open,close});
  if(s.length===2*N){
    results.push(s);
    steps.push({type:'leaf',s,open,close});
    return;
  }
  if(open<N){
    steps.push({type:'add_open',s,open,close,added:'('});
    genSteps(s+'(',open+1,close);
  }
  if(close<open){
    steps.push({type:'add_close',s,open,close,added:')'});
    genSteps(s+')',open,close+1);
  }
  if(s.length>0)steps.push({type:'backtrack',s:s.slice(0,-1),open:s[s.length-1]==='('?open-1:open,close:s[s.length-1]===')'?close-1:close,removed:s[s.length-1]});
}
genSteps('',0,0);

let curStep=0,playId=null;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');

function resize(){const r=canvas.getBoundingClientRect();canvas.width=r.width*devicePixelRatio;canvas.height=r.height*devicePixelRatio;ctx.setTransform(1,0,0,1,0,0);ctx.scale(devicePixelRatio,devicePixelRatio);draw();}
window.addEventListener('resize',resize);

function collectNodes(){
  const nodes={};
  for(let i=0;i<=curStep;i++){
    const s=steps[i];
    if(s.type==='enter'||s.type==='leaf'){
      const l=s.s.length;
      const key=s.s||'root';
      if(!nodes[l])nodes[l]=[];
      if(!nodes[l].find(n=>n.key===key))nodes[l].push({key,s:s.s,x:0,y:0,isLeaf:s.type==='leaf'});
    }
  }
  return nodes;
}

function draw(){
  const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  const step=steps[curStep];
  const nodes=collectNodes();
  const maxL=Math.max(...Object.keys(nodes).map(Number),0);
  const rootX=w/2,rootY=35,levelGap=65,nodeGap=26;
  for(let l=0;l<=maxL;l++){
    const nds=nodes[l]||[];
    const tw=nds.length*nodeGap*2;
    const sx=rootX-tw/2+nodeGap;
    nds.forEach((n,i)=>{n.x=sx+i*nodeGap*2;n.y=rootY+l*levelGap});
  }
  for(let l=1;l<=maxL;l++){
    const parents=nodes[l-1]||[];
    const children=nodes[l]||[];
    children.forEach(child=>{
      const prefix=child.s.slice(0,l-1);
      for(const p of parents){
        if(p.s===prefix||(prefix===''&&p.s==='root')){
          const lastChar=child.s[l-1];
          ctx.strokeStyle=lastChar==='('?getComputedStyle(document.documentElement).getPropertyValue('--paren-open').trim():getComputedStyle(document.documentElement).getPropertyValue('--paren-close').trim();
          ctx.lineWidth=2;
          ctx.beginPath();ctx.moveTo(p.x,p.y+18);ctx.lineTo(child.x,child.y-18);ctx.stroke();
          break;
        }
      }
    });
  }
  for(let l=0;l<=maxL;l++){
    (nodes[l]||[]).forEach(n=>{
      const r=16;
      const isCur=(step.type==='enter'||step.type==='add_open'||step.type==='add_close')&&n.s===step.s&&!n.isLeaf;
      const isLeafCur=step.type==='leaf'&&n.s===step.s;
      if(isLeafCur||n.isLeaf){
        ctx.fillStyle=isLeafCur?getComputedStyle(document.documentElement).getPropertyValue('--accent').trim():getComputedStyle(document.documentElement).getPropertyValue('--green').trim();
        ctx.fillRect(n.x-45,n.y-13,90,26);
        ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(n.s,n.x,n.y);
      }else if(isCur){
        ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
        ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim();ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(n.x,n.y,r+3,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(n.s||'""',n.x,n.y);
      }else{
        ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--node-bg').trim();
        ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--node-border').trim();
        ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fill();ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
        ctx.font='9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(n.s||'""',n.x,n.y);
      }
    });
  }
  if(step.type==='add_open'){
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--paren-open').trim();
    ctx.font='bold 13px system-ui';ctx.textAlign='center';
    ctx.fillText('添加 "(" (open='+(step.open+1)+'/3)',w/2,h-15);
  }
  if(step.type==='add_close'){
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--paren-close').trim();
    ctx.font='bold 13px system-ui';ctx.textAlign='center';
    ctx.fillText('添加 ")" (close='+(step.close+1)+'/3)',w/2,h-15);
  }
}

function updateUI(){
  const step=steps[curStep];
  document.getElementById('stepLabel').textContent='步骤 '+(curStep+1)+'/'+steps.length;
  let desc='';
  if(step.type==='enter')desc='进入: "'+step.s+'" (open='+step.open+', close='+step.close+')';
  else if(step.type==='add_open')desc='选择添加 "(" : 确保open<'+N;
  else if(step.type==='add_close')desc='选择添加 ")" : 确保close<open';
  else if(step.type==='leaf')desc='找到完整括号串: "'+step.s+'"';
  else if(step.type==='backtrack')desc='回溯: 撤销 "'+(step.removed||'')+'"';
  else desc='开始回溯';
  document.getElementById('stepDesc').textContent=desc;
  document.getElementById('openC').textContent=step.open||0;
  document.getElementById('closeC').textContent=step.close||0;
  document.getElementById('curStr').textContent='"'+((step.s===undefined?'':step.s))+'"';
  const bar=document.getElementById('resultsBar');
  const found=[];
  for(let i=0;i<=curStep;i++){if(steps[i].type==='leaf')found.push(steps[i].s);}
  bar.innerHTML=found.map(s=>'<span class="tag">'+s+'</span>').join('');
  resize();
}
function reset(){curStep=0;stopPlay();updateUI();}
function nextStep(){if(curStep<steps.length-1){curStep++;updateUI();}else stopPlay();}
function prevStep(){if(curStep>0){curStep--;updateUI();}}
function jumpEnd(){curStep=steps.length-1;stopPlay();updateUI();}
function stopPlay(){if(playId){clearInterval(playId);playId=null;document.getElementById('playBtn').classList.remove('playing');document.getElementById('playBtn').textContent='自动播放';}}
function togglePlay(){if(playId){stopPlay();return;}if(curStep>=steps.length-1)curStep=0;document.getElementById('playBtn').classList.add('playing');document.getElementById('playBtn').textContent='暂停';playId=setInterval(()=>{if(curStep<steps.length-1){curStep++;updateUI();}else stopPlay();},600);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();prevStep();}else if(e.key==='ArrowRight'){e.preventDefault();nextStep();}else if(e.key===' '){e.preventDefault();togglePlay();}});
updateUI();
</script>
</body>
</html>
