<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>67. LRU缓存 - 可视化演示</title>
<style>
:root {
  --bg: #f8f9fa; --card-bg: #fff; --text: #212529; --text-secondary: #6c757d;
  --border: #dee2e6; --btn-bg: #e9ecef; --btn-hover: #dee2e6; --btn-active: #0d6efd;
  --btn-active-text: #fff; --node-bg: #e9ecef;
  --blue: #228be6; --green: #40c057; --red: #fa5252; --orange: #fd7e14;
  --step-bg: #e7f5ff;
}
@media (prefers-color-scheme: dark) {
:root {
  --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
  --border: #3a3a5c; --btn-bg: #2a2a4a; --btn-hover: #3a3a5c; --btn-active: #339af0;
  --btn-active-text: #fff; --node-bg: #2a2a4a; --step-bg: #1a2a3a;
}
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center; padding: 20px;
}
.container {
  width: 100%; max-width: 950px; height: 500px;
  background: var(--card-bg); border-radius: 8px;
  border: 1px solid var(--border); padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.step-panel {
  background: var(--step-bg); border-radius: 8px; padding: 8px 16px;
  display: flex; justify-content: space-between; align-items: center; font-size: 14px;
}
.step-num { font-weight: 700; color: var(--btn-active); }
.step-desc { flex: 1; margin-left: 16px; }
.main-area { display: flex; gap: 12px; flex: 1; min-height: 0; }
.ll-area { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.ll-area h4 { font-size: 12px; color: var(--text-secondary); margin: 0; }
.ll-viz { flex: 1; display: flex; justify-content: center; align-items: center; }
.hash-panel {
  flex: 0 0 200px; background: var(--step-bg); border-radius: 8px;
  border: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto;
}
.hash-panel h4 { font-size: 12px; color: var(--text-secondary); margin: 0 0 4px 0; }
.hash-row {
  display: flex; justify-content: space-between; padding: 4px 6px;
  background: var(--node-bg); border-radius: 6px; font-size: 12px;
  font-family: "Consolas", monospace; border: 1px solid var(--border);
}
.hash-row .hk { color: var(--btn-active); font-weight: 700; }
.hash-row .hv { color: var(--green); }
.result-badge {
  padding: 2px 8px; border-radius: 8px; font-weight: 700; font-size: 13px;
  background: rgba(64,192,87,0.12); color: var(--green);
}
.controls {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.controls button {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--btn-bg); color: var(--text); cursor: pointer;
  font-size: 13px; font-family: inherit; transition: all 0.15s;
}
.controls button:hover { background: var(--btn-hover); }
.controls button.active { background: var(--btn-active); color: var(--btn-active-text); border-color: var(--btn-active); }
</style>
</head>
<body>
<div class="container">
  <div class="step-panel">
    <span class="step-num" id="stepNum">步骤 0 / 0</span>
    <span class="step-desc" id="stepDesc">初始状态</span>
    <span class="result-badge" id="resultBadge"></span>
  </div>
  <div class="main-area">
    <div class="ll-area">
      <h4>双向链表 (head——MRU ... LRU——tail, capacity=2)</h4>
      <div class="ll-viz"><svg id="svg" viewBox="0 0 700 180"></svg></div>
    </div>
    <div class="hash-panel">
      <h4>HashMap</h4>
      <div id="hashItems"></div>
    </div>
  </div>
  <div class="controls">
    <button onclick="reset()">重置</button>
    <button onclick="prevStep()">上步</button>
    <button onclick="nextStep()">下步</button>
    <button id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button onclick="goEnd()">跳到最后</button>
  </div>
</div>
<script>
const capacity = 2;
const ops = [
  { type: 'put', key: 1, val: 1, desc: 'put(1,1)' },
  { type: 'put', key: 2, val: 2, desc: 'put(2,2)' },
  { type: 'get', key: 1, desc: 'get(1) -> 1' },
  { type: 'put', key: 3, val: 3, desc: 'put(3,3) — 淘汰2' },
  { type: 'get', key: 2, desc: 'get(2) -> -1 (不存在)' },
  { type: 'put', key: 4, val: 4, desc: 'put(4,4) — 淘汰1' },
];
const steps = [];
let stepIdx = -1;
let cacheList = []; // [{key, val}], head at index 0 (MRU), tail at end (LRU)
let cacheMap = {}; // key -> val

function buildSteps() {
  steps.length = 0;
  cacheList = []; cacheMap = {};

  steps.push({ list: [...cacheList], map: {...cacheMap}, desc: '初始状态：capacity=2，缓存为空', result: '' });

  for (const op of ops) {
    if (op.type === 'put') {
      // Check if key exists
      const existingIdx = cacheList.findIndex(item => item.key === op.key);
      if (existingIdx >= 0) {
        // Update: move to head
        cacheList.splice(existingIdx, 1);
        cacheList.unshift({ key: op.key, val: op.val });
        cacheMap[op.key] = op.val;
        steps.push({ list: [...cacheList], map: {...cacheMap}, desc: `${op.desc}: key=${op.key} 已存在，更新值并移到MRU头部`, result: '' });
      } else {
        // Check capacity
        if (cacheList.length >= capacity) {
          const evicted = cacheList.pop();
          delete cacheMap[evicted.key];
          cacheList.unshift({ key: op.key, val: op.val });
          cacheMap[op.key] = op.val;
          steps.push({ list: [...cacheList], map: {...cacheMap}, desc: `${op.desc}: 容量满，淘汰key=${evicted.key}，插入key=${op.key}`, result: '', evicted: evicted.key });
        } else {
          cacheList.unshift({ key: op.key, val: op.val });
          cacheMap[op.key] = op.val;
          steps.push({ list: [...cacheList], map: {...cacheMap}, desc: `${op.desc}: 插入key=${op.key}到MRU头部`, result: '' });
        }
      }
    } else if (op.type === 'get') {
      const existingIdx = cacheList.findIndex(item => item.key === op.key);
      if (existingIdx >= 0) {
        const item = cacheList.splice(existingIdx, 1)[0];
        cacheList.unshift(item);
        steps.push({ list: [...cacheList], map: {...cacheMap}, desc: `${op.desc}: 命中！移到MRU头部`, result: item.val });
      } else {
        steps.push({ list: [...cacheList], map: {...cacheMap}, desc: `${op.desc}: 未命中`, result: -1 });
      }
    }
  }
}

const nodePos = [
  { x: 60, y: 90 }, { x: 200, y: 90 }, { x: 340, y: 90 },
  { x: 480, y: 90 }, { x: 620, y: 90 },
];
const R = 20;

function renderAll() {
  const st = steps[Math.min(stepIdx, steps.length - 1)];
  document.getElementById('stepNum').textContent = `步骤 ${stepIdx + 1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent = st.desc;
  const badge = document.getElementById('resultBadge');
  if (st.result !== '') {
    badge.textContent = '返回: ' + st.result;
    badge.style.display = '';
  } else { badge.style.display = 'none'; }

  // Hash panel
  const hp = document.getElementById('hashItems');
  hp.innerHTML = '';
  const entries = Object.entries(st.map);
  if (entries.length === 0) {
    hp.innerHTML = '<div style="color:var(--text-secondary);font-size:12px;text-align:center;">(空)</div>';
  } else {
    entries.forEach(([k, v]) => {
      hp.innerHTML += `<div class="hash-row"><span class="hk">${k}</span><span class="hv">-> ${v}</span></div>`;
    });
  }

  // SVG
  const svg = document.getElementById('svg');
  let html = `<defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--blue)"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--text-secondary)"/>
    </marker>
  </defs>`;

  // Dummy head and tail
  html += `<rect x="15" y="${90-12}" width="20" height="24" rx="4" fill="var(--btn-bg)" stroke="var(--border)"/><text x="25" y="96" text-anchor="middle" font-size="11" fill="var(--text-secondary)">H</text>`;
  html += `<rect x="715" y="${90-12}" width="20" height="24" rx="4" fill="var(--btn-bg)" stroke="var(--border)"/><text x="725" y="96" text-anchor="middle" font-size="11" fill="var(--text-secondary)">T</text>`;

  // Head/Tail labels
  html += `<text x="25" y="60" text-anchor="middle" font-size="10" fill="var(--text-secondary)">MRU</text>`;
  html += `<text x="725" y="60" text-anchor="middle" font-size="10" fill="var(--text-secondary)">LRU</text>`;

  const list = st.list;
  // Arrows between list nodes
  for (let i = 0; i < list.length - 1; i++) {
    html += `<line x1="${nodePos[i].x + R + 2}" y1="${nodePos[i].y - 7}" x2="${nodePos[i+1].x - R - 2}" y2="${nodePos[i+1].y - 7}" stroke="var(--blue)" stroke-width="1.5" marker-end="url(#arrowF)"/>`;
    html += `<line x1="${nodePos[i+1].x - R - 2}" y1="${nodePos[i+1].y + 7}" x2="${nodePos[i].x + R + 2}" y2="${nodePos[i].y + 7}" stroke="var(--text-secondary)" stroke-width="1.5" marker-end="url(#arrowB)"/>`;
  }

  // Empty message
  if (list.length === 0) {
    html += `<text x="370" y="100" text-anchor="middle" font-size="14" fill="var(--text-secondary)">(空)</text>`;
  }

  // Nodes
  for (let i = 0; i < list.length; i++) {
    const item = list[i];
    const isNew = stepIdx > 0 && i === 0 &&
      (steps[stepIdx - 1].list.length === 0 || steps[stepIdx - 1].list[0]?.key !== item.key);
    const isMRU = i === 0;
    const isLRU = i === list.length - 1;

    const stroke = isNew ? 'var(--orange)' : (isMRU ? 'var(--green)' : 'var(--blue)');
    const fill = isNew ? 'rgba(253,126,20,0.15)' : (isMRU ? 'rgba(64,192,87,0.08)' : 'var(--node-bg)');

    html += `<circle cx="${nodePos[i].x}" cy="${nodePos[i].y}" r="${R}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
      <text x="${nodePos[i].x}" y="${nodePos[i].y + 5}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)" font-family="Consolas,monospace">${item.key}:${item.val}</text>`;

    if (isMRU) html += `<text x="${nodePos[i].x}" y="${nodePos[i].y - 34}" text-anchor="middle" font-size="10" fill="var(--green)" font-weight="700">MRU</text>`;
    if (isLRU && list.length > 1) html += `<text x="${nodePos[i].x}" y="${nodePos[i].y - 34}" text-anchor="middle" font-size="10" fill="var(--red)" font-weight="700">LRU</text>`;
  }

  // Evicted indicator
  if (st.evicted !== undefined) {
    html += `<text x="370" y="150" text-anchor="middle" font-size="13" fill="var(--red)" font-weight="700">淘汰: key=${st.evicted}</text>`;
  }

  svg.innerHTML = html;
  document.getElementById('autoBtn').classList.toggle('active', autoRunning);
}

function reset() { stepIdx = 0; stopAuto(); renderAll(); }
function prevStep() { stopAuto(); if (stepIdx > 0) stepIdx--; renderAll(); }
function nextStep() { stopAuto(); if (stepIdx < steps.length - 1) stepIdx++; renderAll(); }
function goEnd() { stopAuto(); stepIdx = steps.length - 1; renderAll(); }

let autoRunning = false, autoTimer = null;
function toggleAuto() { autoRunning ? stopAuto() : startAuto(); }
function startAuto() { autoRunning = true; renderAll(); autoStep(); }
function stopAuto() { autoRunning = false; if (autoTimer) clearTimeout(autoTimer); renderAll(); }
function autoStep() {
  if (!autoRunning) return;
  if (stepIdx < steps.length - 1) { stepIdx++; renderAll(); autoTimer = setTimeout(autoStep, 1000); }
  else stopAuto();
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});
buildSteps();
reset();
</script>
</body>
</html>
