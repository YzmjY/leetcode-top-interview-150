<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg:#fff; --text:#333; --muted:#888; --cell-bg:#fafafa; --cell-border:#d0d0d0; --header:#222; --sub-bg:#f5f5f5; --btn-bg:#f0f0f0; --btn-hover:#e0e0e0; }
  @media (prefers-color-scheme:dark) { :root { --bg:#1a1a2e; --text:#ddd; --muted:#aaa; --cell-bg:#222; --cell-border:#444; --header:#ddd; --btn-bg:#333; --btn-hover:#444; --sub-bg:#252540; } }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:12px 20px; }
  .container { max-width:850px; width:100%; }
  h2 { text-align:center; color:var(--header); font-size:17px; margin-bottom:2px; }
  .sub-title { text-align:center; color:var(--muted); font-size:12px; margin-bottom:4px; }
  .info-bar { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:4px; font-size:14px; flex-wrap:wrap; }
  .step-num { font-weight:bold; font-size:22px; color:#1976D2; min-width:32px; text-align:center; }
  .step-desc { color:var(--muted); font-size:13px; max-width:600px; text-align:center; }
  svg { display:block; margin:0 auto; width:100%; }
  .legend { display:flex; gap:14px; justify-content:center; margin-top:4px; font-size:11px; color:var(--muted); flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:5px; }
  .legend-dot { width:14px; height:14px; border-radius:3px; }
  .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  button { padding:7px 15px; border:1px solid var(--cell-border); border-radius:6px; background:var(--btn-bg); color:var(--text); font-size:13px; cursor:pointer; transition:0.15s; }
  button:hover { background:var(--btn-hover); }
  button:active { transform:scale(0.96); }
  button:disabled { opacity:0.35; cursor:default; }
  button.play-btn { background:#1976D2; color:#fff; border-color:#1565C0; }
</style>
</head>
<body>
<div class="container">
  <h2>最小栈 — 主栈 + 辅助栈可视化</h2>
  <div class="sub-title">push(-2)→push(0)→push(-3)→getMin(-3)→pop→top(0)→getMin(-2)</div>
  <div class="info-bar"><span class="step-num" id="stepNum">0</span><span class="step-desc" id="stepDesc">初始状态 · 点击下一步开始</span></div>
  <svg id="svg" viewBox="0 0 840 340"></svg>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#42A5F5;"></div>主栈</div>
    <div class="legend-item"><div class="legend-dot" style="background:#66BB6A;"></div>最小栈</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF7043;"></div>新入栈/操作中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF5252;"></div>出栈</div>
  </div>
  <div class="controls">
    <button onclick="goStep(0)">&#x23EE; 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">&#x25C0; 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 &#x25B6;</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">&#x25B6; 自动播放</button>
    <button onclick="goStep(steps.length-1)">&#x23ED; 跳到最后</button>
  </div>
</div>
<script>
const ops=[{type:'push',val:-2,desc:'push(-2)'},{type:'push',val:0,desc:'push(0)'},{type:'push',val:-3,desc:'push(-3)'},{type:'getMin',desc:'getMin() → -3'},{type:'pop',desc:'pop()'},{type:'top',desc:'top() → 0'},{type:'getMin',desc:'getMin() → -2'}];

const steps=[];
(function sim(){
  let ms=[], mi=[];
  steps.push({desc:'初始状态', main:[...ms], min:[...mi], op:'init', opV:null, phase:'init'});
  for(const op of ops){
    if(op.type==='push'){
      ms.push(op.val);
      const nm=mi.length===0?op.val:Math.min(op.val,mi[mi.length-1]);
      mi.push(nm);
      steps.push({desc:op.desc, main:[...ms], min:[...mi], op:'push', opV:op.val, phase:'push'});
    }else if(op.type==='pop'){
      const popped=ms[ms.length-1];
      ms.pop(); mi.pop();
      steps.push({desc:op.desc, main:[...ms], min:[...mi], op:'pop', opV:popped, phase:'pop'});
    }else if(op.type==='getMin'){
      steps.push({desc:op.desc, main:[...ms], min:[...mi], op:'getMin', opV:mi[mi.length-1], phase:'getMin'});
    }else if(op.type==='top'){
      steps.push({desc:op.desc, main:[...ms], min:[...mi], op:'top', opV:ms[ms.length-1], phase:'top'});
    }
  }
})();

// SVG layout: two stack columns
const mainX=280, minX=560, stackBase=310, cellH=42, cellW=160, cellRx=6;

function drawStack(arr, x, color, op, opV, phase){
  let html='';
  for(let i=0;i<arr.length;i++){
    const y=stackBase-(i+1)*cellH;
    const isTop=(i===arr.length-1);
    let fill=color, stroke=color, fw='1.5', fc='#fff';
    if(isTop && phase==='push'){
      fill='#FF7043'; stroke='#E65100'; fw='2.5';
    }else if(isTop && phase==='pop'){
      fill='#FF5252'; stroke='#B71C1C'; fw='2.5';
    }else if(phase==='getMin' && color==='#66BB6A' && isTop){
      fill='#FF7043'; stroke='#E65100'; fw='2.5';
    }
    html+='<rect x="'+(x-cellW/2)+'" y="'+y+'" width="'+cellW+'" height="'+cellH+'" rx="'+cellRx+'" fill="'+fill+'" opacity="0.9" stroke="'+stroke+'" stroke-width="'+fw+'"/>';
    html+='<text x="'+x+'" y="'+(y+cellH/2+6)+'" text-anchor="middle" fill="'+fc+'" font-size="16" font-weight="bold">'+arr[i]+'</text>';
    // Index label
    html+='<text x="'+(x-cellW/2-8)+'" y="'+(y+cellH/2+6)+'" text-anchor="end" fill="var(--muted)" font-size="10">'+(i+1)+'</text>';
  }
  if(arr.length===0){
    const y=stackBase-cellH;
    html+='<rect x="'+(x-cellW/2)+'" y="'+y+'" width="'+cellW+'" height="'+cellH+'" rx="'+cellRx+'" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="1.5" stroke-dasharray="4,3"/>';
    html+='<text x="'+x+'" y="'+(y+cellH/2+6)+'" text-anchor="middle" fill="var(--muted)" font-size="13">(空)</text>';
  }
  // Stack frame lines
  html+='<line x1="'+(x-cellW/2-5)+'" y1="'+(stackBase-arr.length*cellH)+'" x2="'+(x-cellW/2-5)+'" y2="'+stackBase+'" stroke="#888" stroke-width="1.5"/>';
  html+='<line x1="'+(x-cellW/2-10)+'" y1="'+stackBase+'" x2="'+(x+cellW/2+10)+'" y2="'+stackBase+'" stroke="#888" stroke-width="1.5"/>';
  return html;
}

let current=0, autoTimer=null, autoRun=false;
const svg=document.getElementById('svg');

function render(){
  const s=steps[current];
  const total=steps.length-1;
  document.getElementById('stepNum').textContent=current;
  document.getElementById('stepDesc').textContent=s.desc;
  document.getElementById('prevBtn').disabled=current<=0;
  document.getElementById('nextBtn').disabled=current>=total;

  let html='';
  // Background columns
  html+='<rect x="40" y="10" width="380" height="330" rx="12" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="1" opacity="0.5"/>';
  html+='<rect x="440" y="10" width="380" height="330" rx="12" fill="var(--sub-bg)" stroke="var(--cell-border)" stroke-width="1" opacity="0.5"/>';

  // Labels
  html+='<text x="'+mainX+'" y="35" text-anchor="middle" fill="#42A5F5" font-size="14" font-weight="bold">主栈 Main</text>';
  html+='<text x="'+minX+'" y="35" text-anchor="middle" fill="#66BB6A" font-size="14" font-weight="bold">最小栈 Min</text>';

  // Draw stacks
  html+=drawStack(s.main, mainX, '#42A5F5', s.op, s.opV, s.phase);
  html+=drawStack(s.min, minX, '#66BB6A', s.op, s.opV, s.phase);

  // Step indicator
  if(s.phase!=='init'){
    html+='<text x="420" y="320" text-anchor="middle" fill="var(--muted)" font-size="11">步骤 '+current+'/'+total+' · '+s.desc+'</text>';
  }

  svg.innerHTML=html;
}

function goStep(n){current=Math.max(0,Math.min(n,steps.length-1));render()}
function toggleAuto(){
  if(autoRun){clearInterval(autoTimer);autoRun=false;document.getElementById('playBtn').textContent='\u25B6 自动播放';document.getElementById('playBtn').style.background='';document.getElementById('playBtn').style.color='';document.getElementById('playBtn').classList.remove('play-btn');}
  else{autoRun=true;document.getElementById('playBtn').textContent='\u23F8 暂停';document.getElementById('playBtn').style.background='#1976D2';document.getElementById('playBtn').style.color='#fff';document.getElementById('playBtn').classList.add('play-btn');if(current>=steps.length-1)goStep(0);autoTimer=setInterval(function(){if(current<steps.length-1)goStep(current+1);else toggleAuto()},900);}
}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')goStep(current+1);if(e.key==='ArrowLeft')goStep(current-1);if(e.key===' '){e.preventDefault();toggleAuto();}});
render();
</script>
</body>
</html>
