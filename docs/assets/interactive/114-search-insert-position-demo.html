<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>114. 搜索插入位置 - 二分查找</title>
<style>
:root {
  --bg: #f5f6fa; --card: #fff; --text: #2d3436; --sub: #636e72;
  --border: #dfe6e9; --blue: #0984e3; --red: #e17055; --green: #00b894;
  --blue-bg: #dff6fd; --hl-mid: #ffeaa7; --l-color: #6c5ce7; --r-color: #e17055;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a2e; --card: #16213e; --text: #eee; --sub: #aaa;
    --border: #2d3436; --blue: #74b9ff; --red: #ff7675; --green: #55efc4;
    --blue-bg: #1a3a5c; --hl-mid: #5c4a1f; --l-color: #a29bfe; --r-color: #ff7675;
  }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; }
.container { width:860px; height:480px; background:var(--card); border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; gap:10px; box-shadow:0 2px 12px rgba(0,0,0,0.1); }
.header { display:flex; justify-content:space-between; align-items:center; }
.header h2 { font-size:17px; color:var(--text); }
.step-badge { font-size:13px; color:var(--sub); background:var(--border); padding:4px 12px; border-radius:8px; font-weight:500; }
.info-panel { background:var(--blue-bg); border-left:3px solid var(--blue); padding:10px 14px; border-radius:8px; font-size:14px; color:var(--text); min-height:44px; display:flex; align-items:center; }
.array-grid { display:flex; gap:4px; justify-content:center; align-items:flex-end; flex:1; position:relative; }
.cell { width:70px; height:62px; border-radius:8px; background:var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:600; font-size:22px; color:var(--text); position:relative; z-index:2; transition:all 0.3s; }
.cell .idx { font-size:10px; color:var(--sub); margin-top:2px; }
.cell.l-ptr { box-shadow:0 0 0 3px var(--l-color); }
.cell.r-ptr { box-shadow:0 0 0 3px var(--r-color); }
.cell.mid { background:var(--hl-mid); box-shadow:0 0 0 2px var(--blue); }
.cell.target { border:2px solid var(--green); }
.pointers { display:flex; gap:24px; justify-content:center; font-size:13px; font-weight:600; }
.ptr-l { color:var(--l-color); } .ptr-r { color:var(--r-color); } .ptr-m { color:var(--blue); }
.controls { display:flex; gap:8px; justify-content:center; }
.btn { padding:7px 16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); cursor:pointer; font-size:13px; font-family:inherit; transition:all 0.15s; }
.btn:hover { background:var(--blue-bg); border-color:var(--blue); }
.btn:active { transform:scale(0.96); }
.key-hint { font-size:11px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>114. 搜索插入位置 (二分查找)</h2>
    <span class="step-badge" id="stepBadge">步骤 0/6</span>
  </div>
  <div class="info-panel" id="info"></div>
  <div class="pointers">
    <span class="ptr-l" id="ptrL">left = 0</span>
    <span class="ptr-m" id="ptrM">mid = ?</span>
    <span class="ptr-r" id="ptrR">right = 3</span>
  </div>
  <div class="array-grid" id="grid"></div>
  <div class="controls">
    <button class="btn" onclick="reset()">重置</button>
    <button class="btn" onclick="prev()">上步</button>
    <button class="btn" onclick="next()">下步</button>
    <button class="btn" id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button class="btn" onclick="goLast()">跳到最后</button>
  </div>
  <div class="key-hint">键盘: &#8592; &#8593; 上步 | &#8594; &#8595; 下步 | 空格 自动播放 | R 重置 | End 跳到最后</div>
</div>
<script>
const nums = [1,3,5,6], target = 5;
const n = nums.length;
let steps = [], cur = 0, autoTimer = null, running = false;

function buildSteps() {
  steps = [];
  let l = 0, r = n - 1;
  steps.push({l,r,mid:-1,desc:'初始化 left=0, right=3',done:false});
  while (l <= r) {
    let mid = Math.floor((l + r) / 2);
    let desc = `mid = (${l}+${r})/2 = ${mid}, nums[${mid}]=${nums[mid]}`;
    if (nums[mid] === target) { desc += ` = target，找到! 答案=${mid}`; steps.push({l,r,mid,desc,done:true}); return; }
    else if (nums[mid] < target) { desc += ` < target, left=mid+1=${mid+1}`; l = mid + 1; }
    else { desc += ` > target, right=mid-1=${mid-1}`; r = mid - 1; }
    steps.push({l,r,mid,desc,done:false});
  }
  steps.push({l,r,mid:-1,desc:`循环结束, 插入位置=${l}`,done:true});
}
buildSteps();

function render() {
  const s = steps[cur];
  document.getElementById('stepBadge').textContent = `步骤 ${cur}/${steps.length-1}`;
  document.getElementById('info').textContent = s.desc;
  document.getElementById('autoBtn').textContent = running ? '停止' : '自动播放';
  document.getElementById('ptrL').textContent = `left = ${s.l}`;
  document.getElementById('ptrR').textContent = `right = ${s.r}`;
  document.getElementById('ptrM').textContent = s.mid >= 0 ? `mid = ${s.mid}` : 'mid = ?';
  const grid = document.getElementById('grid');
  let html = '';
  for (let i = 0; i < n; i++) {
    let cls = 'cell';
    if (i === s.l) cls += ' l-ptr';
    if (i === s.r) cls += ' r-ptr';
    if (i === s.mid) cls += ' mid';
    if (nums[i] === target) cls += ' target';
    html += `<div class="${cls}"><span>${nums[i]}</span><span class="idx">${i}</span></div>`;
  }
  grid.innerHTML = html;
}
function reset() { stopAuto(); cur = 0; render(); }
function prev() { if (cur > 0) { cur--; render(); } }
function next() { if (cur < steps.length - 1) { cur++; render(); } else { stopAuto(); } }
function goLast() { stopAuto(); cur = steps.length - 1; render(); }
function toggleAuto() { running ? stopAuto() : startAuto(); }
function startAuto() { running = true; render(); autoStep(); }
function stopAuto() { running = false; if (autoTimer) clearTimeout(autoTimer); render(); }
function autoStep() { if (!running) return; if (cur < steps.length - 1) { cur++; render(); autoTimer = setTimeout(autoStep, 600); } else { stopAuto(); } }
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); next(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); reset(); }
  else if (e.key === 'End') { e.preventDefault(); goLast(); }
});
render();
</script>
</body>
</html>
