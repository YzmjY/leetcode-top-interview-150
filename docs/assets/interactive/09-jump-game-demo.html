<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --reach-green: #388E3C; --active-orange: #FF9800;
    --grayed: #bbb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd;
      --btn-bg: #333; --btn-hover: #444;
      --grayed: #555;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 20px;
  }
  .container { max-width: 620px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 12px; }

  .progress-wrap {
    margin-bottom: 16px; padding: 0 20px;
  }
  .progress-label {
    font-size: 11px; color: var(--muted); margin-bottom: 4px;
    display: flex; justify-content: space-between;
  }
  .progress-track {
    height: 10px; background: var(--cell-bg);
    border-radius: 5px; overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #1976D2, #42A5F5);
    border-radius: 5px; transition: width 0.4s;
  }
  .progress-marker {
    position: absolute; top: -2px; width: 4px; height: 14px;
    background: var(--active-orange); border-radius: 2px;
    transition: left 0.4s;
  }

  .cell-grid {
    display: flex; justify-content: center; gap: 8px; margin-bottom: 12px;
    position: relative;
  }
  .cell {
    width: 68px; height: 68px;
    background: var(--cell-bg);
    border: 2px solid var(--cell-border);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold; color: var(--text);
    position: relative;
    transition: border-color 0.25s, background 0.25s, opacity 0.3s;
  }
  .cell .jump-range {
    font-size: 10px; font-weight: normal; color: var(--muted);
    margin-top: 2px;
  }
  .cell .step-tag {
    position: absolute; top: -7px; right: -7px;
    background: #1976D2; color: #fff;
    font-size: 9px; font-weight: bold; width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.5);
    transition: opacity 0.25s, transform 0.25s;
  }
  .cell .step-tag.show { opacity: 1; transform: scale(1); }
  .cell.reachable { border-color: var(--reach-green); background: rgba(56,142,60,0.08); }
  .cell.active { border-color: var(--active-orange); transform: scale(1.06); background: rgba(255,152,0,0.1); }
  .cell.unreachable { opacity: 0.35; }

  /* Jump arcs */
  .jump-arc {
    position: absolute; pointer-events: none;
    border: 2px dashed #1976D2; border-radius: 50% 50% 0 0;
    border-bottom: none;
    opacity: 0; transition: opacity 0.3s;
  }
  .jump-arc.show { opacity: 0.6; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 6px; font-size: 14px;
  }
  .step-num { font-weight: bold; font-size: 24px; color: #1976D2; min-width: 36px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; }

  .state-row {
    display: flex; justify-content: center; gap: 24px;
    background: rgba(25,118,210,0.06); border-radius: 8px;
    padding: 8px 14px; margin-bottom: 10px; font-size: 13px;
  }
  .state-item { text-align: center; }
  .state-val { font-size: 18px; font-weight: bold; color: #1976D2; }
  .state-label { font-size: 11px; color: var(--muted); }
  .state-val.success { color: var(--reach-green); }
  .state-val.fail { color: #EF5350; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }

  .legend {
    display: flex; gap: 20px; justify-content: center; margin-top: 10px;
    font-size: 12px; color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>
<div class="container">
  <h2>跳跃游戏 — 逐步交互演示</h2>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>当前 maxReach</span>
      <span id="maxReachLabel">0</span>
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
      <div class="progress-marker" id="progressMarker" style="left:0%"></div>
    </div>
  </div>

  <div class="cell-grid" id="cellGrid"></div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">/ 6 步 · 点击「下一步」开始</span>
  </div>

  <div class="state-row">
    <div class="state-item">
      <div class="state-val" id="idxVal">--</div>
      <div class="state-label">当前位置 i</div>
    </div>
    <div class="state-item">
      <div class="state-val" id="jumpVal">--</div>
      <div class="state-label">nums[i] 可跳步数</div>
    </div>
    <div class="state-item">
      <div class="state-val" id="reachVal">0</div>
      <div class="state-label">maxReach = max(i+nums[i])</div>
    </div>
    <div class="state-item">
      <div class="state-val" id="resultVal">--</div>
      <div class="state-label">结果</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">⏮ 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">◀ 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 ▶</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">▶ 自动播放</button>
    <button onclick="goStep(totalSteps)" title="跳到最终状态">⏭ 跳到最后</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#FF9800"></div> 当前扫描位置</div>
    <div class="legend-item"><div class="legend-dot" style="background:#388E3C"></div> 在可达范围内</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--grayed)"></div> 不可达 (灰色)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1976D2"></div> 跳跃范围虚线</div>
  </div>
</div>

<script>
const nums = [2, 3, 1, 1, 4];
const n = nums.length;
const totalSteps = 6; // 0:init, 1-5: i=0..4, 6: result

const steps = [];
{
  steps.push({ i: -1, val: null, maxReach: 0, reachable: false, desc: '初始化' });
  let maxReach = 0;
  for (let i = 0; i < n; i++) {
    const reachable = i <= maxReach;
    const newReach = reachable ? Math.max(maxReach, i + nums[i]) : maxReach;
    let desc;
    if (!reachable) {
      desc = `i=${i} 不可达 (i>maxReach=${maxReach}) → 无法继续`;
    } else {
      desc = `i=${i} nums[${i}]=${nums[i]} · maxReach=max(${maxReach},${i}+${nums[i]})=${newReach}`;
    }
    steps.push({ i, val: nums[i], maxReach: reachable ? newReach : maxReach, reachable, desc });
    maxReach = newReach;
    if (!reachable) break;
  }
}

let current = 0;
let autoTimer = null;
let autoRunning = false;

// Build cells
const cellGrid = document.getElementById('cellGrid');
const cells = [];
nums.forEach((val, i) => {
  const div = document.createElement('div');
  div.className = 'cell';
  div.innerHTML = `${val}<span class="jump-range">跳${i+val}</span><span class="step-tag"></span>`;
  div.dataset.idx = i;
  cellGrid.appendChild(div);
  cells.push(div);
});

function render() {
  const s = steps[current];

  // Reset cells
  cells.forEach((cell, i) => {
    cell.classList.remove('reachable', 'active', 'unreachable');
    const tag = cell.querySelector('.step-tag');
    tag.classList.remove('show');
    tag.textContent = '';
  });

  // Mark reachable cells
  const maxR = s.maxReach;
  for (let i = 0; i < n; i++) {
    if (i <= maxR && s.reachable !== false) {
      cells[i].classList.add('reachable');
    }
  }

  // Mark unreachable
  if (s.i >= 0 && !s.reachable) {
    for (let i = s.i; i < n; i++) {
      cells[i].classList.add('unreachable');
    }
  }

  // Active cell
  if (s.i >= 0 && s.reachable) {
    cells[s.i].classList.add('active');
  }

  // Step tags for processed
  for (let i = 0; i < current && i < cells.length; i++) {
    const tag = cells[i].querySelector('.step-tag');
    tag.textContent = i + 1;
    tag.classList.add('show');
  }

  // Progress bar
  const pct = Math.min(100, Math.round((maxR / (n - 1)) * 100));
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('maxReachLabel').textContent = maxR;
  document.getElementById('progressMarker').style.left = (s.i >= 0 ? Math.round((s.i / (n - 1)) * 100) : 0) + '%';

  // Info
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = s.desc;
  document.getElementById('idxVal').textContent = s.i >= 0 ? s.i : '--';
  document.getElementById('jumpVal').textContent = s.val !== null ? s.val : '--';
  document.getElementById('reachVal').textContent = s.maxReach;

  const resultVal = document.getElementById('resultVal');
  resultVal.classList.remove('success', 'fail');
  if (s.maxReach >= n - 1) {
    resultVal.textContent = '可达终点!';
    resultVal.classList.add('success');
  } else if (!s.reachable) {
    resultVal.textContent = '无法到达!';
    resultVal.classList.add('fail');
  } else {
    resultVal.textContent = '扫描中...';
  }

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= totalSteps;
}

function goStep(n) {
  current = Math.max(0, Math.min(n, totalSteps));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer);
    autoRunning = false;
    document.getElementById('playBtn').textContent = '▶ 自动播放';
    document.getElementById('playBtn').classList.remove('play-btn');
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
  } else {
    document.getElementById('playBtn').textContent = '⏸ 暂停';
    document.getElementById('playBtn').classList.add('play-btn');
    document.getElementById('playBtn').style.background = '#1976D2';
    document.getElementById('playBtn').style.color = '#fff';
    autoRunning = true;
    if (current >= totalSteps) goStep(0);
    autoTimer = setInterval(() => {
      if (current < totalSteps) goStep(current + 1);
      else toggleAuto();
    }, 700);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
