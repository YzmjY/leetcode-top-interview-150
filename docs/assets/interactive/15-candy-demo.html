<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --color-left: #1976D2; --color-right: #F9A825; --color-final: #388E3C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd;
      --btn-bg: #333; --btn-hover: #444;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 20px;
  }
  .container { max-width: 650px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 10px; }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 8px; font-size: 14px; flex-wrap: wrap;
  }
  .step-num { font-weight: bold; font-size: 22px; color: #1976D2; min-width: 35px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 12px; max-width: 380px; }

  .var-panel {
    background: #F5F5F5; border-radius: 8px; padding: 6px 14px;
    margin-bottom: 8px; font-family: monospace; font-size: 12px;
    color: var(--text); text-align: center;
  }
  @media (prefers-color-scheme: dark) { .var-panel { background: #2a2a3e; } }

  .children-row {
    display: flex; justify-content: center; gap: 16px; margin-bottom: 10px;
  }
  .child-card {
    width: 130px; border: 2px solid var(--cell-border);
    border-radius: 8px; background: var(--cell-bg);
    text-align: center; transition: border-color 0.25s, background 0.25s, transform 0.15s;
    overflow: hidden;
  }
  .child-card .rating-row {
    background: #f0f0f0; padding: 6px; font-size: 13px; font-weight: bold;
  }
  @media (prefers-color-scheme: dark) { .child-card .rating-row { background: #333; } }
  .child-card .rating-val {
    font-size: 28px; font-weight: bold; display: block;
  }
  .child-card .candy-section {
    padding: 6px 8px;
  }
  .child-card .lr-row {
    display: flex; justify-content: center; gap: 12px; margin: 4px 0;
  }
  .child-card .lr-item {
    font-size: 14px; font-weight: bold;
    padding: 3px 8px; border-radius: 4px;
    min-width: 36px;
  }
  .lr-left { background: #E3F2FD; color: #1565C0; }
  .lr-right { background: #FFF9C4; color: #F57F17; }
  @media (prefers-color-scheme: dark) {
    .lr-left { background: #1a3a5e; color: #64B5F6; }
    .lr-right { background: #3e3a1a; color: #FFD54F; }
  }
  .child-card .final-row {
    padding: 4px 8px 8px;
    font-size: 20px; font-weight: bold;
  }
  .final-val {
    padding: 4px 12px; border-radius: 6px; display: inline-block;
  }
  .final-set { background: #E8F5E9; color: #2E7D32; }
  @media (prefers-color-scheme: dark) { .final-set { background: #1a3e1a; color: #81C784; } }

  .child-card.active-left { border-color: var(--color-left); transform: scale(1.04); }
  .child-card.active-right { border-color: var(--color-right); transform: scale(1.04); }
  .child-card.active-final { border-color: var(--color-final); transform: scale(1.04); }

  .phase-badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px;
    font-weight: bold;
  }
  .phase-init { background: #eee; color: #666; }
  .phase-lr { background: #E3F2FD; color: #1565C0; }
  .phase-rl { background: #FFF9C4; color: #F57F17; }
  .phase-final { background: #E8F5E9; color: #2E7D32; }
  @media (prefers-color-scheme: dark) {
    .phase-init { background: #444; color: #ccc; }
    .phase-lr { background: #1a3a5e; color: #64B5F6; }
    .phase-rl { background: #3e3a1a; color: #FFD54F; }
    .phase-final { background: #1a3e1a; color: #81C784; }
  }

  .total-bar {
    text-align: center; font-size: 13px; margin-bottom: 8px;
  }
  .total-bar span { font-weight: bold; color: var(--color-final); font-size: 18px; }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }
</style>
</head>
<body>
<div class="container">
  <h2>分发糖果 — 逐步交互演示</h2>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">/ 7 步 · 点击「下一步」开始</span>
    <span class="phase-badge phase-init" id="phaseBdg">初始</span>
  </div>

  <div class="var-panel" id="varPanel">
    ratings = [1, 0, 2] &nbsp; 每个孩子至少 1 颗糖
  </div>

  <div class="children-row" id="childrenRow"></div>

  <div class="total-bar" id="totalBar">
    总糖果数: <span id="totalCandy">3</span>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">自动播放</button>
    <button onclick="goStep(totalSteps)" id="endBtn">跳到最后</button>
  </div>
</div>

<script>
const ratings = [1, 0, 2];
const n = ratings.length;
const totalSteps = 7;

// Build steps
const steps = [];
// Left-candy and right-candy arrays
const leftCandy = [1, 1, 1];
const rightCandy = [1, 1, 1];
const finalCandy = [0, 0, 0];

steps.push({
  phase: 'init', activeIdx: -1, activeSide: '',
  left: [1,1,1], right: [1,1,1], final: [null,null,null],
  desc: '初始：每个孩子至少 1 颗糖', varText: 'candy(left) = [1,1,1]  candy(right) = [1,1,1]'
});

// Left to Right pass
for (let i = 0; i < n; i++) {
  if (i > 0 && ratings[i] > ratings[i-1]) {
    leftCandy[i] = leftCandy[i-1] + 1;
  }
  steps.push({
    phase: 'lr', activeIdx: i, activeSide: 'left',
    left: [...leftCandy], right: [...rightCandy], final: [null,null,null],
    desc: i === 0
      ? '左→右: 孩子 0，左侧无邻居，candy[0]=1'
      : ratings[i] > ratings[i-1]
        ? '左→右: 孩子 ' + i + '，评分 ' + ratings[i] + ' > ' + ratings[i-1] + '，candy[' + i + ']=candy[' + (i-1) + ']+1=' + leftCandy[i]
        : '左→右: 孩子 ' + i + '，评分 ' + ratings[i] + ' <= ' + ratings[i-1] + '，candy[' + i + ']=1',
    varText: '左→右遍历 · candy(left)=[' + leftCandy.join(',') + ']'
  });
}

// Right to Left pass
const finalCandyVals = [...leftCandy];
for (let i = n - 1; i >= 0; i--) {
  if (i < n - 1 && ratings[i] > ratings[i+1]) {
    rightCandy[i] = rightCandy[i+1] + 1;
  }
  finalCandyVals[i] = Math.max(leftCandy[i], rightCandy[i]);
  steps.push({
    phase: 'rl', activeIdx: i, activeSide: 'right',
    left: [...leftCandy], right: [...rightCandy], final: [...finalCandyVals],
    desc: i === n - 1
      ? '右→左: 孩子 ' + i + '，右侧无邻居，candy[' + i + ']=max(' + leftCandy[i] + ', 1)=' + finalCandyVals[i]
      : ratings[i] > ratings[i+1]
        ? '右→左: 孩子 ' + i + '，评分 ' + ratings[i] + ' > ' + ratings[i+1] + '，rightCandy=' + rightCandy[i] + '，candy[' + i + ']=max(' + leftCandy[i] + ',' + rightCandy[i] + ')=' + finalCandyVals[i]
        : '右→左: 孩子 ' + i + '，评分 ' + ratings[i] + ' <= ' + ratings[i+1] + '，candy[' + i + ']=max(' + leftCandy[i] + ',1)=' + finalCandyVals[i],
    varText: '右→左遍历 · candy(right)=[' + rightCandy.join(',') + '] · final=max(left,right)'
  });
}

let current = 0;
let autoTimer = null;
let autoRunning = false;

// Build child cards
const childrenRow = document.getElementById('childrenRow');
for (let i = 0; i < n; i++) {
  const div = document.createElement('div');
  div.className = 'child-card';
  div.dataset.idx = i;
  div.innerHTML =
    '<div class="rating-row">孩子 ' + i + '<span class="rating-val">' + ratings[i] + '</span><span style="font-size:11px;">评分</span></div>' +
    '<div class="candy-section">' +
    '<div style="font-size:10px;color:var(--muted);margin-bottom:2px;">糖果分配</div>' +
    '<div class="lr-row">' +
    '<span class="lr-item lr-left" id="leftVal' + i + '">1</span>' +
    '<span class="lr-item lr-right" id="rightVal' + i + '">1</span>' +
    '</div>' +
    '<div style="font-size:10px;color:var(--muted);margin-bottom:2px;">左遍历~右遍历</div>' +
    '</div>' +
    '<div class="final-row"><span class="final-val" id="finalVal' + i + '">-</span></div>';
  childrenRow.appendChild(div);
}

function render() {
  const s = steps[current];
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = current === 0
    ? '/ ' + totalSteps + ' 步 · 点击「下一步」开始'
    : '第 ' + current + ' 步 · ' + s.desc;
  document.getElementById('varPanel').textContent = s.varText;

  const bdg = document.getElementById('phaseBdg');
  if (s.phase === 'init') { bdg.textContent = '初始'; bdg.className = 'phase-badge phase-init'; }
  else if (s.phase === 'lr') { bdg.textContent = '左→右'; bdg.className = 'phase-badge phase-lr'; }
  else { bdg.textContent = '右→左'; bdg.className = 'phase-badge phase-rl'; }

  // Update cards
  document.querySelectorAll('.child-card').forEach(el => {
    el.classList.remove('active-left','active-right','active-final');
    const i = parseInt(el.dataset.idx);
    document.getElementById('leftVal' + i).textContent = s.left[i];
    document.getElementById('rightVal' + i).textContent = s.right[i];
    const fv = document.getElementById('finalVal' + i);
    const fe = fv.parentElement.querySelector('.final-val');
    if (s.final[i] !== null) {
      fv.textContent = s.final[i];
      fe.classList.add('final-set');
    } else {
      fv.textContent = '-';
      fe.classList.remove('final-set');
    }
    if (i === s.activeIdx) {
      if (s.activeSide === 'left') el.classList.add('active-left');
      else if (s.activeSide === 'right') el.classList.add('active-right');
    }
    // Highlight final values when phase is rl and we've passed this index
    if (s.phase === 'rl' && i >= s.activeIdx) {
      el.classList.add('active-final');
    }
  });

  // Total candy
  let total = 0;
  if (current === totalSteps) {
    total = s.final.reduce((a,b) => a + b, 0);
  } else if (s.phase === 'rl' && s.final[0] !== null) {
    total = s.final.reduce((a,b) => a + (b !== null ? b : 0), 0);
  } else {
    total = s.left.reduce((a,b) => a + b, 0);
  }
  document.getElementById('totalCandy').textContent = total;

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= totalSteps;
  document.getElementById('endBtn').disabled = current >= totalSteps;
}

function goStep(n) {
  current = Math.max(0, Math.min(n, totalSteps));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer); autoRunning = false;
    document.getElementById('playBtn').textContent = '自动播放';
    document.getElementById('playBtn').style.background = '#1976D2';
  } else {
    autoRunning = true;
    if (current >= totalSteps) goStep(0);
    autoTimer = setInterval(() => {
      if (current < totalSteps) goStep(current + 1);
      else { clearInterval(autoTimer); autoRunning = false;
        document.getElementById('playBtn').textContent = '自动播放'; }
    }, 800);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
