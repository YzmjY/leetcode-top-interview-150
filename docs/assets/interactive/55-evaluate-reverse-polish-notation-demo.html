<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>55. 逆波兰表达式求值 - 可视化演示</title>
<style>
:root {
  --bg: #f8f9fa; --card-bg: #fff; --text: #212529; --text-secondary: #6c757d;
  --border: #dee2e6; --btn-bg: #e9ecef; --btn-hover: #dee2e6; --btn-active: #0d6efd;
  --btn-active-text: #fff; --stack-bg: #f1f3f5; --tok-bg: #e9ecef;
  --blue: #228be6; --green: #40c057; --red: #fa5252; --orange: #fd7e14;
  --step-bg: #e7f5ff;
}
@media (prefers-color-scheme: dark) {
:root {
  --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-secondary: #a0a0a0;
  --border: #3a3a5c; --btn-bg: #2a2a4a; --btn-hover: #3a3a5c; --btn-active: #339af0;
  --btn-active-text: #fff; --stack-bg: #1e1e3a; --tok-bg: #2a2a4a; --step-bg: #1a2a3a;
}
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center; padding: 20px;
}
.container {
  width: 100%; max-width: 900px; height: 500px;
  background: var(--card-bg); border-radius: 8px;
  border: 1px solid var(--border); padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.step-panel {
  background: var(--step-bg); border-radius: 8px; padding: 8px 16px;
  display: flex; justify-content: space-between; align-items: center; font-size: 14px;
}
.step-num { font-weight: 700; color: var(--btn-active); }
.step-desc { flex: 1; margin-left: 16px; }
.main-area { display: flex; gap: 16px; flex: 1; min-height: 0; }
.tok-grid {
  flex: 0 0 340px; display: flex; flex-wrap: wrap; gap: 6px;
  align-content: flex-start; overflow-y: auto;
}
.tok-cell {
  width: 52px; height: 44px; border-radius: 8px; background: var(--tok-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; font-family: "Consolas", monospace;
  border: 2px solid var(--border); transition: all 0.3s;
}
.tok-cell.num { border-color: var(--blue); color: var(--blue); background: rgba(34,139,230,0.08); }
.tok-cell.op { border-color: var(--orange); color: var(--orange); background: rgba(253,126,20,0.08); }
.tok-cell.current { transform: scale(1.12); box-shadow: 0 0 10px rgba(13,110,253,0.5); }
.tok-cell.done { border-color: var(--green); color: var(--green); opacity: 0.6; }
.stack-panel {
  flex: 1; background: var(--stack-bg); border-radius: 8px; padding: 12px;
  border: 1px solid var(--border); display: flex; flex-direction: column;
}
.stack-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.stack-items { flex: 1; display: flex; flex-direction: column-reverse; gap: 4px; overflow-y: auto; }
.stack-item {
  height: 34px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-family: "Consolas", monospace; font-size: 16px;
  border: 1px solid var(--border); background: var(--tok-bg); transition: all 0.3s;
}
.stack-item.pushed { border-color: var(--blue); background: rgba(34,139,230,0.1); }
.stack-item.popping { border-color: var(--red); background: rgba(250,82,82,0.1); }
.stack-item.result { border-color: var(--green); background: rgba(64,192,87,0.12); }
.result-line {
  padding: 6px 12px; background: var(--stack-bg); border-radius: 8px; border: 1px solid var(--border);
  font-size: 14px; font-weight: 700; color: var(--green);
}
.controls {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.controls button {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--btn-bg); color: var(--text); cursor: pointer;
  font-size: 13px; font-family: inherit; transition: all 0.15s;
}
.controls button:hover { background: var(--btn-hover); }
.controls button.active { background: var(--btn-active); color: var(--btn-active-text); border-color: var(--btn-active); }
</style>
</head>
<body>
<div class="container">
  <div class="step-panel">
    <span class="step-num" id="stepNum">步骤 0 / 0</span>
    <span class="step-desc" id="stepDesc">初始状态</span>
  </div>
  <div class="main-area">
    <div class="tok-grid" id="tokGrid"></div>
    <div class="stack-panel">
      <div class="stack-label">计算栈</div>
      <div class="stack-items" id="stackItems"></div>
      <div class="result-line" style="margin-top:8px;"><strong>结果: </strong><span id="resultVal"></span></div>
    </div>
  </div>
  <div class="controls">
    <button onclick="reset()">重置</button>
    <button onclick="prevStep()">上步</button>
    <button onclick="nextStep()">下步</button>
    <button id="autoBtn" onclick="toggleAuto()">自动播放</button>
    <button onclick="goEnd()">跳到最后</button>
  </div>
</div>
<script>
const tokens = ["2","1","+","3","*"];
const steps = [];
let stack = [];
let stepIdx = -1;

function buildSteps() {
  steps.length = 0;
  stack = [];
  const cells = Array(tokens.length).fill('default');
  steps.push({ stack: [...stack], cells: [...cells], desc: '初始状态：准备处理表达式', opType: '' });

  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    const cells = Array(tokens.length).fill('default');
    for (let j = 0; j < i; j++) cells[j] = 'done';
    cells[i] = 'current ' + ('+-*/'.includes(t) ? 'op' : 'num');

    if ('+-*/'.includes(t)) {
      const b = stack.pop();
      const a = stack.pop();
      let result;
      if (t === '+') result = a + b;
      else if (t === '-') result = a - b;
      else if (t === '*') result = a * b;
      else result = Math.trunc(a / b);
      stack.push(result);
      steps.push({
        stack: [...stack], cells: [...cells],
        desc: `遇到运算符 '${t}'：弹出 ${a} 和 ${b}，计算 ${a} ${t} ${b} = ${result}，入栈`,
        opType: 'calc', a, b, result
      });
    } else {
      const num = parseInt(t);
      stack.push(num);
      steps.push({ stack: [...stack], cells: [...cells], desc: `遇到数字 ${num}，入栈`, opType: 'push' });
    }
  }

  const finalCells = Array(tokens.length).fill('done');
  steps.push({ stack: [...stack], cells: finalCells, desc: `计算完成！最终结果: ${stack[0]}`, opType: 'end' });
}

function render() {
  const st = steps[Math.min(stepIdx, steps.length - 1)];
  document.getElementById('stepNum').textContent = `步骤 ${stepIdx + 1} / ${steps.length}`;
  document.getElementById('stepDesc').textContent = st.desc;
  document.getElementById('resultVal').textContent = stepIdx === steps.length - 1 ? st.stack[0] : (st.stack.length > 0 ? '计算中...' : '');

  const grid = document.getElementById('tokGrid');
  grid.innerHTML = '';
  tokens.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'tok-cell ' + (st.cells[i] || 'default');
    div.textContent = t;
    grid.appendChild(div);
  });

  const si = document.getElementById('stackItems');
  si.innerHTML = '';
  st.stack.forEach((v, i) => {
    const div = document.createElement('div');
    div.className = 'stack-item';
    if (stepIdx > 0) {
      const prevStack = steps[stepIdx - 1].stack;
      if (st.opType === 'push' && i === st.stack.length - 1 && st.stack.length > prevStack.length) div.className += ' pushed';
      if (st.opType === 'calc' && i === st.stack.length - 1) div.className += ' result';
    }
    div.textContent = v;
    si.appendChild(div);
  });
  if (st.stack.length === 0) {
    const empty = document.createElement('div');
    empty.textContent = '(空)'; empty.style.cssText = 'color:var(--text-secondary);text-align:center;';
    si.appendChild(empty);
  }

  document.getElementById('autoBtn').classList.toggle('active', autoRunning);
}

function reset() { stopAuto(); stepIdx = 0; render(); }
function prevStep() { stopAuto(); if (stepIdx > 0) stepIdx--; render(); }
function nextStep() { stopAuto(); if (stepIdx < steps.length - 1) stepIdx++; render(); }
function goEnd() { stopAuto(); stepIdx = steps.length - 1; render(); }

let autoRunning = false, autoTimer = null;
function toggleAuto() { autoRunning ? stopAuto() : startAuto(); }
function startAuto() { autoRunning = true; render(); autoStep(); }
function stopAuto() { autoRunning = false; if (autoTimer) clearTimeout(autoTimer); render(); }
function autoStep() {
  if (!autoRunning) return;
  if (stepIdx < steps.length - 1) { stepIdx++; render(); autoTimer = setTimeout(autoStep, 900); }
  else stopAuto();
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextStep();
  else if (e.key === 'ArrowLeft') prevStep();
  else if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});
buildSteps();
reset();
</script>
</body>
</html>
