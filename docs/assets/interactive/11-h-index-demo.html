<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #fff; --text: #333; --muted: #888;
    --cell-bg: #fafafa; --cell-border: #d0d0d0;
    --header: #222;
    --btn-bg: #f0f0f0; --btn-hover: #e0e0e0;
    --bar-bg: #e0e0e0;
    --h-line: #1976D2; --meet-green: #388E3C;
    --active-orange: #FF9800; --fail-red: #EF5350;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e; --text: #ddd; --muted: #aaa;
      --cell-bg: #222; --cell-border: #444;
      --header: #ddd;
      --btn-bg: #333; --btn-hover: #444;
      --bar-bg: #333;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; padding: 20px;
  }
  .container { max-width: 600px; width: 100%; }
  h2 { text-align: center; color: var(--header); font-size: 18px; margin-bottom: 12px; }

  .chart-area {
    display: flex; justify-content: center; align-items: flex-end;
    gap: 16px; height: 170px; margin-bottom: 10px;
    padding: 0 8px;
    position: relative;
  }
  .bar-wrap {
    display: flex; flex-direction: column; align-items: center;
    width: 48px;
  }
  .bar {
    width: 34px; border-radius: 6px 6px 0 0;
    background: var(--bar-bg);
    transition: background 0.3s;
    position: relative;
  }
  .bar .step-tag {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: #1976D2; color: #fff;
    font-size: 8px; font-weight: bold; width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.25s;
  }
  .bar .step-tag.show { opacity: 1; }
  .bar-label { font-size: 12px; font-weight: bold; margin-top: 4px; color: var(--text); }
  .bar-rank { font-size: 10px; color: var(--muted); }

  .h-line-el {
    position: absolute; left: 0; right: 0; height: 2px;
    background: var(--h-line);
    opacity: 0; transition: opacity 0.3s, top 0.4s;
  }
  .h-line-el.show { opacity: 0.7; }
  .h-label {
    position: absolute; right: 0; font-size: 11px; font-weight: bold;
    color: var(--h-line); opacity: 0; transition: opacity 0.3s;
    transform: translateY(-50%);
  }
  .h-label.show { opacity: 1; }

  .cell-grid {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 10px;
  }
  .cell {
    width: 62px; height: 48px;
    background: var(--cell-bg);
    border: 2px solid var(--cell-border);
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 17px; font-weight: bold; color: var(--text);
    position: relative;
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
  }
  .cell .cell-rank {
    font-size: 9px; font-weight: normal; color: var(--muted);
  }
  .cell .step-tag {
    position: absolute; top: -7px; right: -7px;
    background: #1976D2; color: #fff;
    font-size: 9px; font-weight: bold; width: 20px; height: 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.5);
    transition: opacity 0.25s, transform 0.25s;
  }
  .cell .step-tag.show { opacity: 1; transform: scale(1); }
  .cell.meets-h { border-color: var(--meet-green); background: rgba(56,142,60,0.1); }
  .cell.active { border-color: var(--active-orange); transform: scale(1.06); }
  .cell.fails-h { border-color: var(--fail-red); background: rgba(239,83,80,0.1); }

  .info-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 6px; font-size: 14px;
  }
  .step-num { font-weight: bold; font-size: 24px; color: var(--h-line); min-width: 36px; text-align: center; }
  .step-desc { color: var(--muted); font-size: 13px; }

  .state-row {
    display: flex; justify-content: center; gap: 24px;
    background: rgba(25,118,210,0.06); border-radius: 8px;
    padding: 8px 14px; margin-bottom: 10px; font-size: 13px;
  }
  .state-item { text-align: center; }
  .state-val { font-size: 18px; font-weight: bold; color: var(--h-line); }
  .state-label { font-size: 11px; color: var(--muted); }

  .controls {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  button {
    padding: 8px 18px; border: 1px solid var(--cell-border); border-radius: 6px;
    background: var(--btn-bg); color: var(--text); font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.play-btn { background: #1976D2; color: #fff; border-color: #1565C0; }
  button.play-btn:hover { background: #1565C0; }

  .legend {
    display: flex; gap: 20px; justify-content: center; margin-top: 10px;
    font-size: 12px; color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>
<div class="container">
  <h2>H 指数 — 逐步交互演示</h2>

  <div class="chart-area" id="chartArea">
    <div class="h-line-el" id="hline"></div>
    <div class="h-label" id="hlabel">H</div>
  </div>

  <div class="cell-grid" id="cellGrid"></div>

  <div class="info-bar">
    <span class="step-num" id="stepNum">0</span>
    <span class="step-desc" id="stepDesc">/ 7 步 · 点击「下一步」开始</span>
  </div>

  <div class="state-row">
    <div class="state-item">
      <div class="state-val" id="idxVal">--</div>
      <div class="state-label">当前论文排名 i</div>
    </div>
    <div class="state-item">
      <div class="state-val" id="citVal">--</div>
      <div class="state-label">引用数 citations[i]</div>
    </div>
    <div class="state-item">
      <div class="state-val" id="checkVal">--</div>
      <div class="state-label">条件 >= i+1 ?</div>
    </div>
    <div class="state-item">
      <div class="state-val" id="hVal" style="color:var(--meet-green)">0</div>
      <div class="state-label">当前 H 指数</div>
    </div>
  </div>

  <div class="controls">
    <button onclick="goStep(0)">⏮ 重置</button>
    <button onclick="goStep(current-1)" id="prevBtn">◀ 上一步</button>
    <button onclick="goStep(current+1)" id="nextBtn">下一步 ▶</button>
    <button class="play-btn" onclick="toggleAuto()" id="playBtn">▶ 自动播放</button>
    <button onclick="goStep(totalSteps)" title="跳到最终状态">⏭ 跳到最后</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#388E3C"></div> 满足 h条件</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FF9800"></div> 当前检查</div>
    <div class="legend-item"><div class="legend-dot" style="background:#EF5350"></div> 不满足</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1976D2"></div> H 线</div>
  </div>
</div>

<script>
const citations = [3, 0, 6, 1, 5];
const sorted = [...citations].sort((a, b) => b - a); // [6,5,3,1,0]
const totalSteps = 7; // 0:init, 1:show sorted, 2-6: scan

const steps = [];
{
  steps.push({ i: -1, cit: null, h: 0, meets: null, desc: '原始数组: [3,0,6,1,5] → 降序排列' });

  let h = 0;
  for (let i = 0; i < sorted.length; i++) {
    const meets = sorted[i] >= i + 1;
    if (meets) h = i + 1;
    const desc = meets
      ? `排名${i+1}: citations[${i}]=${sorted[i]} >= ${i+1} → 满足! h=${h}`
      : `排名${i+1}: citations[${i}]=${sorted[i]} < ${i+1} → 不满足! 停止, h=${h}`;
    steps.push({ i, cit: sorted[i], h, meets, desc });
    if (!meets) break;
  }
}

let current = 0;
let autoTimer = null;
let autoRunning = false;

// Build chart
const chartArea = document.getElementById('chartArea');
const bars = [];
const maxCit = Math.max(...sorted);
sorted.forEach((v, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'bar-wrap';
  const h = Math.max(20, (v / maxCit) * 140);
  wrap.innerHTML = `
    <div class="bar" style="height:${h}px">
      <span class="step-tag"></span>
    </div>
    <span class="bar-label">${v}</span>
    <span class="bar-rank">#${i+1}</span>
  `;
  chartArea.appendChild(wrap);
  bars.push(wrap.querySelector('.bar'));
});

// Build cells
const cellGrid = document.getElementById('cellGrid');
const cells = [];
sorted.forEach((v, i) => {
  const div = document.createElement('div');
  div.className = 'cell';
  div.innerHTML = `${v}<span class="cell-rank">#${i+1}</span><span class="step-tag"></span>`;
  cellGrid.appendChild(div);
  cells.push(div);
});

// Index cells for h-line positioning
const barWraps = chartArea.querySelectorAll('.bar-wrap');

function render() {
  const s = steps[current];

  // Reset
  bars.forEach((b, i) => {
    b.style.background = 'var(--bar-bg)';
    b.style.border = 'none';
    const tag = b.querySelector('.step-tag');
    tag.classList.remove('show');
  });
  cells.forEach((cell, i) => {
    cell.classList.remove('meets-h', 'active', 'fails-h');
    const tag = cell.querySelector('.step-tag');
    tag.classList.remove('show');
    tag.textContent = '';
  });

  const hline = document.getElementById('hline');
  const hlabel = document.getElementById('hlabel');
  hline.classList.remove('show');
  hlabel.classList.remove('show');

  if (current > 0 && s.i >= 0) {
    // Mark meets-h for previous indices
    for (let j = 0; j < s.i; j++) {
      bars[j].style.background = '#388E3C';
      cells[j].classList.add('meets-h');
    }
    // Current
    if (s.meets) {
      bars[s.i].style.background = '#388E3C';
      cells[s.i].classList.add('meets-h');
    } else {
      bars[s.i].style.background = '#EF5350';
      cells[s.i].classList.add('fails-h');
    }
    cells[s.i].classList.add('active');
    bars[s.i].style.border = '3px solid #FF9800';
  }

  // Step tags for processed cells
  for (let t = 0; t < current && t < cells.length; t++) {
    const tag = cells[t].querySelector('.step-tag');
    tag.textContent = t + 1;
    tag.classList.add('show');
  }

  // H line
  if (s.h > 0) {
    // Position H line across bars
    const hVal = s.h;
    // Find the bar for rank hVal
    const targetBarIdx = hVal - 1; // 0-indexed
    if (targetBarIdx < bars.length) {
      const targetBar = bars[targetBarIdx];
      const barRect = targetBar.getBoundingClientRect();
      const areaRect = chartArea.getBoundingClientRect();
      const top = barRect.bottom - areaRect.top;
      hline.style.top = top + 'px';
      hline.style.opacity = '0.7';
      hline.classList.add('show');
      hlabel.style.top = top + 'px';
      hlabel.textContent = 'H=' + hVal;
      hlabel.classList.add('show');
    }
  } else {
    hline.classList.remove('show');
    hlabel.classList.remove('show');
  }

  // Info
  document.getElementById('stepNum').textContent = current;
  document.getElementById('stepDesc').textContent = s.desc;
  document.getElementById('idxVal').textContent = s.i >= 0 ? s.i + 1 : '--';
  document.getElementById('citVal').textContent = s.cit !== null ? s.cit : '--';
  document.getElementById('checkVal').textContent = s.meets === null ? '--' : s.meets ? s.cit + ' >= ' + (s.i + 1) + ' Yes' : s.cit + ' < ' + (s.i + 1) + ' No';
  document.getElementById('hVal').textContent = s.h;

  document.getElementById('prevBtn').disabled = current <= 0;
  document.getElementById('nextBtn').disabled = current >= totalSteps;
}

function goStep(n) {
  current = Math.max(0, Math.min(n, totalSteps));
  render();
}

function toggleAuto() {
  if (autoRunning) {
    clearInterval(autoTimer);
    autoRunning = false;
    document.getElementById('playBtn').textContent = '▶ 自动播放';
    document.getElementById('playBtn').classList.remove('play-btn');
    document.getElementById('playBtn').style.background = '';
    document.getElementById('playBtn').style.color = '';
  } else {
    document.getElementById('playBtn').textContent = '⏸ 暂停';
    document.getElementById('playBtn').classList.add('play-btn');
    document.getElementById('playBtn').style.background = '#1976D2';
    document.getElementById('playBtn').style.color = '#fff';
    autoRunning = true;
    if (current >= totalSteps) goStep(0);
    autoTimer = setInterval(() => {
      if (current < totalSteps) goStep(current + 1);
      else toggleAuto();
    }, 700);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goStep(current + 1);
  if (e.key === 'ArrowLeft') goStep(current - 1);
  if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

render();
</script>
</body>
</html>
